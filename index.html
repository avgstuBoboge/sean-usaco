const plans = {"python": ["读取输入并转换类型，区分 /、// 与 %。", "明确循环停止条件、break 的作用与计数位置。", "掌握 append、负数索引、原地修改和 tuple。", "用函数封装重复逻辑，使用字符串遍历数位。", "把升降序规则写成 tuple key，理解 lambda。", "理解实例、属性、__init__ 和 __lt__。", "先构造小数据，再用 print 或断点定位问题。", "结合学生成绩记录，复习属性、排序键与比较方法。"], "bronze": ["明确当前状态，先判断再更新。", "确定枚举范围，分析遗漏与复杂度。", "解释排序后的选择，主动寻找反例。", "按需求使用计数数组、set 和 dict。", "处理行列坐标、边界与邻格。", "区分递归调用和递推计算，明确终止条件。", "理解后进先出与先进先出，按需要使用列表或 deque。", "练习独立读题、实现、自测和复盘。"], "next": ["用一次预处理回答多次静态区间求和。", "先理解有序查找，再分析答案的单调性。", "维护移动区间，减少重复计算。", "在模拟与二维遍历稳定后，学习搜索顺序、访问标记和连通性。", "后续课程：用差分记录区间修改，再还原数组。", "独立编写静态区间求和程序。", "把相邻字符事件转为 0/1 后统计。", "了解乘积前缀的适用条件与取模限制。"], "homework": ["三道必做新题、一个调试练习和一道进阶选做题。", "基础区间和与课堂 AC 作业必做，分类求和选做，另附排序复习。", "独立编写误差计算模块，并在脚本与 Notebook 中验证。"], "lesson": ["掌握前缀和的含义、构建和区间查询。", "复习对象属性、初始化、比较规则与 tuple key。", "独立完成静态区间和程序，检查首尾边界。", "把相邻字符事件转成0/1，检查查询边界。", "了解适用条件，不作为本阶段掌握要求。"], "lesson03": ["核对解释器与内核，准备可运行的课程环境。", "使用 math、random、os，区分安装和导入。", "复习参数与返回值，在两个文件之间复用函数。", "批量处理测量值，理解 Notebook 的执行顺序。", "按家长调整后的计划，衔接科研所需 Python 基础。"], "environment": ["配置课程环境，核对脚本解释器与 Notebook 内核。", "区分安装和导入，使用 math、random、os。", "理解单元格执行顺序与内存状态。", "检查导入失败、未定义变量与旧输出。"], "modules": ["复习 return 与 print，使用函数处理一组数据。", "把函数放入自己的模块，理解导入后的名字。"], "roadmap": ["按知识基础逐步衔接科研所需的 Python 工具。"]};
const lessons = {"python/1": "<h2>输入后先确认类型</h2><p>input() 返回字符串。需要整数计算时用 int 转换；一行多个整数可用 split 和 map。</p><pre><code>n = int(input())\na, b = map(int, input().split())\nword = input().strip()</code></pre><h2>除法、整除与取模</h2><p>/ 返回浮点数；// 对商向下取整。处理题目中的正整数减半时使用 //。负数整除也向下取整，不是向零截断。</p><pre><code>print(9 / 2)    # 4.5\nprint(9 // 2)   # 4\nprint(9 % 2)    # 1\nprint(-3 // 2)  # -2</code></pre><h2>命名与输出</h2><p>用 nums、values、names 等名字保存列表，不用 list、str、sum 作变量名，以免遮蔽内置工具。提交程序时不要输出“请输入”等提示；调试输出在提交前删除。</p>", "python/2": "<h2>循环条件与计数</h2><p>先写清楚“什么时候继续”和“什么时候停止”。完成一次有效操作后再增加计数，避免停止时多加一次。布尔变量用 True / False，表达意图比字符串开关更清楚。</p><pre><code>value = 20\nsteps = 0\nwhile value &gt; 3:\n    value -= 3\n    steps += 1\nprint(value, steps)  # 2 6</code></pre><h2>while True 与 break</h2><p>先检查能否继续，再更新状态。break 只退出它所在的最近一层循环。多层循环中可用布尔标志把结果传到外层。</p><h2>for-else 的含义</h2><p>else 与 for 对齐。循环正常结束且未执行 break 时，才会执行 else；它不表示“最后一次 if 不成立”。</p><pre><code>values = [2, 4, 7]\nfor x in values:\n    if x % 2 == 1:\n        print(&quot;found odd&quot;)\n        break\nelse:\n    print(&quot;all even&quot;)</code></pre><h2>自己检查</h2><p>把例子分别改成全偶数、首个元素为奇数、最后一个为奇数，预测输出再运行。</p>", "python/3": "<h2>列表与下标</h2><p>长度为 n 的列表，下标范围是 0 到 n−1。倒数第 k 个元素可写 a[len(a)-k] 或 a[-k]，前提是 1 ≤ k ≤ len(a)。</p><pre><code>a = [12, 25, 38]\na.append(49)\nprint(a[-1])        # 49\nprint(a[len(a)-2])  # 38\nprint(a[-2])        # 38</code></pre><h2>修改循环变量不等于修改列表</h2><p>for x in a 中，给 x 重新赋值不会把结果写回原列表。需要保存变化时，用下标赋值或构造新列表。</p><pre><code>a = [8, 10]\nfor i in range(len(a)):\n    a[i] //= 2\nprint(a)  # [4, 5]</code></pre><h2>排序和删除的代价</h2><p>sort() 原地排序，返回 None；sorted(a) 返回新列表。排序通常只需做一次。pop(0) 会移动后续元素，是 O(n) 操作；按下标遍历可避免反复移动。</p><h2>list 与 tuple</h2><p>list 可以修改元素；tuple 的元素位置不能重新赋值。元组适合保存一条固定结构的记录，如 (姓名, 分数)。元组中若包含列表，那个内部列表本身仍可修改。</p>", "python/4": "<h2>把数位处理拆成函数</h2><p>数字转为字符串后逐字符遍历，再将每个字符转为整数。这种写法不依赖固定的位数；下面的函数用于非负整数。</p><pre><code>def digit_sum(n):\n    total = 0\n    for ch in str(n):\n        total += int(ch)\n    return total\n\nprint(digit_sum(5042))  # 11</code></pre><h2>局部变量与返回值</h2><p>total 每次调用函数时重新初始化。return 把结果交回调用处，print 只负责显示。计算数位和时，不要误改枚举候选数的变量。</p><h2>练习方向</h2><p>把函数分别用于 0、单个数字、带有 0 的整数和更多位的整数。区分“数字本身”“数位和”“满足条件的个数”和“满足条件的数字总和”。</p>", "python/5": "<h2>先写排序规则</h2><p>Python 的 tuple 按从左到右的顺序比较：第一项相同时再比较第二项。先把排序规则说清楚，再把它写成 key。</p><h2>lambda 和多关键字</h2><p>lambda 可以理解为只有一个表达式的匿名函数。对数值取负可以让该关键字按降序排列，同时保留其他关键字的升序。</p><pre><code>students = [(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\nstudents.sort(key=lambda x: (-x[1], x[0]))\nprint(students)\n# [(&quot;Alice&quot;, 95), (&quot;Bob&quot;, 95), (&quot;Amy&quot;, 80)]</code></pre><h2>等价的 def 写法</h2><p>不熟悉 lambda 时先写普通函数，能更清楚地观察每条记录对应的排序键。</p><pre><code>def rank_key(student):\n    return (-student[1], student[0])\n\nstudents.sort(key=rank_key)</code></pre><h2>常见误区</h2><p>reverse=True 会反转整个排序方向，不能直接表达“一项升序、另一项降序”。同样的 key 会保留原相对顺序，这是 Python 排序的稳定性。涉及原编号时，应把编号与记录一起保存。</p>", "python/6": "<h2>类型、对象与初始化</h2><p>class 定义一种类型；调用类创建一个具体对象（instance）。__init__ 在实例初始化时设置属性；self 表示当前实例。通常简单记录用 tuple 就够了，需要绑定行为或自定义比较时可以使用 class。</p><h2>__lt__ 定义“小于”</h2><p>排序可以调用对象的 __lt__。下面比较分母为正的分数，用交叉相乘避免先转为浮点数；分母为负时先统一符号，分母为零没有定义。</p><pre><code>class Fraction:\n    def __init__(self, numerator, denominator):\n        if denominator == 0:\n            raise ValueError(&quot;zero denominator&quot;)\n        if denominator &lt; 0:\n            numerator = -numerator\n            denominator = -denominator\n        self.numerator = numerator\n        self.denominator = denominator\n\n    def __lt__(self, other):\n        return (self.numerator * other.denominator\n                &lt; other.numerator * self.denominator)\n\nvalues = [Fraction(2, 3), Fraction(1, 2), Fraction(3, 4)]\nvalues.sort()\nfor x in values:\n    print(x.numerator, x.denominator)\n# 1 2\n# 2 3\n# 3 4</code></pre><h2>为什么交叉相乘成立</h2><p>当 b、d 都为正时，a/b &lt; c/d 等价于 a×d &lt; c×b。比较必须严格，不能用 ≤ 代替 &lt;。若题目要求同分时按编号排序，还需要明确处理相等情况。</p>", "python/7": "<h2>先找最小反例</h2><p>先预测一个小输入的正确结果，再运行程序。不要每次只重复测试题目样例。优先检查空操作、单个元素、首尾位置、重复值和刚好满足条件的情况。</p><h2>print 调试</h2><p>打印循环前后的关键变量，观察哪一次状态首次偏离预期。可以把调试信息写到 stderr，最终提交仍建议删除。</p><pre><code>import sys\nvalues = [6, 8]\nfor i in range(len(values)):\n    print(&quot;before&quot;, i, values[i], file=sys.stderr)\n    values[i] //= 2\n    print(&quot;after&quot;, i, values[i], file=sys.stderr)</code></pre><h2>断点与单步</h2><p>在 VS Code 等支持 Python 调试的编辑器中，把断点放在状态更新前，逐行执行，观察变量面板。核对变量的值、类型、循环次数和实际走到的分支。具体启动方式取决于本地解释器和调试配置。</p><h2>粗略估算复杂度</h2><p>列表遍历 O(n)，排序 O(n log n)，列表头部删除 O(n)。若每轮都排序或 pop(0)，总开销可能明显增大。先根据数据规模估算，再决定实现。</p>", "homework/1": "<p class=\"intro\">第 1 课作业 · Python · 2026-10-25</p><p>先完成三道必做新题，再尝试选做题。先自己实现、自测，遇到错误时保留出错输入和修改原因。题意摘要为本站整理，完整要求以 AtCoder 原题为准。</p><h2>必做 · ABC284_A · Sequence of Strings</h2><p>读入 N 个字符串，按输入顺序的逆序逐行输出。注意是反转字符串之间的顺序，不是反转每个字符串的字符。</p><p><a href=\"https://atcoder.jp/contests/abc284/tasks/abc284_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：先用下标循环完成；再思考负数索引或 reversed 的等价写法。不要用 sort 改变原有顺序。</p><p>自测方向：自行测试 N=1、含数字的字符串、重复字符串。</p><h2>必做 · ABC187_A · Large Digits</h2><p>输入两个三位整数 A、B，分别计算十进制数位和，输出两个数位和中较大的值。</p><p><a href=\"https://atcoder.jp/contests/abc187/tasks/abc187_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：写一个 digit_sum 函数，用字符串遍历处理数位，不固定拆百位、十位、个位。</p><p>自测方向：自行测试两个数位和相等、数字中含 0、100 与 999。</p><h2>必做 · ABC201_B · Do you know the second highest mountain?</h2><p>每座山有名称和高度，各山的名字与高度均互不相同。输出第二高的山的名称。</p><p><a href=\"https://atcoder.jp/contests/abc201/tasks/abc201_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：用 list/tuple 绑定名称与整数高度，用 key 排序；先确认第二高对应哪个下标。</p><p>自测方向：自行测试只有两座山、输入已经有序，以及高度为 9 与 100 的情况。注意高度必须转为整数。</p><h2>进阶选做 · ABC308_C · Standings</h2><p>第 i 人有 Aᵢ 次正面、Bᵢ 次反面，成功率为 Aᵢ/(Aᵢ+Bᵢ)。按成功率从高到低输出编号；相同成功率按编号从小到大。</p><p><a href=\"https://atcoder.jp/contests/abc308/tasks/abc308_c?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：尝试用 class 与 __lt__ 表达顺序，以交叉相乘比较成功率，避免直接计算浮点数。</p><p>自测方向：先验证相同成功率、成功率为 0 或 1、非常接近的两个成功率。本题数据量更大，属于挑战，未完成可带思路来讨论。</p><h2>必做小练习：定位错误</h2><p>下面的程序想把列表中的每个数减半并保存整数结果。先预测实际输出，再修改程序。解释两个问题分别出在哪里。此题在本地完成。</p><pre><code>values = [8, 12]\nfor x in values:\n    x = x / 2\nprint(values)</code></pre><h2>完成后带来</h2><p>三道必做题的 Python 代码与评测结果；调试小练习的修复代码；至少一个自己构造的测试，以及遇到错误时的修改说明。无需填写本站记录。</p>", "lesson/1": "<p>第 2 课 · Python · 2026-11-01 · 课后整理</p><h2>本课内容</h2><ol><li><a href=\"#/lesson/2\">class、__lt__ 与多关键字排序复习</a></li><li><a href=\"#/next/1\">一维前缀和：定义、构建与区间查询</a></li><li><a href=\"#/lesson/3\">区间和实现与边界调试</a></li><li><a href=\"#/lesson/4\">字符串计数与前缀和</a></li><li><a href=\"#/lesson/5\">乘积与取模概念拓展</a></li></ol><h2>课后重点</h2><p>独立写出排序和前缀和程序，解释每个下标的意义；用首尾、单点与跨边界的情况检查程序。</p><p><a class=\"button\" href=\"#/homework/2\">第 2 课作业单</a></p>", "lesson/2": "<h2>先预测排序结果</h2><p>按分数从高到低，同分时按姓名字典序从小到大。先写出输出顺序，再运行。</p><pre><code>students = [(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\nstudents.sort(key=lambda x: (-x[1], x[0]))</code></pre><p>逐项写出 key：Amy 对应 (-80, \"Amy\")，Bob 对应 (-95, \"Bob\")，Alice 对应 (-95, \"Alice\")。元组从左到右比较。</p><h2>class 把属性放在同一个对象里</h2><pre><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def __lt__(self, other):\n        return (-self.score, self.name) &lt; (-other.score, other.name)</code></pre><p>Student 是类型，Student(\"Amy\", 80) 创建一个实例。__init__ 设置初始属性，self 表示当前对象，other 是比较的另一个对象。</p><pre><code>a = Student(&quot;Amy&quot;, 80)\nb = Student(&quot;Bob&quot;, 95)\na.score += 5\nprint(a.score, b.score)  # 85 95\n\nroster = [a, b, Student(&quot;Alice&quot;, 95)]\nroster.sort()\nfor student in roster:\n    print(student.name, student.score)</code></pre><h2>key 与 __lt__</h2><p>key 返回用来排序的值；__lt__ 回答当前对象是否应排在另一对象之前。普通多字段排序通常用 key 更直接；这里用同一规则对照复习。</p><pre><code>roster.sort(key=lambda s: (-s.score, s.name))</code></pre><h2>分数比较复习</h2><p>当两个分母都为正时，a/b &lt; c/d 等价于 a*d &lt; c*b。用整数交叉相乘避免浮点误差。__lt__ 使用严格的 &lt;，同值比较应返回 False；题目若要求编号打破平局，需要额外比较编号。</p><h2>口头自测</h2><ul><li>为什么给 a.score 赋值不改变 b.score？</li><li>为什么 reverse=True 不能单独反转分数这一项？</li><li>sort() 的返回值是什么？</li><li>2/3 和 3/4 的交叉乘积分别是多少？</li></ul><h2>比较规则要一致</h2><p>Python 排序使用小于比较。没有 key 时比较对象本身；有 key 时比较 key 返回的值。__lt__ 返回 True 或 False，供比较和排序过程使用。仅仅写出方法还不够，规则必须一致，不能让两个对象互相“小于”。</p>", "next/1": "<h2>为什么要保存累计结果</h2><p>对数组 [3, 1, 4, 2, 5]，反复询问第 l 个到第 r 个数的和。每次循环或 sum(nums[l-1:r]) 都会重复累加；切片也要复制元素。一次询问最坏 O(n)，q 次最坏 O(nq)。</p><h2>定义决定下标</h2><p>prefix[i] 表示前 i 个数的和。prefix[0] = 0，表示前 0 个数的和。原数组 nums 使用 Python 的 0-based 下标；题目位置从 1 开始。</p><div class=table-scroll><table><thead><tr><th>i</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><th>第 i 个数</th><td>—</td><td>3</td><td>1</td><td>4</td><td>2</td><td>5</td></tr><tr><th>prefix[i]</th><td>0</td><td>3</td><td>4</td><td>8</td><td>10</td><td>15</td></tr></tbody></table></div><h2>区间和就是两段前缀之差</h2><p>题目区间 [l, r] 包含两端。prefix[r] 包括第 1 到第 r 个数，减掉第 1 到第 l−1 个数，留下第 l 到第 r 个数。</p><pre><code>区间和 = prefix[r] - prefix[l - 1]\n[2, 4] 的和 = 10 - 3 = 7</code></pre><h2>构建与查询</h2><pre><code>nums = [3, 1, 4, 2, 5]\nprefix = [0]\nfor x in nums:\n    prefix.append(prefix[-1] + x)\n\nl, r = 2, 4\nprint(prefix[r] - prefix[l - 1])  # 7</code></pre><p>构建遍历一次，O(n)；每次查询做一次减法，O(1)；总时间 O(n+q)，额外空间 O(n)。</p><h2>边界检查</h2><ul><li>l=1：减去 prefix[0]。</li><li>l=r：结果应等于该位置的一个数。</li><li>r=n：使用 prefix[n]，因此数组共有 n+1 项。</li><li>负数也适用求和，但前缀和不一定递增。</li></ul><h2>使用条件</h2><p>本课假设数组在查询期间不变。若修改原数组，已有前缀和可能失效，需要更新相应累计结果。</p><h2>课堂使用的下标写法</h2><pre><code>prefix = [0] * (len(nums) + 1)\nfor i in range(1, len(nums) + 1):\n    prefix[i] = prefix[i - 1] + nums[i - 1]</code></pre><p>第 i 个数存放在 nums[i-1]。prefix 是普通 Python 列表，“前缀和”描述的是它保存的数据含义。循环里只计算当前项，不把列表整体覆盖成一个数。</p>", "lesson/3": "<h2>独立实现：多次区间和</h2><p>输入 n、q，接着一行 n 个整数，再读入 q 行 l、r。每行输出题目位置 l 到 r（包含两端）的元素之和。1 ≤ l ≤ r ≤ n；n、q 可到 100000。</p><h2>课堂样例</h2><pre><code>输入\n5 4\n3 1 4 2 5\n2 4\n1 5\n3 3\n1 1\n\n输出\n7\n15\n4\n3</code></pre><h2>编码步骤</h2><ol><li>读入整数列表。</li><li>构建长度 n+1 的前缀和。</li><li>逐行读入查询，输出答案。</li></ol><h2>找出下面的错误</h2><pre><code>prefix = []\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nanswer = prefix[r] - prefix[l]</code></pre><p>先找第一个会触发的错误，再检查查询公式。用 l=1 和 l=r 的输入验证修正。</p><h2>独立自测</h2><p>数组 [5]，查询 [1,1] 应输出 5；数组 [2,-3,4]，查询 [1,3] 应输出 3，查询 [2,2] 应输出 -3。负数例子是额外的本地练习。</p><h2>Python 读入与输出</h2><pre><code>import sys\ninput = sys.stdin.readline\n\nn, q = map(int, input().split())\nnums = list(map(int, input().split()))</code></pre><p>sys.stdin.readline 按行读入，可减少大量输入时的开销。读取字符串时可用 input().strip() 去掉末尾换行；它也会去掉首尾空白，因此只在题目允许时使用。读入方式不能替代算法优化。</p><h2>range 的右端点</h2><p>题目位置 L 到 R 对应 Python 下标 L-1 到 R-1，因此直接累加的循环是 range(L-1, R)。这个循环用于理解和检查，数据大时使用前缀和查询。</p>", "homework/2": "<p>第 2 课作业 · Python · 对应课堂：2026-11-01</p><p>先做基础题，再完成课堂布置的 AC 题；分类求和选做。中文题意为本站整理，完整要求以 AtCoder 原题为准。</p><h2>1. 必做基础：A06 · How Many Guests?</h2><p>给出 N 天的到访人数，回答 Q 次第 L 到第 R 天的到访总人数。N、Q 均可到 100000。</p><p>练习要求：独立构建前缀和，再处理查询。已在课堂完成，也请关掉示例重写一遍。</p><p>自测方向：N=1；L=1；L=R；R=N。解释 prefix[0] 的含义。</p><p><a href=\"https://atcoder.jp/contests/tessoku-book/tasks/math_and_algorithm_ai\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>2. 必做课堂作业：ABC122_C · GeT AC</h2><p>给出由 A、C、G、T 组成的字符串，多次询问指定子串内连续 AC 的出现次数。原题使用大写字符，区间包含两端。</p><p>练习要求：先写清楚0/1标记代表哪个位置，再处理区间边界。不要把跨出左端点或右端点的 AC 算进去。</p><p>自测方向：对 ACAC，区间 [1,4] 答案2，[2,3] 答案0，[2,4] 答案1。原题要求 L&lt;R。</p><p><a href=\"https://atcoder.jp/contests/abc122/tasks/abc122_c\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>3. 巩固选做：Typical90 010 · Score Sum Queries</h2><p>每位学生属于1班或2班，并有一个分数。每次查询编号区间 [L,R]，分别输出区间内两个班的分数总和。</p><p>练习要求：思考如何分别累计两类数据。注意输入先给 N 和 N 条学生记录，之后才给 Q。</p><p>自测方向：区间内只有一个班；分数为0；单个学生；查询整个区间。</p><p><a href=\"https://atcoder.jp/contests/typical90/tasks/typical90_j\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>必做小练习：排序与 class</h2><p>用同一份数据分别写 tuple + key 和 Student 类 + __lt__ 两种实现。分数降序，同分姓名升序；输出姓名和分数。</p><pre><code>数据：[(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\n输出：\nAlice 95\nBob 95\nAmy 80</code></pre><p>解释 self 和 other，说明 __lt__ 返回什么。加入完全相同的记录，检查比较仍是严格小于。</p><h2>调试小练习</h2><pre><code>prefix = []\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nanswer = prefix[R] - prefix[L]</code></pre><p>假设 nums 非空且 L、R 是合法的题目位置，先指出第一个错误，再修正查询公式。用单元素和整个区间测试。</p>", "lesson/4": "<h2>从字符扫描到事件计数</h2><p>课堂讨论了连续 ac 的出现次数。对应 AtCoder 作业使用大写 AC，代码必须与题目的大小写一致。先固定标记含义：第 j 个位置与第 j+1 个位置组成 AC，就在起点 j 记1，否则记0。</p><pre><code>s = &quot;ACAC&quot;\nmarks = [0] * len(s)\nfor i in range(len(s) - 1):\n    if s[i] == &quot;A&quot; and s[i + 1] == &quot;C&quot;:\n        marks[i] = 1\n# marks = [1, 0, 1, 0]</code></pre><h2>区间端点为什么要重新检查</h2><p>查询题目位置 [L,R] 时，AC 的两个字符都必须落在区间内。因此允许的起点是 L 到 R-1，不能把第 R 个位置作为起点。</p><p>例如 ACAC 的 [2,3] 是 CA，答案为0；[2,4] 是 CAC，答案为1。请画出允许的起点，再结合前缀和定义推导查询式。</p><h2>先定义，再套公式</h2><p>可以用起点记事件，也可以用终点记事件，两种方法的查询下标不同。不要混用定义。作业先独立写出标记与查询范围，再检查公式。</p>", "lesson/5": "<h2>乘积前缀的条件</h2><p>课堂仅作概念拓展，不要求现在实现。若所有因子非零，可以保存前缀乘积，再用两个前缀的商求区间乘积。包含0时无法直接相除，还需要单独处理零的数量等信息。Python 的 / 会产生浮点数，整数精确计算要另行考虑。</p><h2>取模之后不能直接相除</h2><p>先取模会丢失原整数信息。在模 m 的意义下，只有除数与 m 互质时才存在乘法逆元，才能用乘逆元代替除法。本阶段先掌握加法前缀和，不布置逆元题。</p><h2>修改原数组</h2><p>普通前缀和保存的是当时的累计结果。修改某个元素会影响从该位置开始的前缀和。频繁修改且需要穿插查询时，后续再学习相应数据结构。</p>", "lesson03/1": "<h2>本课目标与工具分工</h2><p>Python 解释器执行代码；VS Code 用来编辑和运行。</p><p>Anaconda 管理环境与软件包。</p><p>Jupyter 用单元格组织代码、输出与说明。</p><p>今天完成：计算误差 → 写成函数 → 跨文件调用。</p><h2>课前准备：课程环境</h2><pre><code># 在 Anaconda Prompt 中运行，不是 Python 单元格\nconda create -n sean-python python=3.12 pip\nconda activate sean-python\npython -m pip install jupyterlab ipykernel\npython -m jupyterlab</code></pre><p>已有合适课程环境可继续使用，不必重复创建。</p><p>VS Code 选择 sean-python；Notebook 选择同一环境。</p><h2>核对正在使用的 Python</h2><pre><code>import sys\nprint(sys.executable)\nprint(sys.version)</code></pre><p>在 VS Code 脚本和 Jupyter 中分别运行。</p><p>检查解释器路径是否指向同一个课程环境。</p><p>VS Code 的解释器与 Notebook 内核要分别选择。</p><p>课前安装是准备工作；如果暂时无法配置完成，先使用可用的 Python 解释器完成函数与模块练习。Python 3.12 是本课环境建议，科研导师如指定版本则以其要求为准。</p>", "lesson03/2": "<h2>安装与导入</h2><p>安装：把第三方软件包放进某个 Python 环境。</p><p>导入：让当前程序能够使用模块中的名字。</p><p>math、random、os 属于标准库，无需额外安装。</p><p>自己写的 analysis_utils.py 也可以导入。</p><p>装好包后，每个需要它的程序仍要写 import。</p><h2>math：使用模块中的函数</h2><pre><code>import math\n\nprint(math.sqrt(81))   # 9.0\nprint(math.floor(3.8)) # 3\nprint(math.ceil(3.2))  # 4</code></pre><p>点号左边是模块名，右边是其中的函数名。</p><p>动手：预测 floor(-1.2) 与 ceil(-1.2) 的结果。</p><h2>random 与 os</h2><pre><code>import random\nimport os\n\nprint(random.randint(1, 6))\nprint(random.choice([9.5, 10.0, 10.5]))\nprint(os.getcwd())</code></pre><p>randint(1, 6) 包含两个端点；结果可能重复。</p><p>getcwd() 显示当前工作目录，它未必是脚本所在目录。</p>", "lesson03/3": "<h2>函数复习：参数与返回值</h2><pre><code>def absolute_error(measured, target):\n    return abs(measured - target)\n\nresult = absolute_error(9.5, 10.0)\nprint(result)  # 0.5</code></pre><p>measured、target 接收本次调用传入的值。</p><p>return 把计算结果交回调用处，由 result 保存。</p><h2>print 与 return</h2><pre><code>def show_error(measured, target):\n    print(abs(measured - target))\n\nresult = show_error(9.5, 10.0)\nprint(result)</code></pre><p>先预测屏幕上会出现哪两行。</p><p>如果还需要把误差放进列表，函数应怎样修改？</p><h2>自己的模块：analysis_utils.py</h2><pre><code># analysis_utils.py\ndef absolute_error(measured, target):\n    return abs(measured - target)</code></pre><p>把文件保存为 analysis_utils.py。</p><p>模块是可导入的 Python 文件。</p><p>计算函数放在这里，主程序负责调用与显示。</p><h2>主程序：main.py</h2><pre><code># main.py，与 analysis_utils.py 放在同一目录\nimport analysis_utils\n\nerror = analysis_utils.absolute_error(9.5, 10.0)\nprint(error)  # 0.5</code></pre><p>保存两个文件，再运行 main.py。</p><p>修改传入的测量值，观察结果；不需要重写函数。</p><h2>导入后的名字</h2><pre><code>import analysis_utils\nanalysis_utils.absolute_error(9.5, 10.0)\n\nimport analysis_utils as au\nau.absolute_error(9.5, 10.0)\n\nfrom analysis_utils import absolute_error\nabsolute_error(9.5, 10.0)</code></pre><p>三种写法分别单独练习，观察调用名称如何变化。</p><p>函数里的局部变量不会自动成为主程序的变量。</p><h2>文件、模块与包</h2><p>main.py：启动并组织本次计算。</p><p>analysis_utils.py：可重复导入的模块。</p><p>多个模块可组织成包，例如：</p><p>utils/</p><p>    __init__.py</p><p>    errors.py</p><p>这时可以写 from utils import errors。</p>", "lesson03/4": "<h2>把函数用于一组测量值</h2><pre><code>import analysis_utils\n\nmeasurements = [9.5, 10.0, 10.5]\nerrors = []\nfor value in measurements:\n    errors.append(\n        analysis_utils.absolute_error(value, 10.0)\n    )\nprint(errors)</code></pre><p>先预测结果，再运行： [0.5, 0.0, 0.5]。</p><p>动手：增加一个测量值 11.0。</p><h2>Jupyter 的执行顺序</h2><pre><code># 单元格 A\ntarget = 10.0\n\n# 单元格 B\nprint(abs(9.5 - target))</code></pre><p>先运行 A，再运行 B。</p><p>只修改 A 的文字为 target = 12.0，不运行 A，再运行 B。</p><p>输出会变化吗？最后重启内核并按顺序运行全部单元格。</p><h2>遇到错误时的检查顺序</h2><p>ModuleNotFoundError：检查拼写、文件位置与环境。</p><p>NameError：检查是否执行了定义或 import 的单元格。</p><p>结果是 None：检查函数是否 return 了计算结果。</p><p>旧输出没变化：保存脚本；Notebook 重启后全部运行。</p><p>安装第三方包时，用当前环境的 python -m pip。</p><p>Notebook 中可用 %pip；本课标准库无需安装。</p>", "homework/3": "<p class=\"intro\">第 3 课 · Python 本地练习</p><h2>独立任务与课后练习</h2><p>独立任务：</p><p>新增 squared_error(measured, target)，返回差的平方。</p><p>在 main.py 导入并调用，测试 9.5 与 10.0，答案 0.25。</p><p>课后：处理 [9.5, 10.0, 10.5]，输出两种误差列表。</p><p>在 Notebook 重复调用；重启内核后运行全部单元格。</p><p>带上两个 .py 文件、Notebook，以及自己的测试结果。</p><h2>自测要求</h2><p>测试 measured 小于、等于、大于 target 三种情况。函数负责返回数值，主程序负责显示；核对两种误差都是非负数。</p><h2>环境核对</h2><p>在脚本与 Notebook 中分别输出 sys.executable，确认使用同一课程环境。解释为何标准库不需要 pip 安装，以及只修改单元格文字为什么不一定改变运行结果。</p><h2>选做：排序复习</h2><p>用 (测量值, 绝对误差) 保存记录，按误差升序排列；误差相同时按测量值升序。先用 tuple key 完成，再尝试用 class 表达记录。保持误差函数可以从主程序导入。</p>", "lesson03/5": "<p>本周从 11 月 8 日周日课程开始，后续保留家长计划中的周六与周日课程。以下为计划内容，完成后根据实际进度更新。</p><div class=\"table-scroll\"><table><thead><tr><th>日期（2026）</th><th>课程内容</th></tr></thead><tbody><tr><td>11月8日（周日）</td><td>环境、标准库、函数与模块</td></tr><tr><td>11月14日（周六）</td><td>栈队列、set/dict、嵌套结构；Counter/defaultdict/deque</td></tr><tr><td>11月15日（周日）</td><td>文件读写、with、pathlib、CSV/JSON</td></tr><tr><td>11月21日（周六）</td><td>递归、迭代与生成器</td></tr><tr><td>11月22日（周日）</td><td>异常处理与调试</td></tr><tr><td>11月28日（周六）</td><td>模拟、class 与封装</td></tr><tr><td>11月29日（周日）</td><td>NumPy 数组基础</td></tr><tr><td>12月5日（周六）</td><td>前缀和与差分、cumsum/diff、几何计算</td></tr><tr><td>12月6日（周日）</td><td>Pandas 数据处理</td></tr><tr><td>12月12日（周六）</td><td>绘图与置换检验入门</td></tr><tr><td>12月13日（周日）</td><td>OpenCV、相机标定与 ArUco 流程初步认识</td></tr></tbody></table></div><p>目标是为科研项目准备 Python 基础与常用工具。后段科研专题先建立概念和可运行流程，掌握深度结合前面练习与科研导师要求调整。</p>", "environment/1": "<h2>本课目标与工具分工</h2><p>Python 解释器执行代码；VS Code 用来编辑和运行。</p><p>Anaconda 管理环境与软件包。</p><p>Jupyter 用单元格组织代码、输出与说明。</p><p>今天完成：计算误差 → 写成函数 → 跨文件调用。</p><h2>课前准备：课程环境</h2><pre><code># 在 Anaconda Prompt 中运行，不是 Python 单元格\nconda create -n sean-python python=3.12 pip\nconda activate sean-python\npython -m pip install jupyterlab ipykernel\npython -m jupyterlab</code></pre><p>已有合适课程环境可继续使用，不必重复创建。</p><p>VS Code 选择 sean-python；Notebook 选择同一环境。</p><h2>核对正在使用的 Python</h2><pre><code>import sys\nprint(sys.executable)\nprint(sys.version)</code></pre><p>在 VS Code 脚本和 Jupyter 中分别运行。</p><p>检查解释器路径是否指向同一个课程环境。</p><p>VS Code 的解释器与 Notebook 内核要分别选择。</p>", "environment/2": "<h2>安装与导入</h2><p>安装：把第三方软件包放进某个 Python 环境。</p><p>导入：让当前程序能够使用模块中的名字。</p><p>math、random、os 属于标准库，无需额外安装。</p><p>自己写的 analysis_utils.py 也可以导入。</p><p>装好包后，每个需要它的程序仍要写 import。</p><h2>math：使用模块中的函数</h2><pre><code>import math\n\nprint(math.sqrt(81))   # 9.0\nprint(math.floor(3.8)) # 3\nprint(math.ceil(3.2))  # 4</code></pre><p>点号左边是模块名，右边是其中的函数名。</p><p>动手：预测 floor(-1.2) 与 ceil(-1.2) 的结果。</p><h2>random 与 os</h2><pre><code>import random\nimport os\n\nprint(random.randint(1, 6))\nprint(random.choice([9.5, 10.0, 10.5]))\nprint(os.getcwd())</code></pre><p>randint(1, 6) 包含两个端点；结果可能重复。</p><p>getcwd() 显示当前工作目录，它未必是脚本所在目录。</p>", "environment/3": "<h2>Jupyter 的执行顺序</h2><pre><code># 单元格 A\ntarget = 10.0\n\n# 单元格 B\nprint(abs(9.5 - target))</code></pre><p>先运行 A，再运行 B。</p><p>只修改 A 的文字为 target = 12.0，不运行 A，再运行 B。</p><p>输出会变化吗？最后重启内核并按顺序运行全部单元格。</p>", "environment/4": "<h2>遇到错误时的检查顺序</h2><p>ModuleNotFoundError：检查拼写、文件位置与环境。</p><p>NameError：检查是否执行了定义或 import 的单元格。</p><p>结果是 None：检查函数是否 return 了计算结果。</p><p>旧输出没变化：保存脚本；Notebook 重启后全部运行。</p><p>安装第三方包时，用当前环境的 python -m pip。</p><p>Notebook 中可用 %pip；本课标准库无需安装。</p>", "modules/1": "<h2>函数复习：参数与返回值</h2><pre><code>def absolute_error(measured, target):\n    return abs(measured - target)\n\nresult = absolute_error(9.5, 10.0)\nprint(result)  # 0.5</code></pre><p>measured、target 接收本次调用传入的值。</p><p>return 把计算结果交回调用处，由 result 保存。</p><h2>print 与 return</h2><pre><code>def show_error(measured, target):\n    print(abs(measured - target))\n\nresult = show_error(9.5, 10.0)\nprint(result)</code></pre><p>先预测屏幕上会出现哪两行。</p><p>如果还需要把误差放进列表，函数应怎样修改？</p><h2>把函数用于一组测量值</h2><pre><code>import analysis_utils\n\nmeasurements = [9.5, 10.0, 10.5]\nerrors = []\nfor value in measurements:\n    errors.append(\n        analysis_utils.absolute_error(value, 10.0)\n    )\nprint(errors)</code></pre><p>先预测结果，再运行： [0.5, 0.0, 0.5]。</p><p>动手：增加一个测量值 11.0。</p>", "modules/2": "<h2>自己的模块：analysis_utils.py</h2><pre><code># analysis_utils.py\ndef absolute_error(measured, target):\n    return abs(measured - target)</code></pre><p>把文件保存为 analysis_utils.py。</p><p>模块是可导入的 Python 文件。</p><p>计算函数放在这里，主程序负责调用与显示。</p><h2>主程序：main.py</h2><pre><code># main.py，与 analysis_utils.py 放在同一目录\nimport analysis_utils\n\nerror = analysis_utils.absolute_error(9.5, 10.0)\nprint(error)  # 0.5</code></pre><p>保存两个文件，再运行 main.py。</p><p>修改传入的测量值，观察结果；不需要重写函数。</p><h2>导入后的名字</h2><pre><code>import analysis_utils\nanalysis_utils.absolute_error(9.5, 10.0)\n\nimport analysis_utils as au\nau.absolute_error(9.5, 10.0)\n\nfrom analysis_utils import absolute_error\nabsolute_error(9.5, 10.0)</code></pre><p>三种写法分别单独练习，观察调用名称如何变化。</p><p>函数里的局部变量不会自动成为主程序的变量。</p><h2>文件、模块与包</h2><p>main.py：启动并组织本次计算。</p><p>analysis_utils.py：可重复导入的模块。</p><p>多个模块可组织成包，例如：</p><p>utils/</p><p>    __init__.py</p><p>    errors.py</p><p>这时可以写 from utils import errors。</p>", "next/6": "<h2>独立实现：多次区间和</h2><p>输入 n、q，接着一行 n 个整数，再读入 q 行 l、r。每行输出题目位置 l 到 r（包含两端）的元素之和。1 ≤ l ≤ r ≤ n；n、q 可到 100000。</p><h2>课堂样例</h2><pre><code>输入\n5 4\n3 1 4 2 5\n2 4\n1 5\n3 3\n1 1\n\n输出\n7\n15\n4\n3</code></pre><h2>编码步骤</h2><ol><li>读入整数列表。</li><li>构建长度 n+1 的前缀和。</li><li>逐行读入查询，输出答案。</li></ol><h2>找出下面的错误</h2><pre><code>prefix = []\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nanswer = prefix[r] - prefix[l]</code></pre><p>先找第一个会触发的错误，再检查查询公式。用 l=1 和 l=r 的输入验证修正。</p><h2>独立自测</h2><p>数组 [5]，查询 [1,1] 应输出 5；数组 [2,-3,4]，查询 [1,3] 应输出 3，查询 [2,2] 应输出 -3。负数例子是额外的本地练习。</p><h2>Python 读入与输出</h2><pre><code>import sys\ninput = sys.stdin.readline\n\nn, q = map(int, input().split())\nnums = list(map(int, input().split()))</code></pre><p>sys.stdin.readline 按行读入，可减少大量输入时的开销。读取字符串时可用 input().strip() 去掉末尾换行；它也会去掉首尾空白，因此只在题目允许时使用。读入方式不能替代算法优化。</p><h2>range 的右端点</h2><p>题目位置 L 到 R 对应 Python 下标 L-1 到 R-1，因此直接累加的循环是 range(L-1, R)。这个循环用于理解和检查，数据大时使用前缀和查询。</p>", "next/7": "<h2>从字符扫描到事件计数</h2><p>课堂讨论了连续 ac 的出现次数。对应 AtCoder 作业使用大写 AC，代码必须与题目的大小写一致。先固定标记含义：第 j 个位置与第 j+1 个位置组成 AC，就在起点 j 记1，否则记0。</p><pre><code>s = &quot;ACAC&quot;\nmarks = [0] * len(s)\nfor i in range(len(s) - 1):\n    if s[i] == &quot;A&quot; and s[i + 1] == &quot;C&quot;:\n        marks[i] = 1\n# marks = [1, 0, 1, 0]</code></pre><h2>区间端点为什么要重新检查</h2><p>查询题目位置 [L,R] 时，AC 的两个字符都必须落在区间内。因此允许的起点是 L 到 R-1，不能把第 R 个位置作为起点。</p><p>例如 ACAC 的 [2,3] 是 CA，答案为0；[2,4] 是 CAC，答案为1。请画出允许的起点，再结合前缀和定义推导查询式。</p><h2>先定义，再套公式</h2><p>可以用起点记事件，也可以用终点记事件，两种方法的查询下标不同。不要混用定义。作业先独立写出标记与查询范围，再检查公式。</p>", "next/8": "<h2>乘积前缀的条件</h2><p>课堂仅作概念拓展，不要求现在实现。若所有因子非零，可以保存前缀乘积，再用两个前缀的商求区间乘积。包含0时无法直接相除，还需要单独处理零的数量等信息。Python 的 / 会产生浮点数，整数精确计算要另行考虑。</p><h2>取模之后不能直接相除</h2><p>先取模会丢失原整数信息。在模 m 的意义下，只有除数与 m 互质时才存在乘法逆元，才能用乘逆元代替除法。本阶段先掌握加法前缀和，不布置逆元题。</p><h2>修改原数组</h2><p>普通前缀和保存的是当时的累计结果。修改某个元素会影响从该位置开始的前缀和。频繁修改且需要穿插查询时，后续再学习相应数据结构。</p>", "roadmap/1": "<p>本周从 11 月 8 日周日课程开始，后续保留家长计划中的周六与周日课程。以下为计划内容，完成后根据实际进度更新。</p><div class=\"table-scroll\"><table><thead><tr><th>日期（2026）</th><th>课程内容</th></tr></thead><tbody><tr><td>11月8日（周日）</td><td>环境、标准库、函数与模块</td></tr><tr><td>11月14日（周六）</td><td>栈队列、set/dict、嵌套结构；Counter/defaultdict/deque</td></tr><tr><td>11月15日（周日）</td><td>文件读写、with、pathlib、CSV/JSON</td></tr><tr><td>11月21日（周六）</td><td>递归、迭代与生成器</td></tr><tr><td>11月22日（周日）</td><td>异常处理与调试</td></tr><tr><td>11月28日（周六）</td><td>模拟、class 与封装</td></tr><tr><td>11月29日（周日）</td><td>NumPy 数组基础</td></tr><tr><td>12月5日（周六）</td><td>前缀和与差分、cumsum/diff、几何计算</td></tr><tr><td>12月6日（周日）</td><td>Pandas 数据处理</td></tr><tr><td>12月12日（周六）</td><td>绘图与置换检验入门</td></tr><tr><td>12月13日（周日）</td><td>OpenCV、相机标定与 ArUco 流程初步认识</td></tr></tbody></table></div><p>目标是为科研项目准备 Python 基础与常用工具。后段科研专题先建立概念和可运行流程，掌握深度结合前面练习与科研导师要求调整。</p>", "python/8": "<h2>先预测排序结果</h2><p>按分数从高到低，同分时按姓名字典序从小到大。先写出输出顺序，再运行。</p><pre><code>students = [(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\nstudents.sort(key=lambda x: (-x[1], x[0]))</code></pre><p>逐项写出 key：Amy 对应 (-80, \"Amy\")，Bob 对应 (-95, \"Bob\")，Alice 对应 (-95, \"Alice\")。元组从左到右比较。</p><h2>class 把属性放在同一个对象里</h2><pre><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def __lt__(self, other):\n        return (-self.score, self.name) &lt; (-other.score, other.name)</code></pre><p>Student 是类型，Student(\"Amy\", 80) 创建一个实例。__init__ 设置初始属性，self 表示当前对象，other 是比较的另一个对象。</p><pre><code>a = Student(&quot;Amy&quot;, 80)\nb = Student(&quot;Bob&quot;, 95)\na.score += 5\nprint(a.score, b.score)  # 85 95\n\nroster = [a, b, Student(&quot;Alice&quot;, 95)]\nroster.sort()\nfor student in roster:\n    print(student.name, student.score)</code></pre><h2>key 与 __lt__</h2><p>key 返回用来排序的值；__lt__ 回答当前对象是否应排在另一对象之前。普通多字段排序通常用 key 更直接；这里用同一规则对照复习。</p><pre><code>roster.sort(key=lambda s: (-s.score, s.name))</code></pre><h2>分数比较复习</h2><p>当两个分母都为正时，a/b &lt; c/d 等价于 a*d &lt; c*b。用整数交叉相乘避免浮点误差。__lt__ 使用严格的 &lt;，同值比较应返回 False；题目若要求编号打破平局，需要额外比较编号。</p><h2>口头自测</h2><ul><li>为什么给 a.score 赋值不改变 b.score？</li><li>为什么 reverse=True 不能单独反转分数这一项？</li><li>sort() 的返回值是什么？</li><li>2/3 和 3/4 的交叉乘积分别是多少？</li></ul><h2>比较规则要一致</h2><p>Python 排序使用小于比较。没有 key 时比较对象本身；有 key 时比较 key 返回的值。__lt__ 返回 True 或 False，供比较和排序过程使用。仅仅写出方法还不够，规则必须一致，不能让两个对象互相“小于”。</p>"};
const aliases = {"lesson03": "environment", "lesson03/1": "environment/1", "lesson03/2": "environment/2", "lesson03/3": "modules/2", "lesson03/4": "environment/3", "lesson03/5": "roadmap/1", "lesson": "next", "lesson/1": "next/1", "lesson/2": "python/8", "lesson/3": "next/6", "lesson/4": "next/7", "lesson/5": "next/8"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=s=>'<pre><code>'+esc(s)+'</code></pre>';
const external=(url,label)=>`<a class="button" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
const url=p=>`https://atcoder.jp/contests/${p.contest}/tasks/${p.id}?lang=en`;
function rows(){return problems.map((p,i)=>`<section class="problem-row"><span class="number">${String(i+1).padStart(2,'0')}</span><div><h2><a href="#/assessment/${i+1}">${p.name} · ${p.zh}</a></h2><p class="meta">${p.id.toUpperCase()}${i===4?' · 挑战题':''}</p><p class="meta">${p.skill}</p></div></section>`).join('');}
function overview(){return `<p class="intro">Python · AtCoder</p><div class="callout"><p><strong>课堂回顾</strong>：本页保留第一课讲解的五道题。新作业见“课后练习”。</p><p>先独立读题、写代码和自测，再到 AtCoder 原题页面提交。</p></div>${rows()}`;}
function problemPage(p,i){return `<article class="lesson"><p class="intro">第 ${i+1} / 5 题 · ${p.id.toUpperCase()} · ${p.name}</p><p class="meta">训练内容：${p.skill}${i===4?'。本题为挑战题。':''}</p><div class="actions">${external(url(p),'AtCoder 原题')}</div><h2>中文题意</h2><p>${p.summary}</p><h2>输入与输出</h2><p>${p.format}</p><p class="meta">数据范围：${p.range}</p><div class="sample"><div><strong>样例输入</strong>${code(p.input)}</div><div><strong>样例输出</strong>${code(p.output)}</div></div><p class="note">中文题意为本站整理，完整题面与评测规则以 <a href="${url(p)}" target="_blank" rel="noopener noreferrer">AtCoder 官方题目</a> 为准。</p><details class="answer"><summary>提示（独立尝试后再展开）</summary><p>${p.hint}</p></details><nav class="actions" aria-label="题目导航">${i>0?`<a class="button" href="#/assessment/${i}">← 上一题</a>`:''}<a class="button" href="#/assessment">返回题单</a>${i<4?`<a class="button" href="#/assessment/${i+2}">下一题 →</a>`:''}</nav></article>`;}
const main=document.getElementById('content');
function render(){
 const raw=location.hash.slice(1).split('/').filter(Boolean).join('/');
 const parts=(aliases[raw]||raw).split('/').filter(Boolean),section=parts[0]||'',idx=Number(parts[1])-1;
 const group=groups.find(g=>g[0]===section),valid=group&&Number.isInteger(idx)&&idx>=0&&idx<group[2].length;
 const pageTitle=valid?group[2][idx]:group?group[1]:section?'页面未找到':'知识点索引';
 const sidebar=`<a href="#/" ${!section?'aria-current="page"':''}>全部知识点</a>`+groups.map(g=>`<details ${section===g[0]||!section?'open':''}><summary>${g[1]}</summary><nav>${g[2].map((n,i)=>`<a href="#/${g[0]}/${i+1}" ${section===g[0]&&idx===i?'aria-current="page"':''}>${n}</a>`).join('')}</nav></details>`).join('');
 document.getElementById('sidebar').innerHTML=sidebar;
 let body='';
 if(section==='assessment')body=valid?problemPage(problems[idx],idx):overview();
 else if(group){body=valid?(lessons[section+'/'+(idx+1)]?'<article class="lesson">'+lessons[section+'/'+(idx+1)]+'</article>':`<article class="lesson"><p>${plans[section][idx]}</p><h2>学习目标</h2><p>能解释概念，并独立写出对应程序。</p><div class="callout"><p>这是后续学习的大纲条目，内容随学习进度补充。</p></div></article>`):`<div class="index">${group[2].map((n,i)=>`<section><h2><a href="#/${section}/${i+1}">${n}</a></h2><p>${plans[section][i]}</p></section>`).join('')}</div>`;}
 else if(section)body='<p>这个目录地址不存在。</p><a href="#/">返回知识点索引</a>';
 else body=`<p class="intro">Python 基础、算法与科研工具，按知识点查阅。</p><div class="index">${groups.map(g=>`<section><h2><a href="#/${g[0]}">${g[1]}</a></h2><ul>${g[2].map((n,i)=>`<li><a href="#/${g[0]}/${i+1}">${n}</a></li>`).join('')}</ul></section>`).join('')}</div>`;
 main.innerHTML=`<details class="mobile-nav"><summary>知识点目录</summary><nav>${sidebar}</nav></details>${section?'<p class="breadcrumb"><a href="#/">知识点索引</a> / '+(valid?`<a href="#/${section}">${group[1]}</a>`:pageTitle)+'</p>':''}<h1>${pageTitle}</h1>${body}`;
 document.title=pageTitle+' · Sean 的 Python 学习笔记';window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){main.focus();return;}render();main.focus({preventScroll:true});});render();

</script><noscript>请启用 JavaScript 查看课程目录。</noscript></body></html>
