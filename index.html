<script>
const problems = [{"id":"abc340_b","contest":"abc340","name":"Append","zh":"追加与查询","time":10,"skill":"数组 / vector、下标","summary":"从一个空数列开始，按顺序处理 Q 条操作。1 x 表示在末尾加入 x；2 k 表示输出当前数列倒数第 k 个元素。查询不会删除元素，且保证查询合法。","range":"1 ≤ Q ≤ 100；1 ≤ x ≤ 10⁹；1 ≤ k ≤ 当前数列长度。","format":"第一行 Q，随后 Q 行，每行两个整数。对每条 2 k 操作输出一行答案。","input":"5\n1 20\n1 30\n2 1\n1 40\n2 3","output":"30\n20","hint":"长度为 n 时，最后一个元素的下标是 n−1；倒数第 k 个元素对应什么下标？","idea":"用 vector 保存数列。追加使用 push_back；查询直接访问 a[a.size() - k]。每次查询 O(1)，全部操作均摊 O(Q)，空间 O(Q)。","check":"仅有一次追加再查询；连续查询同一个元素；查询倒数第 1 个和倒数第 n 个。","teacher":"观察是否误把查询当作删除；能否解释从 1 开始的倒数位置如何转成从 0 开始的下标。不会 vector 时允许用数组和长度变量。","code":"#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n    int q; cin >> q;\n    vector<int> a;\n    while (q--) {\n        int type, x; cin >> type >> x;\n        if (type == 1) a.push_back(x);\n        else cout << a[a.size() - x] << '\\n';\n    }\n}"},{"id":"abc081_b","contest":"abc081","name":"Shift only","zh":"同时除以 2","time":15,"skill":"循环、数组、模拟","summary":"给定 N 个正整数。只有当所有数都是偶数时，才能把所有数同时除以 2。求最多能执行多少轮操作。","range":"1 ≤ N ≤ 200；1 ≤ Aᵢ ≤ 10⁹。","format":"第一行 N，第二行 N 个整数。输出最多可执行的轮数。","input":"3\n8 12 40","output":"2","hint":"每轮先检查是否全部为偶数，再决定是否统一修改。出现一个奇数就必须停止。","idea":"直接按题意模拟，每轮检查所有元素，再统一除以 2 并累计轮数。时间 O(N log M)，空间 O(N)，其中 M 是最大元素。也可以分别统计每个数能连续除以 2 的次数，再取最小值。","check":"初始就有奇数；只有一个数；所有数相同；部分元素只能除一次。","teacher":"观察停止条件是否是“存在奇数”，轮数是否多加了一次，范围 for 修改元素时是否用了引用。","code":"#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n    int n; cin >> n;\n    vector<int> a(n);\n    for (int &x : a) cin >> x;\n    int answer = 0;\n    while (true) {\n        bool allEven = true;\n        for (int x : a) if (x % 2 != 0) allEven = false;\n        if (!allEven) break;\n        for (int &x : a) x /= 2;\n        ++answer;\n    }\n    cout << answer << '\\n';\n}"},{"id":"abc088_b","contest":"abc088","name":"Card Game for Two","zh":"两人取牌","time":15,"skill":"排序、交替累加","summary":"N 张牌上分别写有一个正整数。Alice 先取，之后两人轮流任取一张，直到牌被取完。两人都采取使自己得分最大的最优策略，求 Alice 的总分减去 Bob 的总分。","range":"1 ≤ N ≤ 100；1 ≤ aᵢ ≤ 100。","format":"第一行 N，第二行 N 个牌面数字。输出两人得分之差。","input":"3\n2 7 4","output":"5","hint":"两人每次会优先拿走怎样的牌？把牌排好后，哪些位置属于 Alice？","idea":"将牌按从大到小排序，每次拿最大剩余牌。先手获得下标 0、2、4… 的牌，后手获得 1、3、5… 的牌。较大的牌留给对手不会让自己更有利；也可通过交换相邻取牌选择理解。时间 O(N log N)，保存数组 O(N)。","check":"N=1；N 为奇数；有相同牌面；输入已经升序。","teacher":"区分“会调用 sort”和“知道为何排序”。追问升序后从后向前取是否等价，以及奇数张牌如何处理。","code":"#include <iostream>\n#include <vector>\n#include <algorithm>\n#include <functional>\nusing namespace std;\nint main() {\n    int n; cin >> n;\n    vector<int> a(n);\n    for (int &x : a) cin >> x;\n    sort(a.begin(), a.end(), greater<int>());\n    int answer = 0;\n    for (int i = 0; i < n; ++i) {\n        if (i % 2 == 0) answer += a[i];\n        else answer -= a[i];\n    }\n    cout << answer << '\\n';\n}"},{"id":"abc083_b","contest":"abc083","name":"Some Sums","zh":"数位和筛选","time":20,"skill":"枚举、数位、函数","summary":"检查 1 到 N 的所有整数。如果某个整数的十进制数位和位于 A 到 B 之间（包含两端），就把这个整数计入答案。输出这些整数的总和。","range":"1 ≤ N ≤ 10⁴；1 ≤ A ≤ B ≤ 36。","format":"一行三个整数 N A B。输出符合条件的整数之和。","input":"20 2 5","output":"84","hint":"枚举候选整数，再用临时变量拆分数位。注意要累加原整数，而不是它的数位和。","idea":"用 digitSum 函数计算数位和，x % 10 取末位，x /= 10 去掉末位。枚举 1…N，符合范围才累加。时间 O(N log N)，额外空间 O(1)。函数按值传参，因此拆分时不会修改外部枚举变量。","check":"A=B；N=1；N 的数位和恰好等于 A 或 B；没有数符合要求。","teacher":"观察是否包含 N、是否误改循环变量、是否把“计数”与“求和”混淆；允许字符串遍历解法。","code":"#include <iostream>\nusing namespace std;\nint digitSum(int x) {\n    int sum = 0;\n    while (x > 0) {\n        sum += x % 10;\n        x /= 10;\n    }\n    return sum;\n}\nint main() {\n    int n, a, b; cin >> n >> a >> b;\n    long long answer = 0;\n    for (int x = 1; x <= n; ++x) {\n        int s = digitSum(x);\n        if (a <= s && s <= b) answer += x;\n    }\n    cout << answer << '\\n';\n}"},{"id":"abc128_b","contest":"abc128","name":"Guidebook","zh":"餐厅指南","time":25,"skill":"记录组织、class / struct、多条件排序","summary":"有 N 家餐厅，输入顺序就是它们的编号（从 1 开始）。每家餐厅有城市名和评分，所有评分互不相同。先按城市名字典序升序排列；同一城市内按评分降序排列。按排序结果逐行输出餐厅原编号。","range":"1 ≤ N ≤ 100；城市名为 1～10 个小写英文字母；0 ≤ 评分 ≤ 100，评分两两不同。","format":"第一行 N，随后 N 行城市名和评分。输出 N 行原编号。","input":"6\nkhabarovsk 20\nmoscow 10\nkazan 50\nkazan 35\nmoscow 60\nkhabarovsk 40","output":"3\n4\n6\n1\n5\n2","hint":"一条记录需要保存城市、分数和原编号。比较两条记录时，先判断城市是否相同。","idea":"用 class 或 struct 把三个字段绑定在一起。比较器先比较 city，相同时比较 score，排序后输出 id。比较器必须使用严格比较，不能写成 <= 或 >=。时间 O(N log N · L)，L 为字符串长度上界；记录存储 O(NL)。","check":"全部同城；全部不同城市；只有一家餐厅；同城记录在原输入中交错出现。","teacher":"作为挑战题，不会自定义比较器不等于基础不合格。可追问 class 默认 private、struct 默认 public，以及为什么必须保留原编号；不要求继承、多态。","code":"#include <iostream>\n#include <vector>\n#include <string>\n#include <algorithm>\nusing namespace std;\nclass Restaurant {\npublic:\n    string city;\n    int score, id;\n};\nbool cmp(const Restaurant &a, const Restaurant &b) {\n    if (a.city != b.city) return a.city < b.city;\n    return a.score > b.score;\n}\nint main() {\n    int n; cin >> n;\n    vector<Restaurant> r(n);\n    for (int i = 0; i < n; ++i) {\n        cin >> r[i].city >> r[i].score;\n        r[i].id = i + 1;\n    }\n    sort(r.begin(), r.end(), cmp);\n    for (const auto &x : r) cout << x.id << '\\n';\n}"}];
const groups = [
 ['assessment','入门摸底',problems.map(p=>p.zh)],
 ['cpp','C++ 基础',['输入输出与数据类型','条件判断与循环','数组、vector 与字符串','函数与引用','struct 与 class','排序与比较器','调试与复杂度']],
 ['bronze','基础算法',['模拟与状态更新','枚举与分类讨论','排序与简单贪心','计数、集合与映射','网格与坐标','限时综合训练']],
 ['next','后续进阶',['前缀和与差分','二分查找与答案','双指针与滑动窗口','递归、DFS 与 BFS']]
];
const plans={
 cpp:['正确读入多组数值；区分 int、long long、double 与 string；输出严格匹配题目。','熟练使用 if、for、while；理解初始化、循环条件、更新与 break。','掌握从 0 开始的下标、长度与边界；数组保存数据，vector 动态追加，string 逐字符处理。','把重复计算拆成函数；理解返回值、按值传参和引用修改原变量。','用记录绑定多个属性；理解成员访问、对象与类型，以及 class 和 struct 的默认访问权限。','调用 sort；分清升序、降序和多条件优先级；比较器使用严格比较并保持一致。','根据数据范围估计循环次数；用最小数据、重复数据和边界数据定位错误。'],
 bronze:['明确哪些变量表示当前状态，按顺序执行操作；先判断是否合法，再更新状态。','先确定枚举对象和范围，再证明没有遗漏；根据数据范围选择一层或多层循环。','发现排序后相邻关系或最优选择；能解释策略，并主动寻找反例。','从计数数组开始，按需要引入 set、map；比较不同表示方式的适用范围。','二维数组的行列、边界、方向与邻格；逐步连接到网格搜索。','独立读题、估算复杂度、实现、自测、提交与复盘；根据错题安排下一阶段。'],
 next:['在基础数组操作稳定后，学习区间求和与批量区间修改。','先理解有序查找，再识别答案与可行性之间的单调关系。','在能解释区间状态后，学习维护两个移动边界，减少重复计算。','在模拟和二维遍历稳定后，学习递归状态、搜索顺序、访问标记与连通性。']
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=s=>'<pre><code>'+esc(s)+'</code></pre>';
const external=(url,label)=>`<a class="button" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
const url=p=>`https://atcoder.jp/contests/${p.contest}/tasks/${p.id}?lang=en`;
const key='sean-usaco-records-v1';
let records={}; let storageOK=true;
try{records=JSON.parse(localStorage.getItem(key)||'{}');if(!records||typeof records!=='object'||Array.isArray(records))records={};}catch{records={};storageOK=false;}
const statusOptions=['未开始','尝试中','独立 AC','提示后 AC','待复习'];
const completed=()=>problems.filter(p=>['独立 AC','提示后 AC'].includes(records[p.id]?.status)).length;
function rows(){return problems.map((p,i)=>`<section class="problem-row"><span class="number">${String(i+1).padStart(2,'0')}</span><div><h2><a href="#/assessment/${i+1}">${p.name} · ${p.zh}</a></h2><p class="meta">${p.id.toUpperCase()} · 建议 ${p.time} 分钟${i===4?' · 挑战题':''}</p><p class="meta">${p.skill}</p></div><span class="badge">${esc(records[p.id]?.status||'未开始')}</span></section>`).join('');}
function overview(){return `<p class="intro">先独立作答，再复盘。C++ · AtCoder · 约 85 分钟 + 10 分钟交流</p><div class="callout"><p><strong>本次安排</strong>：依次完成前四题，再尝试第五题。卡住可以先跳过，并记录已尝试的思路。</p><p>每题先读题、写代码、自测，再到 AtCoder 提交；摸底阶段暂不展开提示和参考解法。</p></div><p class="meta">完成 ${completed()} / 5 · 完成状态由你手动记录，不会自动读取 AtCoder。</p><div class="progress"><span style="width:${completed()*20}%"></span></div>${rows()}<div class="actions"><a class="button" href="#/guide">提交与评测说明</a><a class="button" href="#/review">复盘记录</a><a class="button" href="#/teacher">授课参考</a></div>`;}
function problemPage(p,i){const r=records[p.id]||{};return `<article class="lesson"><p class="intro">第 ${i+1} / 5 题 · ${p.id.toUpperCase()} · ${p.name} · 建议 ${p.time} 分钟</p><p class="meta">训练内容：${p.skill}${i===4?'。本题为挑战，不必因未完成而停留过久。':''}</p><div class="actions">${external(url(p),'AtCoder 原题')}${external(`https://atcoder.jp/contests/${p.contest}/submit?taskScreenName=${p.id}`,'提交 C++ 程序')}</div><h2>中文题意</h2><p>${p.summary}</p><h2>输入与输出</h2><p>${p.format}</p><p class="meta">数据范围：${p.range}</p><div class="sample"><div><strong>样例输入</strong>${code(p.input)}</div><div><strong>样例输出</strong>${code(p.output)}</div></div><p class="note">中文题意为本站整理，完整题面与评测规则以 <a href="${url(p)}" target="_blank" rel="noopener noreferrer">AtCoder 官方题目</a> 为准。</p><details class="answer"><summary>提示（独立尝试后再展开）</summary><p>${p.hint}</p></details><details class="answer"><summary>思路与 C++ 参考解法（复盘时查看）</summary><p>${p.idea}</p>${code(p.code)}<h3>自测方向</h3><p>${p.check}</p></details><section class="record"><h2>完成记录</h2><p class="meta">${storageOK?'仅保存在当前浏览器，不会自动同步给老师；可到复盘页导出。':'浏览器存储不可用，当前记录仅在本页会话内保留，请及时导出。'}</p><label for="status">完成状态</label><select id="status">${statusOptions.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><label for="notes">用时、卡点与自己的解释</label><textarea id="notes" rows="4" placeholder="例如：15 分钟；第一次 WA 是下标差 1；后来用边界数据发现问题。">${esc(r.notes||'')}</textarea><p id="save-message" class="meta" role="status"></p></section><nav class="actions" aria-label="题目导航">${i>0?`<a class="button" href="#/assessment/${i}">← 上一题</a>`:''}<a class="button" href="#/assessment">返回题单</a>${i<4?`<a class="button" href="#/assessment/${i+2}">下一题 →</a>`:'<a class="button" href="#/review">进入复盘 →</a>'}</nav></article>`;}
function guide(){return `<article class="lesson"><h2>第一次提交</h2><ol><li>先登录或注册自己的 AtCoder 账号。</li><li>从题目页打开“提交 C++ 程序”，确认题名与当前题目一致。未登录时会先进入登录页。</li><li>在语言列表中选择 C++（推荐 C++17 或更新版本，以提交页面实际提供的选项为准）。</li><li>粘贴包含头文件和 main 函数的完整程序，再提交。</li><li>等待评测结果。通过后，在本站手动更新完成状态。</li></ol><h2>读懂评测结果</h2><ul><li><strong>AC</strong>：通过评测，再确认自己能解释思路。</li><li><strong>WA</strong>：答案错误，检查题意、下标、边界、大小写与多余输出。</li><li><strong>CE</strong>：编译错误，先阅读报错位置和类型。</li><li><strong>RE</strong>：运行错误，检查越界、除零等问题。</li><li><strong>TLE</strong>：超时，检查循环能否终止以及算法复杂度。</li></ul><h2>提交前检查</h2><p>程序只输出题目要求的内容，不输出“请输入”等提示。样例通过不代表所有数据通过，至少再测一个最小情况和一个边界情况。</p><p>本站不运行 C++ 程序，也不代为提交。请在本地编译运行，将最终代码交给 AtCoder 评测。</p></article>`;}
function teacher(){return `<article class="lesson"><p class="intro">本页是公开的授课参考。摸底时请 Sean 先停留在题目页。</p><h2>观察顺序</h2><p>前四题共约 60 分钟，第五题约 25 分钟，最后留 10 分钟口头交流。记录提示发生的时间和提示内容，区别独立完成与引导后完成。</p>${problems.map((p,i)=>`<h2>${i+1}. ${p.name}</h2><p>${p.teacher}</p>`).join('')}<h2>据此安排下一课</h2><ul><li>前两题不稳定：先补数组、下标、循环与手动模拟。</li><li>前三题稳定、第四题卡住：练习枚举对象、函数与条件筛选。</li><li>前四题能独立完成：进入模拟、枚举与排序的综合训练。</li><li>第五题能完成并解释比较器：减少语法复习，增加记录排序、复杂模拟和简单贪心。</li></ul><p>这些是课程起点建议，不是 USACO 等级判定。未学过某个库函数时，先让他描述自己的算法。</p><h2>class 补充口头题</h2><p>Restaurant 是类型还是对象？每家餐厅应保存哪些字段？class 中不写 public 会怎样？为什么排序后仍需要原编号？不以继承、多态作为本次门槛。</p></article>`;}
function review(){return `<article class="lesson"><p class="intro">记录自己的思路，比只记录 AC 更有用。</p><div class="table-scroll"><table><thead><tr><th>题目</th><th>状态</th><th>用时与卡点</th></tr></thead><tbody>${problems.map((p,i)=>`<tr><td><a href="#/assessment/${i+1}">${p.name}</a></td><td>${esc(records[p.id]?.status||'未开始')}</td><td style="white-space:pre-wrap">${esc(records[p.id]?.notes||'尚未记录')}</td></tr>`).join('')}</tbody></table></div><button class="button" id="export">导出复盘记录 (.txt)</button><p class="meta">记录保存在当前浏览器。导出后可自行发给老师，不会自动发送。</p><h2>复盘时回答三个问题</h2><ol><li>程序维护了哪些变量，它们分别表示什么？</li><li>为什么不会漏掉需要处理的情况？</li><li>除了样例，还有什么输入可能让程序出错？</li></ol></article>`;}
const main=document.getElementById('content');
function render(){
 const parts=location.hash.slice(1).split('/').filter(Boolean),section=parts[0]||'',idx=Number(parts[1])-1;
 const group=groups.find(g=>g[0]===section),valid=group&&Number.isInteger(idx)&&idx>=0&&idx<group[2].length;
 let pageTitle=valid?group[2][idx]:group?group[1]:({'guide':'提交与评测说明','teacher':'授课参考','review':'复盘记录'}[section]||'学习大纲');
 const nav=`<a href="#/" ${!section?'aria-current="page"':''}>首页</a>`+groups.map(g=>`<a href="#/${g[0]}" ${section===g[0]?'aria-current="page"':''}>${g[1]}</a>`).join('');
 document.getElementById('tabs').innerHTML=nav;
 const sidebar=`<a href="#/">学习大纲</a>`+groups.map(g=>`<details ${section===g[0]?'open':''}><summary>${g[1]}</summary><nav>${g[2].map((n,i)=>`<a href="#/${g[0]}/${i+1}" ${section===g[0]&&idx===i?'aria-current="page"':''}>${n}</a>`).join('')}</nav></details>`).join('')+`<a href="#/guide">提交说明</a><a href="#/review">复盘记录</a><a href="#/teacher">授课参考</a>`;
 document.getElementById('sidebar').innerHTML=sidebar;
 let body='';
 if(section==='assessment')body=valid?problemPage(problems[idx],idx):overview();
 else if(group){body=valid?`<article class="lesson"><p>${plans[section][idx]}</p><h2>学习目标</h2><p>能用自己的话解释概念，并独立写出对应程序。具体课程根据入门摸底结果逐步展开。</p><div class="callout"><p>本页目前是大纲条目；完整练习与参考代码先集中在入门摸底。</p></div><a class="button" href="#/assessment">进入摸底题单 →</a></article>`:`<p class="intro">${section==='next'?'基础稳定后再逐步展开，不作为本次摸底要求。':'先通过摸底确定需要补充的知识，再按实际进度学习。'}</p><div class="index">${group[2].map((n,i)=>`<section><h2><a href="#/${section}/${i+1}">${n}</a></h2><p>${plans[section][i]}</p></section>`).join('')}</div>`;}
 else if(section==='guide')body=guide();else if(section==='teacher')body=teacher();else if(section==='review')body=review();
 else if(section){pageTitle='页面未找到';body='<p>这个目录地址不存在。</p><a href="#/">返回首页</a>';}
 else body=`<p class="intro">Sean 的 C++ / USACO 学习笔记</p><div class="callout"><p><strong>从这里开始：入门摸底</strong></p><p>5 道可在 AtCoder 提交的题目，从数组操作到记录排序。先独立完成，再对照思路复盘。</p><div class="actions"><a class="button primary" href="#/assessment">进入摸底题单 →</a><a class="button" href="#/guide">查看提交说明</a></div></div><div class="index">${groups.slice(1).map(g=>`<section><h2><a href="#/${g[0]}">${g[1]}</a></h2><ul>${g[2].map((n,i)=>`<li><a href="#/${g[0]}/${i+1}">${n}</a></li>`).join('')}</ul></section>`).join('')}<section><h2>练习与复盘</h2><ul><li><a href="#/assessment">入门摸底 · 5 道 AtCoder 题</a></li><li><a href="#/review">我的完成记录</a></li><li><a href="#/teacher">授课参考与后续安排</a></li></ul><p class="meta">课程目录随学习进度补充；当前先完成摸底。</p></section></div>`;
 main.innerHTML=`<details class="mobile-nav"><summary>浏览学习目录</summary><nav>${nav}<a href="#/review">复盘记录</a><a href="#/guide">提交说明</a></nav></details>${section?'<p class="breadcrumb"><a href="#/">首页</a> / '+(valid?`<a href="#/${section}">${group[1]}</a>`:pageTitle)+'</p>':''}<h1>${pageTitle}</h1>${body}`;
 document.title=pageTitle+' · Sean 的算法竞赛笔记';
 if(section==='assessment'&&valid){const p=problems[idx]; const save=()=>{records[p.id]={status:document.getElementById('status').value,notes:document.getElementById('notes').value};try{localStorage.setItem(key,JSON.stringify(records));storageOK=true;document.getElementById('save-message').textContent='已保存在当前浏览器';}catch{storageOK=false;document.getElementById('save-message').textContent='浏览器存储不可用，请到复盘页导出记录。';}};document.getElementById('status').addEventListener('change',save);document.getElementById('notes').addEventListener('input',save);}
 if(section==='review')document.getElementById('export').addEventListener('click',()=>{const text='Sean · C++ 入门摸底复盘\n\n'+problems.map(p=>p.id.toUpperCase()+' '+p.name+'\n状态：'+(records[p.id]?.status||'未开始')+'\n记录：'+(records[p.id]?.notes||'尚未记录')+'\n题目：'+url(p)).join('\n\n');const href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=href;a.download='Sean_摸底复盘.txt';a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);});
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){main.focus();return;}render();main.focus({preventScroll:true});});render();

</script><noscript>请启用 JavaScript 查看课程目录。题目来源：AtCoder。</noscript></body></html>
