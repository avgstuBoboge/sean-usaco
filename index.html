const lessons = {"python/1": "<h2>输入后先确认类型</h2><p>input() 返回字符串。需要整数计算时用 int 转换；一行多个整数可用 split 和 map。</p><pre><code>n = int(input())\na, b = map(int, input().split())\nword = input().strip()</code></pre><h2>除法、整除与取模</h2><p>/ 返回浮点数；// 对商向下取整。处理题目中的正整数减半时使用 //。负数整除也向下取整，不是向零截断。</p><pre><code>print(9 / 2)    # 4.5\nprint(9 // 2)   # 4\nprint(9 % 2)    # 1\nprint(-3 // 2)  # -2</code></pre><h2>命名与输出</h2><p>用 nums、values、names 等名字保存列表，不用 list、str、sum 作变量名，以免遮蔽内置工具。提交程序时不要输出“请输入”等提示；调试输出在提交前删除。</p><h2>本课订正与巩固</h2><h2>输入转换订正</h2><p>N = int(input())先读取字符串，再转换为整数。N = int, input()会构造元组，其中包括int类型对象和读到的字符串，并未完成转换。input().split()得到字符串列表，map(int, ...)将每项转换为整数；可用a,b = map(int,input().split())解包。</p><p><a href=\"#/homework/6\">查看本课巩固作业</a></p>", "python/2": "<h2>循环条件与计数</h2><p>先写清楚“什么时候继续”和“什么时候停止”。完成一次有效操作后再增加计数，避免停止时多加一次。布尔变量用 True / False，表达意图比字符串开关更清楚。</p><pre><code>value = 20\nsteps = 0\nwhile value &gt; 3:\n    value -= 3\n    steps += 1\nprint(value, steps)  # 2 6</code></pre><h2>while True 与 break</h2><p>先检查能否继续，再更新状态。break 只退出它所在的最近一层循环。多层循环中可用布尔标志把结果传到外层。</p><h2>for-else 的含义</h2><p>else 与 for 对齐。循环正常结束且未执行 break 时，才会执行 else；它不表示“最后一次 if 不成立”。</p><pre><code>values = [2, 4, 7]\nfor x in values:\n    if x % 2 == 1:\n        print(&quot;found odd&quot;)\n        break\nelse:\n    print(&quot;all even&quot;)</code></pre><h2>自己检查</h2><p>把例子分别改成全偶数、首个元素为奇数、最后一个为奇数，预测输出再运行。</p>", "python/3": "<h2>列表与下标</h2><p>长度为 n 的列表，下标范围是 0 到 n−1。倒数第 k 个元素可写 a[len(a)-k] 或 a[-k]，前提是 1 ≤ k ≤ len(a)。</p><pre><code>a = [12, 25, 38]\na.append(49)\nprint(a[-1])        # 49\nprint(a[len(a)-2])  # 38\nprint(a[-2])        # 38</code></pre><h2>修改循环变量不等于修改列表</h2><p>for x in a 中，给 x 重新赋值不会把结果写回原列表。需要保存变化时，用下标赋值或构造新列表。</p><pre><code>a = [8, 10]\nfor i in range(len(a)):\n    a[i] //= 2\nprint(a)  # [4, 5]</code></pre><h2>排序和删除的代价</h2><p>sort() 原地排序，返回 None；sorted(a) 返回新列表。排序通常只需做一次。pop(0) 会移动后续元素，是 O(n) 操作；按下标遍历可避免反复移动。</p><h2>list 与 tuple</h2><p>list 可以修改元素；tuple 的元素位置不能重新赋值。元组适合保存一条固定结构的记录，如 (姓名, 分数)。元组中若包含列表，那个内部列表本身仍可修改。</p>", "python/4": "<h2>把数位处理拆成函数</h2><p>数字转为字符串后逐字符遍历，再将每个字符转为整数。这种写法不依赖固定的位数；下面的函数用于非负整数。</p><pre><code>def digit_sum(n):\n    total = 0\n    for ch in str(n):\n        total += int(ch)\n    return total\n\nprint(digit_sum(5042))  # 11</code></pre><h2>局部变量与返回值</h2><p>total 每次调用函数时重新初始化。return 把结果交回调用处，print 只负责显示。计算数位和时，不要误改枚举候选数的变量。</p><h2>练习方向</h2><p>把函数分别用于 0、单个数字、带有 0 的整数和更多位的整数。区分“数字本身”“数位和”“满足条件的个数”和“满足条件的数字总和”。</p>", "python/5": "<h2>先写排序规则</h2><p>Python 的 tuple 按从左到右的顺序比较：第一项相同时再比较第二项。先把排序规则说清楚，再把它写成 key。</p><h2>lambda 和多关键字</h2><p>lambda 可以理解为只有一个表达式的匿名函数。对数值取负可以让该关键字按降序排列，同时保留其他关键字的升序。</p><pre><code>students = [(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\nstudents.sort(key=lambda x: (-x[1], x[0]))\nprint(students)\n# [(&quot;Alice&quot;, 95), (&quot;Bob&quot;, 95), (&quot;Amy&quot;, 80)]</code></pre><h2>等价的 def 写法</h2><p>不熟悉 lambda 时先写普通函数，能更清楚地观察每条记录对应的排序键。</p><pre><code>def rank_key(student):\n    return (-student[1], student[0])\n\nstudents.sort(key=rank_key)</code></pre><h2>常见误区</h2><p>reverse=True 会反转整个排序方向，不能直接表达“一项升序、另一项降序”。同样的 key 会保留原相对顺序，这是 Python 排序的稳定性。涉及原编号时，应把编号与记录一起保存。</p>", "python/6": "<h2>类型、对象与初始化</h2><p>class 定义一种类型；调用类创建一个具体对象（instance）。__init__ 在实例初始化时设置属性；self 表示当前实例。通常简单记录用 tuple 就够了，需要绑定行为或自定义比较时可以使用 class。</p><h2>__lt__ 定义“小于”</h2><p>排序可以调用对象的 __lt__。下面比较分母为正的分数，用交叉相乘避免先转为浮点数；分母为负时先统一符号，分母为零没有定义。</p><pre><code>class Fraction:\n    def __init__(self, numerator, denominator):\n        if denominator == 0:\n            raise ValueError(&quot;zero denominator&quot;)\n        if denominator &lt; 0:\n            numerator = -numerator\n            denominator = -denominator\n        self.numerator = numerator\n        self.denominator = denominator\n\n    def __lt__(self, other):\n        return (self.numerator * other.denominator\n                &lt; other.numerator * self.denominator)\n\nvalues = [Fraction(2, 3), Fraction(1, 2), Fraction(3, 4)]\nvalues.sort()\nfor x in values:\n    print(x.numerator, x.denominator)\n# 1 2\n# 2 3\n# 3 4</code></pre><h2>为什么交叉相乘成立</h2><p>当 b、d 都为正时，a/b &lt; c/d 等价于 a×d &lt; c×b。比较必须严格，不能用 ≤ 代替 &lt;。若题目要求同分时按编号排序，还需要明确处理相等情况。</p>", "python/7": "<h2>先找最小反例</h2><p>先预测一个小输入的正确结果，再运行程序。不要每次只重复测试题目样例。优先检查空操作、单个元素、首尾位置、重复值和刚好满足条件的情况。</p><h2>print 调试</h2><p>打印循环前后的关键变量，观察哪一次状态首次偏离预期。可以把调试信息写到 stderr，最终提交仍建议删除。</p><pre><code>import sys\nvalues = [6, 8]\nfor i in range(len(values)):\n    print(&quot;before&quot;, i, values[i], file=sys.stderr)\n    values[i] //= 2\n    print(&quot;after&quot;, i, values[i], file=sys.stderr)</code></pre><h2>断点与单步</h2><p>在 VS Code 等支持 Python 调试的编辑器中，把断点放在状态更新前，逐行执行，观察变量面板。核对变量的值、类型、循环次数和实际走到的分支。具体启动方式取决于本地解释器和调试配置。</p><h2>粗略估算复杂度</h2><p>列表遍历 O(n)，排序 O(n log n)，列表头部删除 O(n)。若每轮都排序或 pop(0)，总开销可能明显增大。先根据数据规模估算，再决定实现。</p>", "homework/1": "<p class=\"intro\">第 1 课作业 · Python · 2026-10-25</p><p>先完成三道必做新题，再尝试选做题。先自己实现、自测，遇到错误时保留出错输入和修改原因。题意摘要为本站整理，完整要求以 AtCoder 原题为准。</p><h2>必做 · ABC284_A · Sequence of Strings</h2><p>读入 N 个字符串，按输入顺序的逆序逐行输出。注意是反转字符串之间的顺序，不是反转每个字符串的字符。</p><p><a href=\"https://atcoder.jp/contests/abc284/tasks/abc284_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：先用下标循环完成；再思考负数索引或 reversed 的等价写法。不要用 sort 改变原有顺序。</p><p>自测方向：自行测试 N=1、含数字的字符串、重复字符串。</p><h2>必做 · ABC187_A · Large Digits</h2><p>输入两个三位整数 A、B，分别计算十进制数位和，输出两个数位和中较大的值。</p><p><a href=\"https://atcoder.jp/contests/abc187/tasks/abc187_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：写一个 digit_sum 函数，用字符串遍历处理数位，不固定拆百位、十位、个位。</p><p>自测方向：自行测试两个数位和相等、数字中含 0、100 与 999。</p><h2>必做 · ABC201_B · Do you know the second highest mountain?</h2><p>每座山有名称和高度，各山的名字与高度均互不相同。输出第二高的山的名称。</p><p><a href=\"https://atcoder.jp/contests/abc201/tasks/abc201_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：用 list/tuple 绑定名称与整数高度，用 key 排序；先确认第二高对应哪个下标。</p><p>自测方向：自行测试只有两座山、输入已经有序，以及高度为 9 与 100 的情况。注意高度必须转为整数。</p><h2>进阶选做 · ABC308_C · Standings</h2><p>第 i 人有 Aᵢ 次正面、Bᵢ 次反面，成功率为 Aᵢ/(Aᵢ+Bᵢ)。按成功率从高到低输出编号；相同成功率按编号从小到大。</p><p><a href=\"https://atcoder.jp/contests/abc308/tasks/abc308_c?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：尝试用 class 与 __lt__ 表达顺序，以交叉相乘比较成功率，避免直接计算浮点数。</p><p>自测方向：先验证相同成功率、成功率为 0 或 1、非常接近的两个成功率。本题数据量更大，属于挑战，未完成可带思路来讨论。</p><h2>必做小练习：定位错误</h2><p>下面的程序想把列表中的每个数减半并保存整数结果。先预测实际输出，再修改程序。解释两个问题分别出在哪里。此题在本地完成。</p><pre><code>values = [8, 12]\nfor x in values:\n    x = x / 2\nprint(values)</code></pre><h2>完成后带来</h2><p>三道必做题的 Python 代码与评测结果；调试小练习的修复代码；至少一个自己构造的测试，以及遇到错误时的修改说明。无需填写本站记录。</p>", "lesson/1": "<p>第 2 课 · Python · 2026-11-01 · 课后整理</p><h2>本课内容</h2><ol><li><a href=\"#/lesson/2\">class、__lt__ 与多关键字排序复习</a></li><li><a href=\"#/next/1\">一维前缀和：定义、构建与区间查询</a></li><li><a href=\"#/lesson/3\">区间和实现与边界调试</a></li><li><a href=\"#/lesson/4\">字符串计数与前缀和</a></li><li><a href=\"#/lesson/5\">乘积与取模概念拓展</a></li></ol><h2>课后重点</h2><p>独立写出排序和前缀和程序，解释每个下标的意义；用首尾、单点与跨边界的情况检查程序。</p><p><a class=\"button\" href=\"#/homework/2\">第 2 课作业单</a></p>", "lesson/2": "<h2>先预测排序结果</h2><p>按分数从高到低，同分时按姓名字典序从小到大。先写出输出顺序，再运行。</p><pre><code>students = [(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\nstudents.sort(key=lambda x: (-x[1], x[0]))</code></pre><p>逐项写出 key：Amy 对应 (-80, \"Amy\")，Bob 对应 (-95, \"Bob\")，Alice 对应 (-95, \"Alice\")。元组从左到右比较。</p><h2>class 把属性放在同一个对象里</h2><pre><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def __lt__(self, other):\n        return (-self.score, self.name) &lt; (-other.score, other.name)</code></pre><p>Student 是类型，Student(\"Amy\", 80) 创建一个实例。__init__ 设置初始属性，self 表示当前对象，other 是比较的另一个对象。</p><pre><code>a = Student(&quot;Amy&quot;, 80)\nb = Student(&quot;Bob&quot;, 95)\na.score += 5\nprint(a.score, b.score)  # 85 95\n\nroster = [a, b, Student(&quot;Alice&quot;, 95)]\nroster.sort()\nfor student in roster:\n    print(student.name, student.score)</code></pre><h2>key 与 __lt__</h2><p>key 返回用来排序的值；__lt__ 回答当前对象是否应排在另一对象之前。普通多字段排序通常用 key 更直接；这里用同一规则对照复习。</p><pre><code>roster.sort(key=lambda s: (-s.score, s.name))</code></pre><h2>分数比较复习</h2><p>当两个分母都为正时，a/b &lt; c/d 等价于 a*d &lt; c*b。用整数交叉相乘避免浮点误差。__lt__ 使用严格的 &lt;，同值比较应返回 False；题目若要求编号打破平局，需要额外比较编号。</p><h2>口头自测</h2><ul><li>为什么给 a.score 赋值不改变 b.score？</li><li>为什么 reverse=True 不能单独反转分数这一项？</li><li>sort() 的返回值是什么？</li><li>2/3 和 3/4 的交叉乘积分别是多少？</li></ul><h2>比较规则要一致</h2><p>Python 排序使用小于比较。没有 key 时比较对象本身；有 key 时比较 key 返回的值。__lt__ 返回 True 或 False，供比较和排序过程使用。仅仅写出方法还不够，规则必须一致，不能让两个对象互相“小于”。</p>", "next/1": "<h2>为什么要保存累计结果</h2><p>对数组 [3, 1, 4, 2, 5]，反复询问第 l 个到第 r 个数的和。每次循环或 sum(nums[l-1:r]) 都会重复累加；切片也要复制元素。一次询问最坏 O(n)，q 次最坏 O(nq)。</p><h2>定义决定下标</h2><p>prefix[i] 表示前 i 个数的和。prefix[0] = 0，表示前 0 个数的和。原数组 nums 使用 Python 的 0-based 下标；题目位置从 1 开始。</p><div class=table-scroll><table><thead><tr><th>i</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><th>第 i 个数</th><td>—</td><td>3</td><td>1</td><td>4</td><td>2</td><td>5</td></tr><tr><th>prefix[i]</th><td>0</td><td>3</td><td>4</td><td>8</td><td>10</td><td>15</td></tr></tbody></table></div><h2>区间和就是两段前缀之差</h2><p>题目区间 [l, r] 包含两端。prefix[r] 包括第 1 到第 r 个数，减掉第 1 到第 l−1 个数，留下第 l 到第 r 个数。</p><pre><code>区间和 = prefix[r] - prefix[l - 1]\n[2, 4] 的和 = 10 - 3 = 7</code></pre><h2>构建与查询</h2><pre><code>nums = [3, 1, 4, 2, 5]\nprefix = [0]\nfor x in nums:\n    prefix.append(prefix[-1] + x)\n\nl, r = 2, 4\nprint(prefix[r] - prefix[l - 1])  # 7</code></pre><p>构建遍历一次，O(n)；每次查询做一次减法，O(1)；总时间 O(n+q)，额外空间 O(n)。</p><h2>边界检查</h2><ul><li>l=1：减去 prefix[0]。</li><li>l=r：结果应等于该位置的一个数。</li><li>r=n：使用 prefix[n]，因此数组共有 n+1 项。</li><li>负数也适用求和，但前缀和不一定递增。</li></ul><h2>使用条件</h2><p>本课假设数组在查询期间不变。若修改原数组，已有前缀和可能失效，需要更新相应累计结果。</p><h2>课堂使用的下标写法</h2><pre><code>prefix = [0] * (len(nums) + 1)\nfor i in range(1, len(nums) + 1):\n    prefix[i] = prefix[i - 1] + nums[i - 1]</code></pre><p>第 i 个数存放在 nums[i-1]。prefix 是普通 Python 列表，“前缀和”描述的是它保存的数据含义。循环里只计算当前项，不把列表整体覆盖成一个数。</p><h2>前缀和复习：先定义，再核对边界</h2><p>prefix[i] 表示前 i 个数的和，prefix[0]=0。题目位置从1开始时，[L,R]对应 nums 的下标 L-1 到 R-1；prefix[R]-prefix[L-1]去掉的是前L-1个数。</p><p>独立写代码时按三步完成：读取数据、构建一次前缀和、处理全部查询。用单元素、整个区间、左端点为1和右端点为N四种情况自测。修改原数组后，应重新构建前缀和。</p><p><a href=\"#/homework/4\">前缀和巩固与函数模块作业 →</a></p><h2>本课订正与巩固</h2><h2>区间编号与下标：两套写法不能混用</h2><p>统一定义prefix[i]为前i个元素的和。题目位置从1开始，[L,R]的和是prefix[R]-prefix[L-1]。数组下标从0开始，[l,r]的和是prefix[r+1]-prefix[l]。例如下标2至4的和是prefix[5]-prefix[2]。</p><h2>分类前缀和</h2><p>pre1[i]与pre2[i]分别统计前i名学生中两个班的分数。两个数组都以0开头，每经过一个学生位置，都分别继承上一项，再给所属班级加分。因此二者长度始终相同。查询分别相减，总复杂度O(N+Q)。</p><p>修改数组某项后，该项及后面的前缀值需要更新；当前阶段可以重新构建整份前缀和。</p><p><a href=\"#/homework/6\">查看本课巩固作业</a></p>", "lesson/3": "<h2>独立实现：多次区间和</h2><p>输入 n、q，接着一行 n 个整数，再读入 q 行 l、r。每行输出题目位置 l 到 r（包含两端）的元素之和。1 ≤ l ≤ r ≤ n；n、q 可到 100000。</p><h2>课堂样例</h2><pre><code>输入\n5 4\n3 1 4 2 5\n2 4\n1 5\n3 3\n1 1\n\n输出\n7\n15\n4\n3</code></pre><h2>编码步骤</h2><ol><li>读入整数列表。</li><li>构建长度 n+1 的前缀和。</li><li>逐行读入查询，输出答案。</li></ol><h2>找出下面的错误</h2><pre><code>prefix = []\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nanswer = prefix[r] - prefix[l]</code></pre><p>先找第一个会触发的错误，再检查查询公式。用 l=1 和 l=r 的输入验证修正。</p><h2>独立自测</h2><p>数组 [5]，查询 [1,1] 应输出 5；数组 [2,-3,4]，查询 [1,3] 应输出 3，查询 [2,2] 应输出 -3。负数例子是额外的本地练习。</p><h2>Python 读入与输出</h2><pre><code>import sys\ninput = sys.stdin.readline\n\nn, q = map(int, input().split())\nnums = list(map(int, input().split()))</code></pre><p>sys.stdin.readline 按行读入，可减少大量输入时的开销。读取字符串时可用 input().strip() 去掉末尾换行；它也会去掉首尾空白，因此只在题目允许时使用。读入方式不能替代算法优化。</p><h2>range 的右端点</h2><p>题目位置 L 到 R 对应 Python 下标 L-1 到 R-1，因此直接累加的循环是 range(L-1, R)。这个循环用于理解和检查，数据大时使用前缀和查询。</p>", "homework/2": "<p>第 2 课作业 · Python · 对应课堂：2026-11-01</p><p>先做基础题，再完成课堂布置的 AC 题；分类求和选做。中文题意为本站整理，完整要求以 AtCoder 原题为准。</p><h2>1. 必做基础：A06 · How Many Guests?</h2><p>给出 N 天的到访人数，回答 Q 次第 L 到第 R 天的到访总人数。N、Q 均可到 100000。</p><p>练习要求：独立构建前缀和，再处理查询。已在课堂完成，也请关掉示例重写一遍。</p><p>自测方向：N=1；L=1；L=R；R=N。解释 prefix[0] 的含义。</p><p><a href=\"https://atcoder.jp/contests/tessoku-book/tasks/math_and_algorithm_ai\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>2. 必做课堂作业：ABC122_C · GeT AC</h2><p>给出由 A、C、G、T 组成的字符串，多次询问指定子串内连续 AC 的出现次数。原题使用大写字符，区间包含两端。</p><p>练习要求：先写清楚0/1标记代表哪个位置，再处理区间边界。不要把跨出左端点或右端点的 AC 算进去。</p><p>自测方向：对 ACAC，区间 [1,4] 答案2，[2,3] 答案0，[2,4] 答案1。原题要求 L&lt;R。</p><p><a href=\"https://atcoder.jp/contests/abc122/tasks/abc122_c\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>3. 巩固选做：Typical90 010 · Score Sum Queries</h2><p>每位学生属于1班或2班，并有一个分数。每次查询编号区间 [L,R]，分别输出区间内两个班的分数总和。</p><p>练习要求：思考如何分别累计两类数据。注意输入先给 N 和 N 条学生记录，之后才给 Q。</p><p>自测方向：区间内只有一个班；分数为0；单个学生；查询整个区间。</p><p><a href=\"https://atcoder.jp/contests/typical90/tasks/typical90_j\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>必做小练习：排序与 class</h2><p>用同一份数据分别写 tuple + key 和 Student 类 + __lt__ 两种实现。分数降序，同分姓名升序；输出姓名和分数。</p><pre><code>数据：[(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\n输出：\nAlice 95\nBob 95\nAmy 80</code></pre><p>解释 self 和 other，说明 __lt__ 返回什么。加入完全相同的记录，检查比较仍是严格小于。</p><h2>调试小练习</h2><pre><code>prefix = []\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nanswer = prefix[R] - prefix[L]</code></pre><p>假设 nums 非空且 L、R 是合法的题目位置，先指出第一个错误，再修正查询公式。用单元素和整个区间测试。</p>", "lesson/4": "<h2>从字符扫描到事件计数</h2><p>课堂讨论了连续 ac 的出现次数。对应 AtCoder 作业使用大写 AC，代码必须与题目的大小写一致。先固定标记含义：第 j 个位置与第 j+1 个位置组成 AC，就在起点 j 记1，否则记0。</p><pre><code>s = &quot;ACAC&quot;\nmarks = [0] * len(s)\nfor i in range(len(s) - 1):\n    if s[i] == &quot;A&quot; and s[i + 1] == &quot;C&quot;:\n        marks[i] = 1\n# marks = [1, 0, 1, 0]</code></pre><h2>区间端点为什么要重新检查</h2><p>查询题目位置 [L,R] 时，AC 的两个字符都必须落在区间内。因此允许的起点是 L 到 R-1，不能把第 R 个位置作为起点。</p><p>例如 ACAC 的 [2,3] 是 CA，答案为0；[2,4] 是 CAC，答案为1。请画出允许的起点，再结合前缀和定义推导查询式。</p><h2>先定义，再套公式</h2><p>可以用起点记事件，也可以用终点记事件，两种方法的查询下标不同。不要混用定义。作业先独立写出标记与查询范围，再检查公式。</p>", "lesson/5": "<h2>乘积前缀的条件</h2><p>课堂仅作概念拓展，不要求现在实现。若所有因子非零，可以保存前缀乘积，再用两个前缀的商求区间乘积。包含0时无法直接相除，还需要单独处理零的数量等信息。Python 的 / 会产生浮点数，整数精确计算要另行考虑。</p><h2>取模之后不能直接相除</h2><p>先取模会丢失原整数信息。在模 m 的意义下，只有除数与 m 互质时才存在乘法逆元，才能用乘逆元代替除法。本阶段先掌握加法前缀和，不布置逆元题。</p><h2>修改原数组</h2><p>普通前缀和保存的是当时的累计结果。修改某个元素会影响从该位置开始的前缀和。频繁修改且需要穿插查询时，后续再学习相应数据结构。</p>", "lesson03/1": "<h2>本课目标与工具分工</h2><p>Python 解释器执行代码；VS Code 用来编辑和运行。</p><p>Anaconda 管理环境与软件包。</p><p>Jupyter 用单元格组织代码、输出与说明。</p><p>今天完成：计算误差 → 写成函数 → 跨文件调用。</p><h2>课前准备：课程环境</h2><pre><code># 在 Anaconda Prompt 中运行，不是 Python 单元格\nconda create -n sean-python python=3.12 pip\nconda activate sean-python\npython -m pip install jupyterlab ipykernel\npython -m jupyterlab</code></pre><p>已有合适课程环境可继续使用，不必重复创建。</p><p>VS Code 选择 sean-python；Notebook 选择同一环境。</p><h2>核对正在使用的 Python</h2><pre><code>import sys\nprint(sys.executable)\nprint(sys.version)</code></pre><p>在 VS Code 脚本和 Jupyter 中分别运行。</p><p>检查解释器路径是否指向同一个课程环境。</p><p>VS Code 的解释器与 Notebook 内核要分别选择。</p><p>课前安装是准备工作；如果暂时无法配置完成，先使用可用的 Python 解释器完成函数与模块练习。Python 3.12 是本课环境建议，科研导师如指定版本则以其要求为准。</p>", "lesson03/2": "<h2>安装与导入</h2><p>安装：把第三方软件包放进某个 Python 环境。</p><p>导入：让当前程序能够使用模块中的名字。</p><p>math、random、os 属于标准库，无需额外安装。</p><p>自己写的 analysis_utils.py 也可以导入。</p><p>装好包后，每个需要它的程序仍要写 import。</p><h2>math：使用模块中的函数</h2><pre><code>import math\n\nprint(math.sqrt(81))   # 9.0\nprint(math.floor(3.8)) # 3\nprint(math.ceil(3.2))  # 4</code></pre><p>点号左边是模块名，右边是其中的函数名。</p><p>动手：预测 floor(-1.2) 与 ceil(-1.2) 的结果。</p><h2>random 与 os</h2><pre><code>import random\nimport os\n\nprint(random.randint(1, 6))\nprint(random.choice([9.5, 10.0, 10.5]))\nprint(os.getcwd())</code></pre><p>randint(1, 6) 包含两个端点；结果可能重复。</p><p>getcwd() 显示当前工作目录，它未必是脚本所在目录。</p>", "lesson03/3": "<h2>函数复习：参数与返回值</h2><pre><code>def absolute_error(measured, target):\n    return abs(measured - target)\n\nresult = absolute_error(9.5, 10.0)\nprint(result)  # 0.5</code></pre><p>measured、target 接收本次调用传入的值。</p><p>return 把计算结果交回调用处，由 result 保存。</p><h2>print 与 return</h2><pre><code>def show_error(measured, target):\n    print(abs(measured - target))\n\nresult = show_error(9.5, 10.0)\nprint(result)</code></pre><p>先预测屏幕上会出现哪两行。</p><p>如果还需要把误差放进列表，函数应怎样修改？</p><h2>自己的模块：analysis_utils.py</h2><pre><code># analysis_utils.py\ndef absolute_error(measured, target):\n    return abs(measured - target)</code></pre><p>把文件保存为 analysis_utils.py。</p><p>模块是可导入的 Python 文件。</p><p>计算函数放在这里，主程序负责调用与显示。</p><h2>主程序：main.py</h2><pre><code># main.py，与 analysis_utils.py 放在同一目录\nimport analysis_utils\n\nerror = analysis_utils.absolute_error(9.5, 10.0)\nprint(error)  # 0.5</code></pre><p>保存两个文件，再运行 main.py。</p><p>修改传入的测量值，观察结果；不需要重写函数。</p><h2>导入后的名字</h2><pre><code>import analysis_utils\nanalysis_utils.absolute_error(9.5, 10.0)\n\nimport analysis_utils as au\nau.absolute_error(9.5, 10.0)\n\nfrom analysis_utils import absolute_error\nabsolute_error(9.5, 10.0)</code></pre><p>三种写法分别单独练习，观察调用名称如何变化。</p><p>函数里的局部变量不会自动成为主程序的变量。</p><h2>文件、模块与包</h2><p>main.py：启动并组织本次计算。</p><p>analysis_utils.py：可重复导入的模块。</p><p>多个模块可组织成包，例如：</p><p>utils/</p><p>    __init__.py</p><p>    errors.py</p><p>这时可以写 from utils import errors。</p>", "lesson03/4": "<h2>把函数用于一组测量值</h2><pre><code>import analysis_utils\n\nmeasurements = [9.5, 10.0, 10.5]\nerrors = []\nfor value in measurements:\n    errors.append(\n        analysis_utils.absolute_error(value, 10.0)\n    )\nprint(errors)</code></pre><p>先预测结果，再运行： [0.5, 0.0, 0.5]。</p><p>动手：增加一个测量值 11.0。</p><h2>Jupyter 的执行顺序</h2><pre><code># 单元格 A\ntarget = 10.0\n\n# 单元格 B\nprint(abs(9.5 - target))</code></pre><p>先运行 A，再运行 B。</p><p>只修改 A 的文字为 target = 12.0，不运行 A，再运行 B。</p><p>输出会变化吗？最后重启内核并按顺序运行全部单元格。</p><h2>遇到错误时的检查顺序</h2><p>ModuleNotFoundError：检查拼写、文件位置与环境。</p><p>NameError：检查是否执行了定义或 import 的单元格。</p><p>结果是 None：检查函数是否 return 了计算结果。</p><p>旧输出没变化：保存脚本；Notebook 重启后全部运行。</p><p>安装第三方包时，用当前环境的 python -m pip。</p><p>Notebook 中可用 %pip；本课标准库无需安装。</p>", "homework/3": "<p class=\"intro\">第 3 课 · Python 本地练习</p><h2>独立任务与课后练习</h2><p>独立任务：</p><p>新增 squared_error(measured, target)，返回差的平方。</p><p>在 main.py 导入并调用，测试 9.5 与 10.0，答案 0.25。</p><p>课后：处理 [9.5, 10.0, 10.5]，输出两种误差列表。</p><p>在 Notebook 重复调用；重启内核后运行全部单元格。</p><p>带上两个 .py 文件、Notebook，以及自己的测试结果。</p><h2>自测要求</h2><p>测试 measured 小于、等于、大于 target 三种情况。函数负责返回数值，主程序负责显示；核对两种误差都是非负数。</p><h2>环境核对</h2><p>在脚本与 Notebook 中分别输出 sys.executable，确认使用同一课程环境。解释为何标准库不需要 pip 安装，以及只修改单元格文字为什么不一定改变运行结果。</p><h2>选做：排序复习</h2><p>用 (测量值, 绝对误差) 保存记录，按误差升序排列；误差相同时按测量值升序。先用 tuple key 完成，再尝试用 class 表达记录。保持误差函数可以从主程序导入。</p>", "lesson03/5": "<p>本周从 11 月 8 日周日课程开始，后续保留家长计划中的周六与周日课程。以下为计划内容，完成后根据实际进度更新。</p><div class=\"table-scroll\"><table><thead><tr><th>日期（2026）</th><th>课程内容</th></tr></thead><tbody><tr><td>11月8日（周日）</td><td>环境、标准库、函数与模块</td></tr><tr><td>11月14日（周六）</td><td>栈队列、set/dict、嵌套结构；Counter/defaultdict/deque</td></tr><tr><td>11月15日（周日）</td><td>文件读写、with、pathlib、CSV/JSON</td></tr><tr><td>11月21日（周六）</td><td>递归、迭代与生成器</td></tr><tr><td>11月22日（周日）</td><td>异常处理与调试</td></tr><tr><td>11月28日（周六）</td><td>模拟、class 与封装</td></tr><tr><td>11月29日（周日）</td><td>NumPy 数组基础</td></tr><tr><td>12月5日（周六）</td><td>前缀和与差分、cumsum/diff、几何计算</td></tr><tr><td>12月6日（周日）</td><td>Pandas 数据处理</td></tr><tr><td>12月12日（周六）</td><td>绘图与置换检验入门</td></tr><tr><td>12月13日（周日）</td><td>OpenCV、相机标定与 ArUco 流程初步认识</td></tr></tbody></table></div><p>目标是为科研项目准备 Python 基础与常用工具。后段科研专题先建立概念和可运行流程，掌握深度结合前面练习与科研导师要求调整。</p>", "environment/1": "<h2>本课目标与工具分工</h2><p>Python 解释器执行代码；VS Code 用来编辑和运行。</p><p>Anaconda 管理环境与软件包。</p><p>Jupyter 用单元格组织代码、输出与说明。</p><p>今天完成：计算误差 → 写成函数 → 跨文件调用。</p><h2>课前准备：课程环境</h2><pre><code># 在 Anaconda Prompt 中运行，不是 Python 单元格\nconda create -n sean-python python=3.12 pip\nconda activate sean-python\npython -m pip install jupyterlab ipykernel\npython -m jupyterlab</code></pre><p>已有合适课程环境可继续使用，不必重复创建。</p><p>VS Code 选择 sean-python；Notebook 选择同一环境。</p><h2>核对正在使用的 Python</h2><pre><code>import sys\nprint(sys.executable)\nprint(sys.version)</code></pre><p>在 VS Code 脚本和 Jupyter 中分别运行。</p><p>检查解释器路径是否指向同一个课程环境。</p><p>VS Code 的解释器与 Notebook 内核要分别选择。</p>", "environment/2": "<h2>安装与导入</h2><p>安装：把第三方软件包放进某个 Python 环境。</p><p>导入：让当前程序能够使用模块中的名字。</p><p>math、random、os 属于标准库，无需额外安装。</p><p>自己写的 analysis_utils.py 也可以导入。</p><p>装好包后，每个需要它的程序仍要写 import。</p><h2>math：使用模块中的函数</h2><pre><code>import math\n\nprint(math.sqrt(81))   # 9.0\nprint(math.floor(3.8)) # 3\nprint(math.ceil(3.2))  # 4</code></pre><p>点号左边是模块名，右边是其中的函数名。</p><p>动手：预测 floor(-1.2) 与 ceil(-1.2) 的结果。</p><h2>random 与 os</h2><pre><code>import random\nimport os\n\nprint(random.randint(1, 6))\nprint(random.choice([9.5, 10.0, 10.5]))\nprint(os.getcwd())</code></pre><p>randint(1, 6) 包含两个端点；结果可能重复。</p><p>getcwd() 显示当前工作目录，它未必是脚本所在目录。</p>", "environment/3": "<h2>Jupyter 的执行顺序</h2><pre><code># 单元格 A\ntarget = 10.0\n\n# 单元格 B\nprint(abs(9.5 - target))</code></pre><p>先运行 A，再运行 B。</p><p>只修改 A 的文字为 target = 12.0，不运行 A，再运行 B。</p><p>输出会变化吗？最后重启内核并按顺序运行全部单元格。</p><h2>核对脚本和 Notebook 的课程环境</h2><p>在VS Code中，Python脚本选择解释器，Notebook右上角单独选择内核，两者都使用sean-python。分别运行 import sys 和 print(sys.executable)，确认路径一致。重启内核会清除变量，应重新按顺序运行全部单元格。</p>", "environment/4": "<h2>遇到错误时的检查顺序</h2><p>ModuleNotFoundError：检查拼写、文件位置与环境。</p><p>NameError：检查是否执行了定义或 import 的单元格。</p><p>结果是 None：检查函数是否 return 了计算结果。</p><p>旧输出没变化：保存脚本；Notebook 重启后全部运行。</p><p>安装第三方包时，用当前环境的 python -m pip。</p><p>Notebook 中可用 %pip；本课标准库无需安装。</p>", "modules/1": "<h2>函数复习：参数与返回值</h2><pre><code>def absolute_error(measured, target):\n    return abs(measured - target)\n\nresult = absolute_error(9.5, 10.0)\nprint(result)  # 0.5</code></pre><p>measured、target 接收本次调用传入的值。</p><p>return 把计算结果交回调用处，由 result 保存。</p><h2>print 与 return</h2><pre><code>def show_error(measured, target):\n    print(abs(measured - target))\n\nresult = show_error(9.5, 10.0)\nprint(result)</code></pre><p>先预测屏幕上会出现哪两行。</p><p>如果还需要把误差放进列表，函数应怎样修改？</p><h2>把函数用于一组测量值</h2><pre><code>import analysis_utils\n\nmeasurements = [9.5, 10.0, 10.5]\nerrors = []\nfor value in measurements:\n    errors.append(\n        analysis_utils.absolute_error(value, 10.0)\n    )\nprint(errors)</code></pre><p>先预测结果，再运行： [0.5, 0.0, 0.5]。</p><p>动手：增加一个测量值 11.0。</p><h2>把区间求和拆成可复用函数</h2><p>计算函数接收参数并return结果；输入输出由主程序负责。build_prefix(nums)负责构建，range_sum(prefix,L,R)负责查询。不要在每次查询时重复构建，也不要用print代替返回值。</p><p><a href=\"#/homework/4\">函数与模块综合练习 →</a></p>", "modules/2": "<h2>自己的模块：analysis_utils.py</h2><pre><code># analysis_utils.py\ndef absolute_error(measured, target):\n    return abs(measured - target)</code></pre><p>把文件保存为 analysis_utils.py。</p><p>模块是可导入的 Python 文件。</p><p>计算函数放在这里，主程序负责调用与显示。</p><h2>主程序：main.py</h2><pre><code># main.py，与 analysis_utils.py 放在同一目录\nimport analysis_utils\n\nerror = analysis_utils.absolute_error(9.5, 10.0)\nprint(error)  # 0.5</code></pre><p>保存两个文件，再运行 main.py。</p><p>修改传入的测量值，观察结果；不需要重写函数。</p><h2>导入后的名字</h2><pre><code>import analysis_utils\nanalysis_utils.absolute_error(9.5, 10.0)\n\nimport analysis_utils as au\nau.absolute_error(9.5, 10.0)\n\nfrom analysis_utils import absolute_error\nabsolute_error(9.5, 10.0)</code></pre><p>三种写法分别单独练习，观察调用名称如何变化。</p><p>函数里的局部变量不会自动成为主程序的变量。</p><h2>文件、模块与包</h2><p>main.py：启动并组织本次计算。</p><p>analysis_utils.py：可重复导入的模块。</p><p>多个模块可组织成包，例如：</p><p>utils/</p><p>    __init__.py</p><p>    errors.py</p><p>这时可以写 from utils import errors。</p><h2>数据统计函数的模块练习</h2><h2>模块练习：stats_utils.py</h2><pre><code># stats_utils.py\ndef count_labels(labels):\n    # 实现计数并返回字典\n    pass\n\ndef unique_labels(labels):\n    # 返回排序后的不同名称列表\n    pass</code></pre><p>两个函数都接收参数，并返回结果。</p><p>保存文件后，在 main.py 中使用它们。</p><h2>主程序调用模块</h2><pre><code># main.py\nimport stats_utils\n\nlabels = [&quot;A&quot;, &quot;B&quot;, &quot;A&quot;, &quot;C&quot;, &quot;B&quot;, &quot;A&quot;]\nprint(stats_utils.count_labels(labels))\nprint(stats_utils.unique_labels(labels))</code></pre><p>把两个 .py 文件放在同一目录。</p><p>import 后使用模块名和函数名调用。</p><p>换一组输入，检验函数能否复用。</p><p><a href=\"#/homework/5\">计数函数与模块作业</a></p>", "next/6": "<h2>独立实现：多次区间和</h2><p>输入 n、q，接着一行 n 个整数，再读入 q 行 l、r。每行输出题目位置 l 到 r（包含两端）的元素之和。1 ≤ l ≤ r ≤ n；n、q 可到 100000。</p><h2>课堂样例</h2><pre><code>输入\n5 4\n3 1 4 2 5\n2 4\n1 5\n3 3\n1 1\n\n输出\n7\n15\n4\n3</code></pre><h2>编码步骤</h2><ol><li>读入整数列表。</li><li>构建长度 n+1 的前缀和。</li><li>逐行读入查询，输出答案。</li></ol><h2>找出下面的错误</h2><pre><code>prefix = []\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nanswer = prefix[r] - prefix[l]</code></pre><p>先找第一个会触发的错误，再检查查询公式。用 l=1 和 l=r 的输入验证修正。</p><h2>独立自测</h2><p>数组 [5]，查询 [1,1] 应输出 5；数组 [2,-3,4]，查询 [1,3] 应输出 3，查询 [2,2] 应输出 -3。负数例子是额外的本地练习。</p><h2>Python 读入与输出</h2><pre><code>import sys\ninput = sys.stdin.readline\n\nn, q = map(int, input().split())\nnums = list(map(int, input().split()))</code></pre><p>sys.stdin.readline 按行读入，可减少大量输入时的开销。读取字符串时可用 input().strip() 去掉末尾换行；它也会去掉首尾空白，因此只在题目允许时使用。读入方式不能替代算法优化。</p><h2>range 的右端点</h2><p>题目位置 L 到 R 对应 Python 下标 L-1 到 R-1，因此直接累加的循环是 range(L-1, R)。这个循环用于理解和检查，数据大时使用前缀和查询。</p>", "next/7": "<h2>从字符扫描到事件计数</h2><p>课堂讨论了连续 ac 的出现次数。对应 AtCoder 作业使用大写 AC，代码必须与题目的大小写一致。先固定标记含义：第 j 个位置与第 j+1 个位置组成 AC，就在起点 j 记1，否则记0。</p><pre><code>s = &quot;ACAC&quot;\nmarks = [0] * len(s)\nfor i in range(len(s) - 1):\n    if s[i] == &quot;A&quot; and s[i + 1] == &quot;C&quot;:\n        marks[i] = 1\n# marks = [1, 0, 1, 0]</code></pre><h2>区间端点为什么要重新检查</h2><p>查询题目位置 [L,R] 时，AC 的两个字符都必须落在区间内。因此允许的起点是 L 到 R-1，不能把第 R 个位置作为起点。</p><p>例如 ACAC 的 [2,3] 是 CA，答案为0；[2,4] 是 CAC，答案为1。请画出允许的起点，再结合前缀和定义推导查询式。</p><h2>先定义，再套公式</h2><p>可以用起点记事件，也可以用终点记事件，两种方法的查询下标不同。不要混用定义。作业先独立写出标记与查询范围，再检查公式。</p>", "next/8": "<h2>乘积前缀的条件</h2><p>课堂仅作概念拓展，不要求现在实现。若所有因子非零，可以保存前缀乘积，再用两个前缀的商求区间乘积。包含0时无法直接相除，还需要单独处理零的数量等信息。Python 的 / 会产生浮点数，整数精确计算要另行考虑。</p><h2>取模之后不能直接相除</h2><p>先取模会丢失原整数信息。在模 m 的意义下，只有除数与 m 互质时才存在乘法逆元，才能用乘逆元代替除法。本阶段先掌握加法前缀和，不布置逆元题。</p><h2>修改原数组</h2><p>普通前缀和保存的是当时的累计结果。修改某个元素会影响从该位置开始的前缀和。频繁修改且需要穿插查询时，后续再学习相应数据结构。</p>", "roadmap/1": "<p><strong>加课更新：</strong>11月25日（周三）10:00–12:00 EST，提前学习“模拟、class与封装”。后续课程日期暂保持原排期，11月28日内容结合本次完成情况衔接。<a href=\"#/python/9\">查看加课课件</a></p><p>本周从 11 月 8 日周日课程开始，后续保留家长计划中的周六与周日课程。以下为计划内容，完成后根据实际进度更新。</p><div class=\"table-scroll\"><table><thead><tr><th>日期（2026）</th><th>课程内容</th></tr></thead><tbody><tr><td>11月8日（周日）</td><td>环境、标准库、函数与模块</td></tr><tr><td>11月14日（周六）</td><td>栈队列、set/dict、嵌套结构；Counter/defaultdict/deque</td></tr><tr><td>11月15日（周日）</td><td>文件读写、with、pathlib、CSV/JSON</td></tr><tr><td>11月21日（周六）</td><td>递归、迭代与生成器</td></tr><tr><td>11月22日（周日）</td><td>异常处理与调试</td></tr><tr><td>11月28日（周六）</td><td>模拟、class 与封装</td></tr><tr><td>11月29日（周日）</td><td>NumPy 数组基础</td></tr><tr><td>12月5日（周六）</td><td>前缀和与差分、cumsum/diff、几何计算</td></tr><tr><td>12月6日（周日）</td><td>Pandas 数据处理</td></tr><tr><td>12月12日（周六）</td><td>绘图与置换检验入门</td></tr><tr><td>12月13日（周日）</td><td>OpenCV、相机标定与 ArUco 流程初步认识</td></tr></tbody></table></div><p>目标是为科研项目准备 Python 基础与常用工具。后段科研专题先建立概念和可运行流程，掌握深度结合前面练习与科研导师要求调整。</p>", "python/8": "<h2>先预测排序结果</h2><p>按分数从高到低，同分时按姓名字典序从小到大。先写出输出顺序，再运行。</p><pre><code>students = [(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\nstudents.sort(key=lambda x: (-x[1], x[0]))</code></pre><p>逐项写出 key：Amy 对应 (-80, \"Amy\")，Bob 对应 (-95, \"Bob\")，Alice 对应 (-95, \"Alice\")。元组从左到右比较。</p><h2>class 把属性放在同一个对象里</h2><pre><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def __lt__(self, other):\n        return (-self.score, self.name) &lt; (-other.score, other.name)</code></pre><p>Student 是类型，Student(\"Amy\", 80) 创建一个实例。__init__ 设置初始属性，self 表示当前对象，other 是比较的另一个对象。</p><pre><code>a = Student(&quot;Amy&quot;, 80)\nb = Student(&quot;Bob&quot;, 95)\na.score += 5\nprint(a.score, b.score)  # 85 95\n\nroster = [a, b, Student(&quot;Alice&quot;, 95)]\nroster.sort()\nfor student in roster:\n    print(student.name, student.score)</code></pre><h2>key 与 __lt__</h2><p>key 返回用来排序的值；__lt__ 回答当前对象是否应排在另一对象之前。普通多字段排序通常用 key 更直接；这里用同一规则对照复习。</p><pre><code>roster.sort(key=lambda s: (-s.score, s.name))</code></pre><h2>分数比较复习</h2><p>当两个分母都为正时，a/b &lt; c/d 等价于 a*d &lt; c*b。用整数交叉相乘避免浮点误差。__lt__ 使用严格的 &lt;，同值比较应返回 False；题目若要求编号打破平局，需要额外比较编号。</p><h2>口头自测</h2><ul><li>为什么给 a.score 赋值不改变 b.score？</li><li>为什么 reverse=True 不能单独反转分数这一项？</li><li>sort() 的返回值是什么？</li><li>2/3 和 3/4 的交叉乘积分别是多少？</li></ul><h2>比较规则要一致</h2><p>Python 排序使用小于比较。没有 key 时比较对象本身；有 key 时比较 key 返回的值。__lt__ 返回 True 或 False，供比较和排序过程使用。仅仅写出方法还不够，规则必须一致，不能让两个对象互相“小于”。</p>", "homework/4": "<p class=\"intro\">对应课堂：2026-11-08 · Python</p><p>先完成第1、2、3、5题，再做第4题；第6题选做。按时完成作业，先独立尝试，再查阅知识点。第2、4题是已有题目的巩固重练，不要求追求新题数量。</p><h2>1. 前缀和手算与边界检查（必做）</h2><p>给定 nums=[3, 1, 4, 2, 5]。先不写代码，写出完整前缀和数组，并用一句话说明 prefix[i] 的含义。查询位置从1开始，包含两端。</p><p>练习要求：计算 [1,1]、[2,4]、[5,5]、[1,5] 四个区间的和，分别写出减去的两个前缀。解释开头为什么放0、为什么不能统一写 prefix[R]-prefix[L]。</p><p>自测：计算完成后用直接累加核对。再用 nums=[2,-3,4] 测试整个区间及单个负数，检查有负数时是否仍成立。</p><h2>2. A06 · How Many Guests?（必做，独立重写）</h2><p>给出 N 天的来访人数和 Q 次查询，求第 L 天到第 R 天的总人数。第一行 N Q，第二行 N 个整数，之后 Q 行 L R。N、Q 最大为100000。</p><p>练习要求：关闭课堂示例，独立完成读取、预处理和查询。只构建一次前缀和；每次查询不再遍历或切片求和。即使以前做过，这次也要从空文件重写。</p><p>自测：自行测试 N=1、L=R、L=1、R=N。完成后说明预处理和单次查询各需要多少操作量。</p><p><a href=\"https://atcoder.jp/contests/tessoku-book/tasks/math_and_algorithm_ai?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>3. 修复前缀和程序（必做）</h2><p>下面程序希望处理 nums=[3,1,4,2,5]，查询第2个到第4个数的和。先预测最先在哪一行出错，再修复所有逻辑错误。</p><pre><code>nums = [3, 1, 4, 2, 5]\nL, R = 2, 4\nprefix = []\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nprint(prefix[R] - prefix[L])</code></pre><p>练习要求：说明每处修改的原因。不要只改到程序不报错，要确认答案正确。</p><p>自测：[2,4] 应为7；[1,1] 应为3；[5,5] 应为5；[1,5] 应为15。</p><h2>4. ABC122_C · GeT AC（巩固题）</h2><p>给出只含 A、C、G、T 的字符串，多次询问指定子串中连续 AC 出现了几次。原题使用大写字母，查询两端均包含，且 L&lt;R。</p><p>练习要求：完成前3题后再做。先写出自己的0/1标记含义：按AC的起点标记，或按终点标记，选一种并保持一致。画出查询中允许计数的位置，再推导查询式。</p><p>自测：S=ACAC 时，[1,4] 为2，[2,3] 为0，[2,4] 为1，[1,2] 为1。AC不能跨出查询边界。</p><p><a href=\"https://atcoder.jp/contests/abc122/tasks/abc122_c?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>5. 把前缀和封装成函数和模块（必做）</h2><p>沿用第2题的计算逻辑，新建 prefix_utils.py 和 main.py，放在同一个文件夹。无需重新设计算法。</p><pre><code># Function interfaces in prefix_utils.py\ndef build_prefix(nums):\n    # Return the prefix-sum list.\n    pass\n\ndef range_sum(prefix, L, R):\n    # Positions start at 1; both ends are included.\n    pass</code></pre><p>练习要求：prefix_utils.py 中实现 build_prefix(nums)，返回前缀和列表；实现 range_sum(prefix,L,R)，返回题目位置[L,R]的区间和。两个函数都使用 return 返回结果，不读取输入、不打印。main.py 用 import prefix_utils 导入，构建一次后调用多次，并负责打印。</p><p>自测：nums=[3,1,4,2,5]，依次查询[1,1]、[2,4]、[1,5]，输出3、7、15。再测 nums=[5] 的[1,1]。说明只用print而不return时，调用者会收到什么。</p><h2>6. Notebook 调用模块（选做）</h2><p>在两个.py文件所在文件夹创建 practice.ipynb，选择 sean-python 内核。</p><p>练习要求：第一个单元格导入模块并定义 nums；第二个构建 prefix；第三个完成查询。先重启内核，再按顺序运行全部单元格。随后修改 nums，观察是否需要重新构建 prefix。</p><p>自测：脚本与Notebook输出的 sys.executable 应指向同一课程环境。修改模块文件后，重启内核并全部运行，避免沿用旧模块。解释为什么只修改单元格文字、但不运行，不会更新内存中的变量。</p><h2>完成后带来</h2><p>各题 Python 文件、prefix_utils.py 与 main.py；选做时附 Notebook。保留一个出错案例及修正原因。原题完整要求以 AtCoder 为准。</p>", "bronze/4": "<p class=\"intro\">Python 数据容器：用实验记录练习计数与分组。</p><h2>同一份数据，不同的需求</h2><pre><code>labels = [&quot;A&quot;, &quot;B&quot;, &quot;A&quot;, &quot;C&quot;, &quot;B&quot;, &quot;A&quot;]</code></pre><p>第三条来自谁？列表保留位置与重复记录。</p><p>有哪些设备？集合保留不同的名称。</p><p>每台设备有几条？字典保存名称与次数。</p><h2>字典的键与值</h2><pre><code>counts = {&quot;A&quot;: 3, &quot;B&quot;: 2, &quot;C&quot;: 1}\nprint(counts[&quot;A&quot;])\ncounts[&quot;A&quot;] = 4\nprint(&quot;B&quot; in counts)\nprint(counts.get(&quot;D&quot;, 0))</code></pre><p>用键读取、修改对应的值。</p><p>in 检查键是否存在。get 可以指定缺失时的默认值。</p><h2>手写计数字典</h2><pre><code>counts = {}\nfor name in labels:\n    if name not in counts:\n        counts[name] = 0\n    counts[name] += 1\nprint(counts)</code></pre><p>追踪前三次循环：读到 A，再读 B，再读 A。</p><p>每次只更新当前名称的次数。</p><h2>get 与字典遍历</h2><pre><code>counts = {}\nfor name in labels:\n    counts[name] = counts.get(name, 0) + 1\n\nfor name, count in counts.items():\n    print(name, count)</code></pre><p>get 读取旧次数，赋值保存新次数。</p><p>items() 让循环同时拿到键和值。</p><h2>集合与去重</h2><pre><code>devices = set(labels)\nprint(sorted(devices))\nprint(len(devices))\nprint(&quot;D&quot; in devices)\ndevices.add(&quot;D&quot;)</code></pre><p>集合中同一个元素只保留一次。</p><p>空集合写 set()，空字典写 {}。</p><p>集合没有位置下标，稳定展示时使用 sorted。</p><h2>独立练习：新出现的设备</h2><pre><code>first = [&quot;A&quot;, &quot;B&quot;, &quot;A&quot;]\nsecond = [&quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;C&quot;]</code></pre><p>找出第二批中第一批没出现过的名称。</p><p>结果去重，并按字母顺序显示。</p><p>先尝试循环与 not in，再尝试集合差集。</p><h2>Counter 统计出现次数</h2><pre><code>from collections import Counter\n\ncounts = Counter(labels)\nprint(dict(counts))\nprint(counts[&quot;D&quot;])\nprint(counts.most_common(2))</code></pre><p>collections 属于标准库，无需另外安装。</p><p>Counter 把常用的计数过程封装起来。</p><h2>列表中的字典记录</h2><pre><code>records = [\n    {&quot;device&quot;: &quot;A&quot;, &quot;value&quot;: 10},\n    {&quot;device&quot;: &quot;B&quot;, &quot;value&quot;: 20},\n    {&quot;device&quot;: &quot;A&quot;, &quot;value&quot;: 12},\n    {&quot;device&quot;: &quot;C&quot;, &quot;value&quot;: 8},\n    {&quot;device&quot;: &quot;B&quot;, &quot;value&quot;: 18},\n]</code></pre><p>records[0] 是第一条记录。</p><p>records[0][&quot;value&quot;] 是这条记录的测量值。</p><h2>普通字典按设备分组</h2><pre><code>groups = {}\nfor row in records:\n    name = row[&quot;device&quot;]\n    if name not in groups:\n        groups[name] = []\n    groups[name].append(row[&quot;value&quot;])</code></pre><p>A 对应 [10, 12]，B 对应 [20, 18]，C 对应 [8]。</p><p>这里保存每组的测量值列表，而不是次数。</p><h2>defaultdict 创建默认值</h2><pre><code>from collections import defaultdict\n\ngroups = defaultdict(list)\nfor row in records:\n    groups[row[&quot;device&quot;]].append(row[&quot;value&quot;])\nprint(dict(groups))</code></pre><p>首次访问缺失的键时，调用 list 创建空列表。</p><p>传入 list，不写 list()。</p><h2>独立练习：每台设备的均值</h2><pre><code>for name, values in groups.items():\n    # 计算并打印这一组的平均值\n    pass</code></pre><p>预期结果：A 为 11.0，B 为 19.0，C 为 8.0。</p><p>计算前先说出每组的总和与数量。</p><p>完成后尝试写成返回字典的函数。</p><p><a href=\"#/homework/5\">配套练习</a> · <a href=\"#/bronze/9\">查看完整课堂课件</a></p><h2>AtCoder 配套例题</h2><p>集合题适合热身，栈与队列题配对练习，字典题作为计数后的提高练习。中文题意为本站整理，以原题为准。</p><h2>集合：ABC085 B Kagami Mochi</h2><p>选一些年糕叠起来，上层直径必须严格小于下层。</p><p>求最多能叠几层。</p><p>输入：N，随后 N 行各一个直径。</p><p>范围：1 ≤ N ≤ 100，1 ≤ 直径 ≤ 100。</p><p><a href=\"https://atcoder.jp/contests/abc085/tasks/abc085_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>直径：10、8、8、6</p><p>最多 3 层，可以用 10、8、6。</p><p>相同直径为什么只能选一个？</p><p>不同直径是否一定都能用上？</p><h2>字典：ABC091 B Two Colors Card Game</h2><p>选择一个字符串。每张同名蓝卡得 1 分，红卡扣 1 分。</p><p>求能获得的最高净分，只比较完全相同的字符串。</p><p>输入：N 与 N 行蓝卡字符串，再读 M 与 M 行红卡字符串。</p><p>N、M 都不超过 100。</p><p><a href=\"https://atcoder.jp/contests/abc091/tasks/abc091_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>自编例子：蓝卡 cat、cat、dog，红卡 cat、dog。</p><p>选 cat 得 1 分，选 dog 得 0 分。</p><p>如果每个已出现的词都是负分，答案是多少？</p><p>提示：也可以选择一个没有出现过的词。</p><h2>本课订正与巩固</h2><h2>容器用途与易错点</h2><p>字典保存键与值，集合只保留不同元素。直接遍历字典得到键，items()提供键值对。get(key,0)返回默认值但不会自动插入键。Counter本身支持键查询和items，无需先转成dict；查询缺失键返回0。defaultdict(list)用方括号访问缺失键时，创建并保存空列表。</p><p>种类数用len(set(...))，计数用字典或Counter；sum用于数值求和，不能替代种类统计。</p><p><a href=\"#/homework/6\">查看本课巩固作业</a></p><h2>11月15日课堂巩固</h2><h2>字典与混合输入复习</h2><p>scores[name] += 1要求键已存在；首次计数用scores[name] = scores.get(name,0) + 1。遍历字典本身得到键，遍历items()得到键值对。姓名是字符串，票数是整数，不要混用。</p><p>操作1 x与2长度不同：先parts = input().split()，判断parts[0]后再读取parts[1]。不要每行都固定解包成两个变量。固定格式下op[2:]可截取参数，但split更适合空白分隔的输入。列表append/pop从尾部操作；deque的append/popleft分别在尾部加入、头部取出。</p><p><a href=\"#/homework/8\">本课独立练习 →</a></p>", "bronze/7": "<p class=\"intro\">栈是后进先出，队列是先进先出。</p><h2>栈与撤销操作</h2><pre><code>stack = []\nstack.append(&quot;load&quot;)\nstack.append(&quot;filter&quot;)\nstack.append(&quot;plot&quot;)\nprint(stack.pop())\nprint(stack)</code></pre><p>后进先出：最后加入的操作最先撤销。</p><p>append 加到末尾，pop() 从末尾取出并返回。</p><h2>空栈与边界</h2><pre><code>if stack:\n    action = stack.pop()\n    print(action)\nelse:\n    print(&quot;nothing to undo&quot;)</code></pre><p>空列表直接 pop() 会报错。</p><p>while stack 可以连续处理，直到栈变空。</p><h2>队列与任务处理</h2><pre><code>from collections import deque\n\nqueue = deque([&quot;A&quot;, &quot;B&quot;, &quot;C&quot;])\nqueue.append(&quot;D&quot;)\nwhile queue:\n    print(queue.popleft())</code></pre><p>先进先出：先进入的任务先处理。</p><p>append 从右加入，popleft 从左取出。</p><h2>独立练习：栈和队列的顺序</h2><p>依次加入 A、B。</p><p>取出一个元素。</p><p>加入 C，再取出一个元素。</p><p>分别写出栈和队列两次取出的结果。</p><p>先手算，再写代码验证。</p><h2>容器选择与综合验收</h2><p>保留全部实验记录及顺序：list。</p><p>只关心出现过哪些名称：set。</p><p>按名称查次数或测量值：dict。</p><p>撤销最后一次操作：用 list 做栈。</p><p>处理最早等待的任务：用 deque 做队列。</p><p><a href=\"#/homework/5\">容器综合练习</a></p><h2>AtCoder 配套例题</h2><p>集合题适合热身，栈与队列题配对练习，字典题作为计数后的提高练习。中文题意为本站整理，以原题为准。</p><h2>栈：ABC396 B Card Pile</h2><p>初始有 100 张写着 0 的卡片。</p><p>操作 1 x：把 x 放到最上面。</p><p>操作 2：移除最上面的卡片，并输出它。</p><p>输入 Q，再读 Q 行操作。Q ≤ 100，取出时保证有卡片。</p><p><a href=\"https://atcoder.jp/contests/abc396/tasks/abc396_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>自编操作：1 4，1 7，2，2，2</p><p>先手算三次输出，再写程序核对。</p><p>列表末尾作为栈顶。</p><p>初始状态应是空列表，还是 100 个 0？</p><h2>队列：ABC402 B Restaurant Queue</h2><p>餐厅队伍初始为空，每位客人带有一个菜单编号。</p><p>操作 1 x：携带编号 x 的客人加入队尾。</p><p>操作 2：队首客人入店，并输出其编号。</p><p>输入 Q，再读 Q 行操作。Q ≤ 100，取出时保证队伍非空。</p><p><a href=\"https://atcoder.jp/contests/abc402/tasks/abc402_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>自编操作：1 4，1 7，2，1 9，2</p><p>先手算两次输出，再写程序核对。</p><p>使用 deque，加入用 append，取出用 popleft。</p><p>如果所有操作都是加入，应输出什么？</p>", "bronze/9": "<p class=\"intro\">2026-11-13 · Python 数据容器</p><p>按页展开课堂讲义。代码可复制到已有课程环境运行，练习先独立尝试。</p><p><a href=\"#/bronze/4\">计数与分组笔记</a> · <a href=\"#/bronze/7\">栈与队列笔记</a> · <a href=\"#/homework/5\">配套作业</a></p><details class=\"answer\" open><summary>02 · 今天的学习任务</summary><h2>今天的学习任务</h2><p>用字典统计每台设备的记录数。</p><p>用集合找出新出现的设备。</p><p>把统计逻辑写成函数，并从另一个文件调用。</p><p>用栈和队列模拟不同的处理顺序。</p></details><details class=\"answer\"><summary>03 · 前缀和热身</summary><h2>前缀和热身</h2><p>nums = [3, 1, 4, 2, 5]</p><p>写出完整 prefix，并解释 prefix[i]。</p><p>查询 [1,1]、[2,4]、[5,5]、[1,5]。</p><p>位置从 1 开始，区间包含两端。</p></details><details class=\"answer\"><summary>04 · 前缀和的边界</summary><h2>前缀和的边界</h2><pre><code>prefix = [0]\nfor x in nums:\n    prefix.append(prefix[-1] + x)\n\nanswer = prefix[R] - prefix[L - 1]</code></pre><p>prefix[i] 表示前 i 个数的和。</p><p>减掉前 L−1 个数，保留第 L 到第 R 个数。</p><p>原数组改变后，需要重新构建 prefix。</p></details><details class=\"answer\"><summary>05 · 同一份数据，不同的需求</summary><h2>同一份数据，不同的需求</h2><pre><code>labels = [&quot;A&quot;, &quot;B&quot;, &quot;A&quot;, &quot;C&quot;, &quot;B&quot;, &quot;A&quot;]</code></pre><p>第三条来自谁？列表保留位置与重复记录。</p><p>有哪些设备？集合保留不同的名称。</p><p>每台设备有几条？字典保存名称与次数。</p></details><details class=\"answer\"><summary>06 · 字典的键与值</summary><h2>字典的键与值</h2><pre><code>counts = {&quot;A&quot;: 3, &quot;B&quot;: 2, &quot;C&quot;: 1}\nprint(counts[&quot;A&quot;])\ncounts[&quot;A&quot;] = 4\nprint(&quot;B&quot; in counts)\nprint(counts.get(&quot;D&quot;, 0))</code></pre><p>用键读取、修改对应的值。</p><p>in 检查键是否存在。get 可以指定缺失时的默认值。</p></details><details class=\"answer\"><summary>07 · 手写计数字典</summary><h2>手写计数字典</h2><pre><code>counts = {}\nfor name in labels:\n    if name not in counts:\n        counts[name] = 0\n    counts[name] += 1\nprint(counts)</code></pre><p>追踪前三次循环：读到 A，再读 B，再读 A。</p><p>每次只更新当前名称的次数。</p></details><details class=\"answer\"><summary>08 · get 与字典遍历</summary><h2>get 与字典遍历</h2><pre><code>counts = {}\nfor name in labels:\n    counts[name] = counts.get(name, 0) + 1\n\nfor name, count in counts.items():\n    print(name, count)</code></pre><p>get 读取旧次数，赋值保存新次数。</p><p>items() 让循环同时拿到键和值。</p></details><details class=\"answer\"><summary>09 · 独立练习：计数函数</summary><h2>独立练习：计数函数</h2><pre><code>def count_labels(labels):\n    # 返回名称与次数的字典\n    pass</code></pre><p>测试 [&quot;B&quot;, &quot;A&quot;, &quot;B&quot;, &quot;D&quot;]。</p><p>再测试空列表，以及所有名称相同的列表。</p><p>计算函数使用 return，调用处负责 print。</p></details><details class=\"answer\"><summary>10 · 集合与去重</summary><h2>集合与去重</h2><pre><code>devices = set(labels)\nprint(sorted(devices))\nprint(len(devices))\nprint(&quot;D&quot; in devices)\ndevices.add(&quot;D&quot;)</code></pre><p>集合中同一个元素只保留一次。</p><p>空集合写 set()，空字典写 {}。</p><p>集合没有位置下标，稳定展示时使用 sorted。</p></details><details class=\"answer\"><summary>11 · 独立练习：新出现的设备</summary><h2>独立练习：新出现的设备</h2><pre><code>first = [&quot;A&quot;, &quot;B&quot;, &quot;A&quot;]\nsecond = [&quot;B&quot;, &quot;C&quot;, &quot;D&quot;, &quot;C&quot;]</code></pre><p>找出第二批中第一批没出现过的名称。</p><p>结果去重，并按字母顺序显示。</p><p>先尝试循环与 not in，再尝试集合差集。</p></details><details class=\"answer\"><summary>12 · Counter 统计出现次数</summary><h2>Counter 统计出现次数</h2><pre><code>from collections import Counter\n\ncounts = Counter(labels)\nprint(dict(counts))\nprint(counts[&quot;D&quot;])\nprint(counts.most_common(2))</code></pre><p>collections 属于标准库，无需另外安装。</p><p>Counter 把常用的计数过程封装起来。</p></details><details class=\"answer\"><summary>13 · 模块练习：stats_utils.py</summary><h2>模块练习：stats_utils.py</h2><pre><code># stats_utils.py\ndef count_labels(labels):\n    # 实现计数并返回字典\n    pass\n\ndef unique_labels(labels):\n    # 返回排序后的不同名称列表\n    pass</code></pre><p>两个函数都接收参数，并返回结果。</p><p>保存文件后，在 main.py 中使用它们。</p></details><details class=\"answer\"><summary>14 · 主程序调用模块</summary><h2>主程序调用模块</h2><pre><code># main.py\nimport stats_utils\n\nlabels = [&quot;A&quot;, &quot;B&quot;, &quot;A&quot;, &quot;C&quot;, &quot;B&quot;, &quot;A&quot;]\nprint(stats_utils.count_labels(labels))\nprint(stats_utils.unique_labels(labels))</code></pre><p>把两个 .py 文件放在同一目录。</p><p>import 后使用模块名和函数名调用。</p><p>换一组输入，检验函数能否复用。</p></details><details class=\"answer\"><summary>15 · 列表中的字典记录</summary><h2>列表中的字典记录</h2><pre><code>records = [\n    {&quot;device&quot;: &quot;A&quot;, &quot;value&quot;: 10},\n    {&quot;device&quot;: &quot;B&quot;, &quot;value&quot;: 20},\n    {&quot;device&quot;: &quot;A&quot;, &quot;value&quot;: 12},\n    {&quot;device&quot;: &quot;C&quot;, &quot;value&quot;: 8},\n    {&quot;device&quot;: &quot;B&quot;, &quot;value&quot;: 18},\n]</code></pre><p>records[0] 是第一条记录。</p><p>records[0][&quot;value&quot;] 是这条记录的测量值。</p></details><details class=\"answer\"><summary>16 · 普通字典按设备分组</summary><h2>普通字典按设备分组</h2><pre><code>groups = {}\nfor row in records:\n    name = row[&quot;device&quot;]\n    if name not in groups:\n        groups[name] = []\n    groups[name].append(row[&quot;value&quot;])</code></pre><p>A 对应 [10, 12]，B 对应 [20, 18]，C 对应 [8]。</p><p>这里保存每组的测量值列表，而不是次数。</p></details><details class=\"answer\"><summary>17 · defaultdict 创建默认值</summary><h2>defaultdict 创建默认值</h2><pre><code>from collections import defaultdict\n\ngroups = defaultdict(list)\nfor row in records:\n    groups[row[&quot;device&quot;]].append(row[&quot;value&quot;])\nprint(dict(groups))</code></pre><p>首次访问缺失的键时，调用 list 创建空列表。</p><p>传入 list，不写 list()。</p></details><details class=\"answer\"><summary>18 · 独立练习：每台设备的均值</summary><h2>独立练习：每台设备的均值</h2><pre><code>for name, values in groups.items():\n    # 计算并打印这一组的平均值\n    pass</code></pre><p>预期结果：A 为 11.0，B 为 19.0，C 为 8.0。</p><p>计算前先说出每组的总和与数量。</p><p>完成后尝试写成返回字典的函数。</p></details><details class=\"answer\"><summary>19 · 栈与撤销操作</summary><h2>栈与撤销操作</h2><pre><code>stack = []\nstack.append(&quot;load&quot;)\nstack.append(&quot;filter&quot;)\nstack.append(&quot;plot&quot;)\nprint(stack.pop())\nprint(stack)</code></pre><p>后进先出：最后加入的操作最先撤销。</p><p>append 加到末尾，pop() 从末尾取出并返回。</p></details><details class=\"answer\"><summary>20 · 空栈与边界</summary><h2>空栈与边界</h2><pre><code>if stack:\n    action = stack.pop()\n    print(action)\nelse:\n    print(&quot;nothing to undo&quot;)</code></pre><p>空列表直接 pop() 会报错。</p><p>while stack 可以连续处理，直到栈变空。</p></details><details class=\"answer\"><summary>21 · 队列与任务处理</summary><h2>队列与任务处理</h2><pre><code>from collections import deque\n\nqueue = deque([&quot;A&quot;, &quot;B&quot;, &quot;C&quot;])\nqueue.append(&quot;D&quot;)\nwhile queue:\n    print(queue.popleft())</code></pre><p>先进先出：先进入的任务先处理。</p><p>append 从右加入，popleft 从左取出。</p></details><details class=\"answer\"><summary>22 · 独立练习：栈和队列的顺序</summary><h2>独立练习：栈和队列的顺序</h2><p>依次加入 A、B。</p><p>取出一个元素。</p><p>加入 C，再取出一个元素。</p><p>分别写出栈和队列两次取出的结果。</p><p>先手算，再写代码验证。</p></details><details class=\"answer\"><summary>23 · 容器选择与综合验收</summary><h2>容器选择与综合验收</h2><p>保留全部实验记录及顺序：list。</p><p>只关心出现过哪些名称：set。</p><p>按名称查次数或测量值：dict。</p><p>撤销最后一次操作：用 list 做栈。</p><p>处理最早等待的任务：用 deque 做队列。</p></details><details class=\"answer\"><summary>24 · 课后练习</summary><h2>课后练习</h2><p>重写前缀和函数，测试首项、末项与整个区间。</p><p>完成 stats_utils.py，并从 main.py 调用。</p><p>测试普通输入、空列表与全部重复的名称。</p><p>课堂完成后再拓展：按设备分组并求均值，</p><p>用同一串操作对比栈与队列。</p></details><h2>AtCoder 配套例题</h2><details class=\"answer\"><summary>25 · 集合例题：ABC085 B</summary><h2>集合例题：ABC085 B</h2><p>Kagami Mochi</p><p>选一些年糕叠起来，上层直径必须严格小于下层。</p><p>求最多能叠几层。</p><p>输入：N，随后 N 行各一个直径。</p><p>范围：1 ≤ N ≤ 100，1 ≤ 直径 ≤ 100。</p><p><a href=\"https://atcoder.jp/contests/abc085/tasks/abc085_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details><details class=\"answer\"><summary>26 · 集合例题：推演与实现</summary><h2>集合例题：推演与实现</h2><p>直径：10、8、8、6</p><p>最多 3 层，可以用 10、8、6。</p><p>相同直径为什么只能选一个？</p><p>不同直径是否一定都能用上？</p><p><a href=\"https://atcoder.jp/contests/abc085/tasks/abc085_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details><details class=\"answer\"><summary>27 · 字典例题：ABC091 B</summary><h2>字典例题：ABC091 B</h2><p>Two Colors Card Game</p><p>选择一个字符串。每张同名蓝卡得 1 分，红卡扣 1 分。</p><p>求能获得的最高净分，只比较完全相同的字符串。</p><p>输入：N 与 N 行蓝卡字符串，再读 M 与 M 行红卡字符串。</p><p>N、M 都不超过 100。</p><p><a href=\"https://atcoder.jp/contests/abc091/tasks/abc091_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details><details class=\"answer\"><summary>28 · 字典例题：推演与实现</summary><h2>字典例题：推演与实现</h2><p>自编例子：蓝卡 cat、cat、dog，红卡 cat、dog。</p><p>选 cat 得 1 分，选 dog 得 0 分。</p><p>如果每个已出现的词都是负分，答案是多少？</p><p>提示：也可以选择一个没有出现过的词。</p><p><a href=\"https://atcoder.jp/contests/abc091/tasks/abc091_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details><details class=\"answer\"><summary>29 · 栈例题：ABC396 B</summary><h2>栈例题：ABC396 B</h2><p>Card Pile</p><p>初始有 100 张写着 0 的卡片。</p><p>操作 1 x：把 x 放到最上面。</p><p>操作 2：移除最上面的卡片，并输出它。</p><p>输入 Q，再读 Q 行操作。Q ≤ 100，取出时保证有卡片。</p><p><a href=\"https://atcoder.jp/contests/abc396/tasks/abc396_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details><details class=\"answer\"><summary>30 · 栈例题：推演与实现</summary><h2>栈例题：推演与实现</h2><p>自编操作：1 4，1 7，2，2，2</p><p>先手算三次输出，再写程序核对。</p><p>列表末尾作为栈顶。</p><p>初始状态应是空列表，还是 100 个 0？</p><p><a href=\"https://atcoder.jp/contests/abc396/tasks/abc396_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details><details class=\"answer\"><summary>31 · 队列例题：ABC402 B</summary><h2>队列例题：ABC402 B</h2><p>Restaurant Queue</p><p>餐厅队伍初始为空，每位客人带有一个菜单编号。</p><p>操作 1 x：携带编号 x 的客人加入队尾。</p><p>操作 2：队首客人入店，并输出其编号。</p><p>输入 Q，再读 Q 行操作。Q ≤ 100，取出时保证队伍非空。</p><p><a href=\"https://atcoder.jp/contests/abc402/tasks/abc402_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details><details class=\"answer\"><summary>32 · 队列例题：推演与实现</summary><h2>队列例题：推演与实现</h2><p>自编操作：1 4，1 7，2，1 9，2</p><p>先手算两次输出，再写程序核对。</p><p>使用 deque，加入用 append，取出用 popleft。</p><p>如果所有操作都是加入，应输出什么？</p><p><a href=\"https://atcoder.jp/contests/abc402/tasks/abc402_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p></details>", "homework/5": "<p class=\"intro\">对应课堂：2026-11-13 · Python</p>\n<h2>1. 前缀和复习</h2><p>从空文件实现 build_prefix(nums) 和 range_sum(prefix,L,R)。位置从1开始，区间包含两端。nums=[3,1,4,2,5]，检查[1,1]、[2,4]、[5,5]、[1,5]，结果分别为3、7、5、15。再测试单元素与含负数的列表。</p><p>说明prefix[0]的作用，以及改变nums后为什么需要重新构建prefix。</p>\n<h2>2. 字典计数与集合去重</h2><p>实现 count_labels(labels)，返回每个名称的次数。先手写字典计数，再用Counter核对。实现 unique_labels(labels)，返回排序后的不同名称列表。</p><p>输入[\"B\",\"A\",\"B\",\"D\"]：计数B:2、A:1、D:1，名称列表[\"A\",\"B\",\"D\"]。测试空列表、全部相同的名称和普通输入。</p>\n<h2>3. 函数与模块</h2><p>将上面两个统计函数放入stats_utils.py，在同目录main.py中用import stats_utils导入并调用。函数return结果，由main.py打印。说明函数只print不return时调用者拿到什么。</p>\n<h2>4. 按设备分组（课堂讲到后完成）</h2><p>记录为A:10、B:20、A:12、C:8、B:18，每条记录用包含device和value的字典表示。将记录保存为列表，分组得到A:[10,12]、B:[20,18]、C:[8]。先用普通字典，再用defaultdict(list)实现。计算均值A:11.0、B:19.0、C:8.0。</p>\n<h2>5. 栈与队列（课堂讲到后完成）</h2><p>依次加入A、B，取出一个，再加入C，再取出一个。分别使用list栈与deque队列实现，先手算再运行。补充空容器检查，避免对空容器执行pop或popleft。</p>\n<p>完成后带上代码与一个修复过的错误。<a href=\"#/bronze/9\">返回课堂课件</a></p><h2>AtCoder 配套例题</h2><p>集合题适合热身，栈与队列题配对练习，字典题作为计数后的提高练习。中文题意为本站整理，以原题为准。</p><h2>集合：ABC085 B Kagami Mochi</h2><p>选一些年糕叠起来，上层直径必须严格小于下层。</p><p>求最多能叠几层。</p><p>输入：N，随后 N 行各一个直径。</p><p>范围：1 ≤ N ≤ 100，1 ≤ 直径 ≤ 100。</p><p><a href=\"https://atcoder.jp/contests/abc085/tasks/abc085_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>直径：10、8、8、6</p><p>最多 3 层，可以用 10、8、6。</p><p>相同直径为什么只能选一个？</p><p>不同直径是否一定都能用上？</p><h2>字典：ABC091 B Two Colors Card Game</h2><p>选择一个字符串。每张同名蓝卡得 1 分，红卡扣 1 分。</p><p>求能获得的最高净分，只比较完全相同的字符串。</p><p>输入：N 与 N 行蓝卡字符串，再读 M 与 M 行红卡字符串。</p><p>N、M 都不超过 100。</p><p><a href=\"https://atcoder.jp/contests/abc091/tasks/abc091_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>自编例子：蓝卡 cat、cat、dog，红卡 cat、dog。</p><p>选 cat 得 1 分，选 dog 得 0 分。</p><p>如果每个已出现的词都是负分，答案是多少？</p><p>提示：也可以选择一个没有出现过的词。</p><h2>栈：ABC396 B Card Pile</h2><p>初始有 100 张写着 0 的卡片。</p><p>操作 1 x：把 x 放到最上面。</p><p>操作 2：移除最上面的卡片，并输出它。</p><p>输入 Q，再读 Q 行操作。Q ≤ 100，取出时保证有卡片。</p><p><a href=\"https://atcoder.jp/contests/abc396/tasks/abc396_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>自编操作：1 4，1 7，2，2，2</p><p>先手算三次输出，再写程序核对。</p><p>列表末尾作为栈顶。</p><p>初始状态应是空列表，还是 100 个 0？</p><h2>队列：ABC402 B Restaurant Queue</h2><p>餐厅队伍初始为空，每位客人带有一个菜单编号。</p><p>操作 1 x：携带编号 x 的客人加入队尾。</p><p>操作 2：队首客人入店，并输出其编号。</p><p>输入 Q，再读 Q 行操作。Q ≤ 100，取出时保证队伍非空。</p><p><a href=\"https://atcoder.jp/contests/abc402/tasks/abc402_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>课堂推演</h3><p>自编操作：1 4，1 7，2，1 9，2</p><p>先手算两次输出，再写程序核对。</p><p>使用 deque，加入用 append，取出用 popleft。</p><p>如果所有操作都是加入，应输出什么？</p>", "homework/6": "<p class=\"intro\">对应课堂：2026-11-13至11-14 · Python</p><p>先完成1至3题，再完成4、5题，第6题选做。年糕题已经在课堂完成，本次用字符串去重新题迁移练习。配套题若已做过，关闭旧代码后独立重写。</p><h2>1. 分类前缀和重写（必做）</h2><p>Typical90 010 · Score Sum Queries</p><p>N名学生各有班级（1或2）与分数。每次询问编号[L,R]中两个班各自的分数总和。N、Q最大均为100000。</p><p>练习要求：关闭课堂代码，从空文件重写。两个前缀数组都以0开头，长度均为N+1。每个学生位置都更新两个数组；每次查询输出两个班的总分，不遍历区间。</p><p>自测：自编记录：(1,10)、(2,20)、(1,30)。[1,3]输出40 20；[2,2]输出0 20；[1,1]输出10 0。解释总复杂度为何是O(N+Q)。</p><p><a href=\"https://atcoder.jp/contests/typical90/tasks/typical90_j?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>2. 集合去重（必做，新题）</h2><p>ABC164 C · gacha</p><p>读入N个奖品名称，输出不同名称的种类数。N最大为200000，名称逐行输入。</p><p>练习要求：独立选择容器并实现。区分“记录总数”“种类数”和“每种出现次数”，无需排序或累加名称。</p><p>自测：apple、orange、apple应输出2；全部相同应输出1；只有一个名称应输出1。完整输入前面需要写N。</p><p><a href=\"https://atcoder.jp/contests/abc164/tasks/abc164_c?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>3. 字典计数（必做，新题）</h2><p>ABC231 B · Election</p><p>N张选票各写一个候选人姓名，输出得票最多者的姓名。N不超过100，原题保证最高票唯一。</p><p>练习要求：先用字典和get手写计数，再遍历items找最高票。输出姓名，不是票数。完成后可用Counter核对。</p><p>自测：自编选票：bob、sean、bob，输出bob；只有一张票时输出该姓名。不要另行设计并列最高的规则。</p><p><a href=\"https://atcoder.jp/contests/abc231/tasks/abc231_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>4. 栈的操作（必做，配套题）</h2><p>ABC396 B · Card Pile</p><p>初始有100张写着0的卡片。操作1 x将x放到最上面，操作2取出最上面的卡片并输出。Q不超过100。</p><p>练习要求：列表末尾作为栈顶。先读整行，再按操作类型决定是否读取第二个数。取出操作只有一个整数。</p><p>自测：自编Q=5，依次1 4、1 7、2、2、2，输出7、4、0（分行）。再测第一条就是2，应该输出0。</p><p><a href=\"https://atcoder.jp/contests/abc396/tasks/abc396_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>5. 队列的操作（必做，配套题）</h2><p>ABC402 B · Restaurant Queue</p><p>队伍初始为空。操作1 x在队尾加入编号x，操作2让队首离开并输出编号。题目保证取出时非空，Q不超过100。</p><p>练习要求：使用deque实现。和上一题比较初始状态及取出方向，说明append、pop和popleft各做什么。</p><p>自测：自编Q=5，依次1 4、1 7、2、1 9、2，输出4、7（分行）。全为加入操作时不输出任何内容。</p><p><a href=\"https://atcoder.jp/contests/abc402/tasks/abc402_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>6. 红蓝卡净分（选做，课堂重练）</h2><p>ABC091 B · Two Colors Card Game</p><p>选择一个字符串，同名蓝卡每张加1，同名红卡每张减1，求最高净分。</p><p>练习要求：字典中保存净分，正确处理只在红卡中出现的词。说明为什么答案不能小于0。</p><p>自测：蓝卡cat、cat、dog，红卡cat、dog，答案1；蓝卡cat，红卡cat、cat，答案0。</p><p><a href=\"https://atcoder.jp/contests/abc091/tasks/abc091_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h2>写代码前后都检查</h2><p>读取整数用int(input())；先初始化再使用变量；统一变量名；区分1-based编号与0-based下标。每题保留至少一个自编测试，并说明一次修改原因。完整题意与评测要求以AtCoder原题为准。</p>", "modules/3": "<h2>今天的任务与旧知识</h2><p>读入实验记录，计算平均值，并把结果保存到文件。</p><p>复习：records 是列表，每条记录是字典。</p><p>records[0][&quot;value&quot;] 先取一条记录，再取一个字段。</p><h2>项目目录与文件路径</h2><pre><code>project/\n    main.py\n    data/\n        notes.txt\n        measurements.csv\n    output/</code></pre><p>data 保存原始输入，output 保存生成结果。</p><p>路径拼接使用 Path 和 /。</p><h2>脚本目录与工作目录</h2><pre><code>from pathlib import Path\n\nBASE = Path(__file__).resolve().parent\nDATA = BASE / &quot;data&quot;\nOUT = BASE / &quot;output&quot;\nOUT.mkdir(exist_ok=True)\nprint(BASE)</code></pre><p>脚本用 __file__ 定位自己的目录。</p><p>Notebook 改用 BASE = Path.cwd()，先核对当前目录。</p><h2>with 与文本读取</h2><pre><code>with open(DATA / &quot;notes.txt&quot;, &quot;r&quot;,\n          encoding=&quot;utf-8&quot;) as f:\n    text = f.read()\n\nprint(text)</code></pre><p>r 表示读取，utf-8 指定文本编码。</p><p>离开 with 代码块时，文件会自动关闭。</p><h2>写入与追加</h2><pre><code>path = OUT / &quot;practice.txt&quot;\nwith open(path, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n    f.write(&quot;first run\\n&quot;)\nwith open(path, &quot;a&quot;, encoding=&quot;utf-8&quot;) as f:\n    f.write(&quot;second line\\n&quot;)</code></pre><p>w 创建文件，已有文件则清空后写入。</p><p>a 在末尾追加。write 不会自动补换行。</p><p><a href=\"#/modules/6\">完整课堂课件</a> · <a href=\"#/homework/7\">配套练习</a></p><h2>11月15日课堂巩固</h2><h2>文本文件自查</h2><p>模式必须使用小写r、w、a。w会截断已有内容，a在末尾追加；write不会自动换行。pathlib用于表示和组合路径，脚本可用__file__定位，Notebook需核对工作目录。</p><p><a href=\"#/homework/8\">本课独立练习 →</a></p>", "modules/4": "<h2>CSV：每行一条记录</h2><pre><code>device,value\nA,10\nB,20\nA,12\nC,8\nB,18</code></pre><p>首行为列名，后面每行为一条记录。</p><p>同一列保存同一种信息。</p><h2>DictReader 读取 CSV</h2><pre><code>import csv\n\nwith open(DATA / &quot;measurements.csv&quot;, &quot;r&quot;,\n          encoding=&quot;utf-8&quot;, newline=&quot;&quot;) as f:\n    rows = list(csv.DictReader(f))\nprint(rows[0])\nprint(type(rows[0][&quot;value&quot;]))</code></pre><p>每行得到一个字典，键来自表头。</p><p>默认读到的字段值是字符串。</p><h2>从字符串到数值</h2><pre><code>values = []\nfor row in rows:\n    values.append(float(row[&quot;value&quot;]))\n\ncount = len(values)\nmean = sum(values) / count\nresult = {&quot;count&quot;: count, &quot;mean&quot;: mean}</code></pre><p>先转换类型，再做计算。</p><p>5 条记录，总和 68，平均值 13.6。</p><h2>CSV 写出统计结果</h2><pre><code>with open(OUT / &quot;summary.csv&quot;, &quot;w&quot;,\n          encoding=&quot;utf-8&quot;, newline=&quot;&quot;) as f:\n    writer = csv.writer(f)\n    writer.writerow([&quot;count&quot;, &quot;mean&quot;])\n    writer.writerow([count, mean])</code></pre><p>先写表头，再写一行数据。</p><p>输出存到 output/summary.csv。</p><p><a href=\"#/modules/6\">完整课堂课件</a> · <a href=\"#/homework/7\">配套练习</a></p><h2>11月15日课堂巩固</h2><h2>表头、数据行与类型</h2><p>默认调用csv.DictReader(f)时，首行成为字段名，不包含在后续数据中。rows = list(csv.DictReader(f))后，rows[0]是第一条数据字典。若使用csv.reader且没有手动跳过首行，列表第0项才是表头。CSV数值字段默认是字符串，计算前要转换为int或float。csv.writer.writerow可接收一行字段组成的列表；读写CSV时使用newline=\"\"。</p><p><a href=\"https://docs.python.org/3/library/csv.html\">Python csv官方说明</a></p><p><a href=\"#/homework/8\">本课独立练习 →</a></p>", "modules/5": "<h2>JSON：保存有结构的数据</h2><pre><code>{\n  &quot;count&quot;: 5,\n  &quot;mean&quot;: 13.6,\n  &quot;note&quot;: &quot;实验统计&quot;\n}</code></pre><p>JSON 对象对应 Python dict，数组对应 list。</p><p>JSON 使用双引号，true / false / null</p><p>对应 Python 的 True / False / None。</p><h2>json.dump 保存结果</h2><pre><code>import json\n\nresult[&quot;note&quot;] = &quot;实验统计&quot;\nwith open(OUT / &quot;summary.json&quot;, &quot;w&quot;,\n          encoding=&quot;utf-8&quot;) as f:\n    json.dump(result, f,\n              ensure_ascii=False, indent=2)</code></pre><p>dump 把对象写入文件。</p><p>ensure_ascii=False 保留中文，indent=2 便于阅读。</p><h2>json.load 重新读取</h2><pre><code>with open(OUT / &quot;summary.json&quot;, &quot;r&quot;,\n          encoding=&quot;utf-8&quot;) as f:\n    saved = json.load(f)\n\nprint(saved[&quot;count&quot;])\nprint(saved[&quot;mean&quot;])</code></pre><p>load 从文件恢复 Python 对象。</p><p>读取后仍用字典的键访问结果。</p><p><a href=\"#/modules/6\">完整课堂课件</a> · <a href=\"#/homework/7\">配套练习</a></p><h2>11月15日课堂巩固</h2><h2>JSON与字典的区别</h2><p>字典是Python内存中的对象，JSON是用于保存或交换数据的文本格式。dump(obj,f)将对象写入文件，load(f)将文件内容还原为Python对象。JSON字符串用双引号，true/false/null对应Python的True/False/None。</p><p><a href=\"#/homework/8\">本课独立练习 →</a></p>", "modules/6": "<p class=\"intro\">2026-11-15 · 文件读写、CSV 与 JSON</p><p><a class=\"button\" download=\"sean-file-io-practice.zip\" href=\"data:application/zip;base64,UEsDBBQAAAAIAFZcb123bK19UgEAAKoBAAAHAAAAbWFpbi5weU2Qy07CQBSG9036DhPcwGaIt6ULDK41iutmpEOodNpmLqg7YoKyIGoMiompkQUJC7kkJgYU9WFkSne+gtPSqLs553z//P85JeoS4CFetq0DYBHPpRzsqFLXkqLIqr/vQ+Y6uqZrm7m9LbARc2nDKFk2NowMpJi5dhWnM9BDFDtc1/K5Qk5xMZ4FKRNxlNK17f3Cv6YruCf4og1JxbRoGh9bjBtuZaNABc5EhktgGYJ5q3dk8bK8bqpMMG8V+S5GJqbh8E1e3hKMmKCYKGMGFfBVO410KxDI0VkV2QKH709B46pku4h/T5uzT1/272bj13jGZKMddnqJaBWCcNCZD9qB3wluRkVXOHw2vpCTZ+mfy9pUeTnqi6D1Ietdtbawuey3ZX2c6NfisNG1oCmIt7BaLJplghBET2A0TfD1P1yFM6N97h8CvysnL8HjWA4nMfcDUEsDBBQAAAAIAFZcb11wypTyYAIAAC4DAAAKAAAAUkVBRE1FLnR4dD2STU8aURSG9yb+B5dt0mLtB01MukDTTRe0CYlbMsI00sIMkcHW3WCBAQpIQrUyxcpEVNroDLGNfAwfP8Y5dy4r/kLPnWvd3OR+nOc973tuSBSkJXKoOfYNtWzIN1z7izNoLS5As7MRWlqXo6LTvyLFOozUlJKOipLCX0N7MB+VnfHU/daB3jVpFlOIepzcVbZkiV6czrQSNDq36t7iAp3WqFFOCDHJl9zFk0hqZ/lDSpaWk4KyFY9twrHm9IekpYGWh2GdYfuVWVOl5xkwi/Q051GigiI402O4OoLqCVx85W3gYzmtJNMKv6Km4ZrfXbtOfjaxCjkIIaUSndRBG9KeBZMsmiSFGoeshzb4oSdBmpfcvqtn79rlBsPh97G4GA6DqTvjivvDhPEBKsO+5dhnjl1FHaiVoXfmjJv8FmoWlLj9oKyIm7L8keV4bWBQpGHOVJ1mdaanZ//DEUitHuY+MwYI4RyuvxYIvX71DtPyRT5FHzxk0rkCG0qly9snrT5YA562NYHWHlZjoPORzqa6f/iCHBvU7N61PfiDkYM6Wnnm87O0vejehN4GYXAz0yrksMuqcmf3vFoVSdCuQOEGE8NhJUQhld4WE/gdUmHxs7It+HCqzMF0DKVW4NHKc9zwOfhR+1bN3Ku6w3Mm7Pe/9PgztQgZHfmkXIyKO7GI6NonOEdyaZCD7n17KBqR0yjnY1+HueC/4KBLKmZg9SkqrHnr+uqKx3V/DbHX+agA+78xdGp0oP13PiqikgdC4BPEoBOJmhPcBWVJZNx8A617adSq5GjitodSOh73mP8AUEsDBBQAAAAIAFZcb1259lmjJgAAACsAAAAVAAAAZGF0YS9tZWFzdXJlbWVudHMuY3N2S0kty0xO1SlLzClN5eVy1DE04OVy0jEyALONeLmcdSxAAoZAEgBQSwMEFAAAAAgAVlxvXfvC7IklAAAAIAAAAA4AAABkYXRhL25vdGVzLnR4dAEgAN//56ys5LiA5om55a6e6aqMDQrlhb ary>07 · CSV：每行一条记录</summary><h2>CSV：每行一条记录</h2><pre><code>device,value\nA,10\nB,20\nA,12\nC,8\nB,18</code></pre><p>首行为列名，后面每行为一条记录。</p><p>同一列保存同一种信息。</p></details><details class=\"answer\"><summary>08 · DictReader 读取 CSV</summary><h2>DictReader 读取 CSV</h2><pre><code>import csv\n\nwith open(DATA / &quot;measurements.csv&quot;, &quot;r&quot;,\n          encoding=&quot;utf-8&quot;, newline=&quot;&quot;) as f:\n    rows = list(csv.DictReader(f))\nprint(rows[0])\nprint(type(rows[0][&quot;value&quot;]))</code></pre><p>每行得到一个字典，键来自表头。</p><p>默认读到的字段值是字符串。</p></details><details class=\"answer\"><summary>09 · 从字符串到数值</summary><h2>从字符串到数值</h2><pre><code>values = []\nfor row in rows:\n    values.append(float(row[&quot;value&quot;]))\n\ncount = len(values)\nmean = sum(values) / count\nresult = {&quot;count&quot;: count, &quot;mean&quot;: mean}</code></pre><p>先转换类型，再做计算。</p><p>5 条记录，总和 68，平均值 13.6。</p></details><details class=\"answer\"><summary>10 · CSV 写出统计结果</summary><h2>CSV 写出统计结果</h2><pre><code>with open(OUT / &quot;summary.csv&quot;, &quot;w&quot;,\n          encoding=&quot;utf-8&quot;, newline=&quot;&quot;) as f:\n    writer = csv.writer(f)\n    writer.writerow([&quot;count&quot;, &quot;mean&quot;])\n    writer.writerow([count, mean])</code></pre><p>先写表头，再写一行数据。</p><p>输出存到 output/summary.csv。</p></details><details class=\"answer\"><summary>11 · JSON：保存有结构的数据</summary><h2>JSON：保存有结构的数据</h2><pre><code>{\n  &quot;count&quot;: 5,\n  &quot;mean&quot;: 13.6,\n  &quot;note&quot;: &quot;实验统计&quot;\n}</code></pre><p>JSON 对象对应 Python dict，数组对应 list。</p><p>JSON 使用双引号，true / false / null</p><p>对应 Python 的 True / False / None。</p></details><details class=\"answer\"><summary>12 · json.dump 保存结果</summary><h2>json.dump 保存结果</h2><pre><code>import json\n\nresult[&quot;note&quot;] = &quot;实验统计&quot;\nwith open(OUT / &quot;summary.json&quot;, &quot;w&quot;,\n          encoding=&quot;utf-8&quot;) as f:\n    json.dump(result, f,\n              ensure_ascii=False, indent=2)</code></pre><p>dump 把对象写入文件。</p><p>ensure_ascii=False 保留中文，indent=2 便于阅读。</p></details><details class=\"answer\"><summary>13 · json.load 重新读取</summary><h2>json.load 重新读取</h2><pre><code>with open(OUT / &quot;summary.json&quot;, &quot;r&quot;,\n          encoding=&quot;utf-8&quot;) as f:\n    saved = json.load(f)\n\nprint(saved[&quot;count&quot;])\nprint(saved[&quot;mean&quot;])</code></pre><p>load 从文件恢复 Python 对象。</p><p>读取后仍用字典的键访问结果。</p></details><details class=\"answer\"><summary>14 · 独立任务：完整跑通</summary><h2>独立任务：完整跑通</h2><p>在 main.py 补全 CSV 读取与数值转换。</p><p>计算 count、mean，并保存 summary.json。</p><p>重新打开 JSON，核对结果是 5 和 13.6。</p><p>完成后，指出输入文件和输出文件分别在哪里。</p></details><details class=\"answer\"><summary>15 · 常见错误与自查</summary><h2>常见错误与自查</h2><p>找不到文件：先打印 BASE，再核对名称和目录。</p><p>数字不能计算：打印 type，检查是否做了 float 转换。</p><p>JSON 解析失败：检查文件是否为空或格式被手改。</p><p>结果仍是旧值：保存脚本，重新运行计算与写出。</p></details><details class=\"answer\"><summary>16 · 课后练习与验收</summary><h2>课后练习与验收</h2><p>复制 CSV 为 measurements_extra.csv，追加 A,14。</p><p>重新读取：6 条记录，平均值约 13.6667。</p><p>另存 summary_extra.json，再读回核对。</p><p>选做：按 device 计数，保存 counts.json。</p><p>原始数据的次数为 A:2、B:2、C:1。</p></details><p>参考：<a href=\"https://docs.python.org/3/library/csv.html\">Python csv</a>、<a href=\"https://docs.python.org/3/library/json.html\">json</a>、<a href=\"https://docs.python.org/3/library/pathlib.html\">pathlib</a> 官方文档。</p><h2>实际课堂进度</h2><p>本课先复习投票统计与栈队列操作，再讲解文本、CSV和JSON读写。课堂练习推进到CSV提取数值与计算count/mean；JSON保存与重新读取作为课后独立完成内容。</p><p><a href=\"#/homework/8\">课后巩固作业 →</a></p>", "homework/7": "<p><a class=\"button\" download=\"sean-file-io-practice.zip\" href=\"data:application/zip;base64,UEsDBBQAAAAIAFZcb123bK19UgEAAKoBAAAHAAAAbWFpbi5weU2Qy07CQBSG9036DhPcwGaIt6ULDK41iutmpEOodNpmLqg7YoKyIGoMiompkQUJC7kkJgYU9WFkSne+gtPSqLs553z//P85JeoS4CFetq0DYBHPpRzsqFLXkqLIqr/vQ+Y6uqZrm7m9LbARc2nDKFk2NowMpJi5dhWnM9BDFDtc1/K5Qk5xMZ4FKRNxlNK17f3Cv6YruCf4og1JxbRoGh9bjBtuZaNABc5EhktgGYJ5q3dk8bK8bqpMMG8V+S5GJqbh8E1e3hKMmKCYKGMGFfBVO410KxDI0VkV2QKH709B46pku4h/T5uzT1/272bj13jGZKMddnqJaBWCcNCZD9qB3
