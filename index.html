);font-weight:600}main{max-width:870px;min-width:0;min-height:65vh}main:focus{outline:none}.breadcrumb{font-size:14px;color:var(--muted);margin:0 0 18px}h1{font-size:32px;line-height:1.4;font-weight:500;margin:0 0 34px;letter-spacing:-.025em}h2{font-size:21px;font-weight:550;line-height:1.5;margin:0 0 15px}.index{display:grid;grid-template-columns:1fr 1fr;column-gap:55px;row-gap:35px}.index section{border-top:1px solid var(--line);padding-top:20px}.index h2 a{color:var(--ink)}ul{padding-left:21px;margin:0}li{padding:3px 0}li::marker{color:#9da3b2}.category-list{border-top:1px solid var(--line);padding-top:22px}.pending{color:var(--muted);margin-top:0}footer{max-width:1320px;margin:0 auto;padding:18px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}details.mobile-nav{display:none}@media(max-width:900px){.layout{grid-template-columns:180px minmax(0,1fr);gap:30px;padding:30px 25px}.header-inner,.tabs{padding-left:25px;padding-right:25px}.tabs{gap:24px}.index{column-gap:28px}h1{font-size:28px}}@media(max-width:680px){.header-inner{padding:15px 20px}.brand{font-size:17px}.logo{margin-right:9px}.tabs{padding:0 20px;gap:24px}.layout{display:block;padding:26px 20px 50px}.layout>aside{display:none}.index{grid-template-columns:1fr;gap:28px}h1{font-size:27px;margin-bottom:28px}h2{font-size:21px}details.mobile-nav{display:block;border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:12px}details.mobile-nav summary{color:var(--muted);font-size:14px;cursor:pointer}details.mobile-nav nav{padding:12px 0 4px}details.mobile-nav a{display:block;padding:5px 0;font-size:14px}footer{padding:16px 20px}}@media print{header,aside,.mobile-nav,footer{display:none!important}.layout{display:block;padding:0}.index{display:block}.index section{break-inside:avoid;margin-bottom:25px}}
.lesson h2{margin:36px 0 14px}.lesson p{margin:12px 0}.lesson pre{background:#f5f6f9;border:1px solid var(--line);padding:18px 20px;overflow-x:auto;line-height:1.65;font-size:14px;tab-size:4}.lesson code{font-family:Consolas,"SFMono-Regular",monospace}.lesson :not(pre)>code{background:#f1f3f8;padding:2px 5px;border-radius:3px;overflow-wrap:anywhere}.table-scroll{overflow-x:auto;margin:20px 0}.lesson table{border-collapse:collapse;width:100%;font-size:15px}.lesson th,.lesson td{border-bottom:1px solid var(--line);padding:10px 14px;text-align:left;white-space:nowrap}.lesson th{background:#f5f6f9;font-weight:600}.lesson .answer{margin:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}.answer summary{cursor:pointer;color:var(--blue)}.lesson .note{font-size:14px;color:var(--muted)}.lesson-nav{display:flex;gap:8px 18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);font-size:14px}.lesson-nav span{color:var(--muted)}.problem-link{overflow-wrap:anywhere}@media(max-width:680px){.lesson pre{padding:14px;font-size:13px}.lesson th,.lesson td{padding:8px 10px}}
.lesson-section{border-top:1px solid var(--line);margin-top:46px;padding-top:12px;scroll-margin-top:150px}.chapter-jump{padding-bottom:10px;font-size:14px}@media(max-width:680px){.lesson-section{scroll-margin-top:140px}}
.intro{color:var(--muted);margin:-15px 0 26px}.callout{background:#f4f5fc;border-left:3px solid var(--blue);padding:18px 22px;margin:24px 0 32px}.callout p{margin:5px 0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.button{display:inline-block;border:1px solid var(--blue);padding:7px 15px;border-radius:4px;background:white;color:var(--blue);font:inherit;cursor:pointer}.button.primary{background:var(--blue);color:white}.meta{font-size:14px;color:var(--muted)}.problem-row{border-top:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:42px 1fr auto;gap:14px}.number{color:var(--blue);font-size:22px}.problem-row h2{font-size:19px;margin:0 0 4px}.problem-row p{margin:3px 0}.badge{font-size:12px;border:1px solid #d9ddea;border-radius:20px;padding:2px 9px;white-space:nowrap;align-self:start}.sample{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sample pre{margin-top:6px}label{display:block;font-size:14px;margin:12px 0 4px}select,textarea{font:inherit;padding:9px;border:1px solid #c9cdd8;border-radius:4px;max-width:100%;background:white}textarea{width:100%;resize:vertical}.record{margin:30px 0;padding:20px;background:#f7f8fb}.record h2{margin-top:0}.progress{height:4px;background:#e8eaf6;margin:15px 0}.progress span{display:block;height:100%;background:var(--blue)}.lesson table th,.lesson table td{white-space:normal}.lesson table{min-width:480px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px}@media(max-width:680px){.sample{grid-template-columns:1fr}.problem-row{grid-template-columns:28px 1fr}.problem-row .badge{grid-column:2}.callout{padding:15px}.actions .button{font-size:14px}} </style></head><body><a class="skip" href="#content">跳转到正文</a><header><div class="header-inner"><a class="brand" href="#/"><span class="logo" aria-hidden="true">S</span>Sean 的算法竞赛笔记</a></div><nav class="tabs" aria-label="知识分类" id="tabs"></nav></header><div class="layout"><aside><p class="side-title">算法竞赛笔记</p><nav id="sidebar" aria-label="知识点目录"></nav></aside><main id="content" tabindex="-1"></main></div><footer>Sean 的算法竞赛笔记</footer>
<script>
const problems = [{"id":"abc340_b","contest":"abc340","name":"Append","zh":"追加与查询","time":10,"skill":"数组 / vector、下标","summary":"从一个空数列开始，按顺序处理 Q 条操作。1 x 表示在末尾加入 x；2 k 表示输出当前数列倒数第 k 个元素。查询不会删除元素，且保证查询合法。","range":"1 ≤ Q ≤ 100；1 ≤ x ≤ 10⁹；1 ≤ k ≤ 当前数列长度。","format":"第一行 Q，随后 Q 行，每行两个整数。对每条 2 k 操作输出一行答案。","input":"5\n1 20\n1 30\n2 1\n1 40\n2 3","output":"30\n20","hint":"长度为 n 时，最后一个元素的下标是 n−1；倒数第 k 个元素对应什么下标？"},{"id":"abc081_b","contest":"abc081","name":"Shift only","zh":"同时除以 2","time":15,"skill":"循环、数组、模拟","summary":"给定 N 个正整数。只有当所有数都是偶数时，才能把所有数同时除以 2。求最多能执行多少轮操作。","range":"1 ≤ N ≤ 200；1 ≤ Aᵢ ≤ 10⁹。","format":"第一行 N，第二行 N 个整数。输出最多可执行的轮数。","input":"3\n8 12 40","output":"2","hint":"每轮先检查是否全部为偶数，再决定是否统一修改。出现一个奇数就必须停止。"},{"id":"abc088_b","contest":"abc088","name":"Card Game for Two","zh":"两人取牌","time":15,"skill":"排序、交替累加","summary":"N 张牌上分别写有一个正整数。Alice 先取，之后两人轮流任取一张，直到牌被取完。两人都采取使自己得分最大的最优策略，求 Alice 的总分减去 Bob 的总分。","range":"1 ≤ N ≤ 100；1 ≤ aᵢ ≤ 100。","format":"第一行 N，第二行 N 个牌面数字。输出两人得分之差。","input":"3\n2 7 4","output":"5","hint":"两人每次会优先拿走怎样的牌？把牌排好后，哪些位置属于 Alice？"},{"id":"abc083_b","contest":"abc083","name":"Some Sums","zh":"数位和筛选","time":20,"skill":"枚举、数位、函数","summary":"检查 1 到 N 的所有整数。如果某个整数的十进制数位和位于 A 到 B 之间（包含两端），就把这个整数计入答案。输出这些整数的总和。","range":"1 ≤ N ≤ 10⁴；1 ≤ A ≤ B ≤ 36。","format":"一行三个整数 N A B。输出符合条件的整数之和。","input":"20 2 5","output":"84","hint":"枚举候选整数，再用临时变量拆分数位。注意要累加原整数，而不是它的数位和。"},{"id":"abc128_b","contest":"abc128","name":"Guidebook","zh":"餐厅指南","time":25,"skill":"记录组织、class / struct、多条件排序","summary":"有 N 家餐厅，输入顺序就是它们的编号（从 1 开始）。每家餐厅有城市名和评分，所有评分互不相同。先按城市名字典序升序排列；同一城市内按评分降序排列。按排序结果逐行输出餐厅原编号。","range":"1 ≤ N ≤ 100；城市名为 1～10 个小写英文字母；0 ≤ 评分 ≤ 100，评分两两不同。","format":"第一行 N，随后 N 行城市名和评分。输出 N 行原编号。","input":"6\nkhabarovsk 20\nmoscow 10\nkazan 50\nkazan 35\nmoscow 60\nkhabarovsk 40","output":"3\n4\n6\n1\n5\n2","hint":"一条记录需要保存城市、分数和原编号。比较两条记录时，先判断城市是否相同。"}];
const groups = [
 ['assessment','入门摸底',problems.map(p=>p.zh)],
 ['cpp','C++ 基础',['输入输出与数据类型','条件判断与循环','数组、vector 与字符串','函数与引用','struct 与 class','排序与比较器','调试与复杂度']],
 ['bronze','基础算法',['模拟与状态更新','枚举与分类讨论','排序与简单贪心','计数、集合与映射','网格与坐标','限时综合训练']],
 ['next','后续进阶',['前缀和与差分','二分查找与答案','双指针与滑动窗口','递归、DFS 与 BFS']]
];
const plans={
 cpp:['正确读入多组数值；区分 int、long long、double 与 string；输出严格匹配题目。','熟练使用 if、for、while；理解初始化、循环条件、更新与 break。','掌握从 0 开始的下标、长度与边界；数组保存数据，vector 动态追加，string 逐字符处理。','把重复计算拆成函数；理解返回值、按值传参和引用修改原变量。','用记录绑定多个属性；理解成员访问、对象与类型，以及 class 和 struct 的默认访问权限。','调用 sort；分清升序、降序和多条件优先级；比较器使用严格比较并保持一致。','根据数据范围估计循环次数；用最小数据、重复数据和边界数据定位错误。'],
 bronze:['明确哪些变量表示当前状态，按顺序执行操作；先判断是否合法，再更新状态。','先确定枚举对象和范围，再证明没有遗漏；根据数据范围选择一层或多层循环。','发现排序后相邻关系或最优选择；能解释策略，并主动寻找反例。','从计数数组开始，按需要引入 set、map；比较不同表示方式的适用范围。','二维数组的行列、边界、方向与邻格；逐步连接到网格搜索。','独立读题、估算复杂度、实现、自测、提交与复盘；根据错题安排下一阶段。'],
 next:['在基础数组操作稳定后，学习区间求和与批量区间修改。','先理解有序查找，再识别答案与可行性之间的单调关系。','在能解释区间状态后，学习维护两个移动边界，减少重复计算。','在模拟和二维遍历稳定后，学习递归状态、搜索顺序、访问标记与连通性。']
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=s=>'<pre><code>'+esc(s)+'</code></pre>';
const external=(url,label)=>`<a class="button" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
const url=p=>`https://atcoder.jp/contests/${p.contest}/tasks/${p.id}?lang=en`;
function rows(){return problems.map((p,i)=>`<section class="problem-row"><span class="number">${String(i+1).padStart(2,'0')}</span><div><h2><a href="#/assessment/${i+1}">${p.name} · ${p.zh}</a></h2><p class="meta">${p.id.toUpperCase()} · 建议 ${p.time} 分钟${i===4?' · 挑战题':''}</p><p class="meta">${p.skill}</p></div></section>`).join('');}
function overview(){return `<p class="intro">C++ · AtCoder · 约 85 分钟 + 10 分钟交流</p><div class="callout"><p><strong>本次安排</strong>：依次完成前四题，再尝试第五题。卡住可以先跳过。</p><p>先独立读题、写代码和自测，再到 AtCoder 原题页面提交。</p></div>${rows()}`;}
function problemPage(p,i){return `<article class="lesson"><p class="intro">第 ${i+1} / 5 题 · ${p.id.toUpperCase()} · ${p.name} · 建议 ${p.time} 分钟</p><p class="meta">训练内容：${p.skill}${i===4?'。本题为挑战，不必因未完成而停留过久。':''}</p><div class="actions">${external(url(p),'AtCoder 原题')}</div><h2>中文题意</h2><p>${p.summary}</p><h2>输入与输出</h2><p>${p.format}</p><p class="meta">数据范围：${p.range}</p><div class="sample"><div><strong>样例输入</strong>${code(p.input)}</div><div><strong>样例输出</strong>${code(p.output)}</div></div><p class="note">中文题意为本站整理，完整题面与评测规则以 <a href="${url(p)}" target="_blank" rel="noopener noreferrer">AtCoder 官方题目</a> 为准。</p><details class="answer"><summary>提示（独立尝试后再展开）</summary><p>${p.hint}</p></details><nav class="actions" aria-label="题目导航">${i>0?`<a class="button" href="#/assessment/${i}">← 上一题</a>`:''}<a class="button" href="#/assessment">返回题单</a>${i<4?`<a class="button" href="#/assessment/${i+2}">下一题 →</a>`:''}</nav></article>`;}
const main=document.getElementById('content');
function render(){
 const parts=location.hash.slice(1).split('/').filter(Boolean),section=parts[0]||'',idx=Number(parts[1])-1;
 const group=groups.find(g=>g[0]===section),valid=group&&Number.isInteger(idx)&&idx>=0&&idx<group[2].length;
 let pageTitle=valid?group[2][idx]:group?group[1]:'学习大纲';
 const nav=`<a href="#/" ${!section?'aria-current="page"':''}>首页</a>`+groups.map(g=>`<a href="#/${g[0]}" ${section===g[0]?'aria-current="page"':''}>${g[1]}</a>`).join('');
 document.getElementById('tabs').innerHTML=nav;
 const sidebar=`<a href="#/">学习大纲</a>`+groups.map(g=>`<details ${section===g[0]?'open':''}><summary>${g[1]}</summary><nav>${g[2].map((n,i)=>`<a href="#/${g[0]}/${i+1}" ${section===g[0]&&idx===i?'aria-current="page"':''}>${n}</a>`).join('')}</nav></details>`).join('');
 document.getElementById('sidebar').innerHTML=sidebar;
 let body='';
 if(section==='assessment')body=valid?problemPage(problems[idx],idx):overview();
 else if(group){body=valid?`<article class="lesson"><p>${plans[section][idx]}</p><h2>学习目标</h2><p>能用自己的话解释概念，并独立写出对应程序。具体课程根据入门摸底结果逐步展开。</p><div class="callout"><p>本页目前是大纲条目；练习题目先集中在入门摸底。</p></div><a class="button" href="#/assessment">进入摸底题单 →</a></article>`:`<p class="intro">${section==='next'?'基础稳定后再逐步展开，不作为本次摸底要求。':'先通过摸底确定需要补充的知识，再按实际进度学习。'}</p><div class="index">${group[2].map((n,i)=>`<section><h2><a href="#/${section}/${i+1}">${n}</a></h2><p>${plans[section][i]}</p></section>`).join('')}</div>`;}
 else if(section){pageTitle='页面未找到';body='<p>这个目录地址不存在。</p><a href="#/">返回首页</a>';}
 else body=`<p class="intro">Sean 的 C++ / USACO 学习笔记</p><div class="callout"><p><strong>从这里开始：入门摸底</strong></p><p>5 道可在 AtCoder 提交的题目，从数组操作到记录排序。先独立完成，再交流解题思路。</p><div class="actions"><a class="button primary" href="#/assessment">进入摸底题单 →</a></div></div><div class="index">${groups.slice(1).map(g=>`<section><h2><a href="#/${g[0]}">${g[1]}</a></h2><ul>${g[2].map((n,i)=>`<li><a href="#/${g[0]}/${i+1}">${n}</a></li>`).join('')}</ul></section>`).join('')}<section><h2>练习</h2><ul><li><a href="#/assessment">入门摸底 · 5 道 AtCoder 题</a></li></ul><p class="meta">课程目录随学习进度补充；当前先完成摸底。</p></section></div>`;
 main.innerHTML=`<details class="mobile-nav"><summary>浏览学习目录</summary><nav>${nav}</nav></details>${section?'<p class="breadcrumb"><a href="#/">首页</a> / '+(valid?`<a href="#/${section}">${group[1]}</a>`:pageTitle)+'</p>':''}<h1>${pageTitle}</h1>${body}`;
 document.title=pageTitle+' · Sean 的算法竞赛笔记';
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){main.focus();return;}render();main.focus({preventScroll:true});});render();

</script><noscript>请启用 JavaScript 查看课程目录。题目来源：AtCoder。</noscript></body></html>
