调试练习包</a></p><details open><summary>02 · 复习：递归结果为什么不对？</summary><h2>复习：递归结果为什么不对？</h2><pre><code>def total(n):\n    if n == 0:\n        return 0\n    n + total(n - 1)\n\nprint(total(1))</code></pre><p>输入1，预测输出。</p><p>输入2，找到报错发生在哪一层。</p></details><details><summary>03 · 复习：没有报错也可能不对</summary><h2>复习：没有报错也可能不对</h2><pre><code>def numbers():\n    yield 10\n    yield 20\n\ng = numbers()\nprint(sum(g))\nprint(list(g))</code></pre><p>第一次sum已经取完生成器。</p><p>怎样才能再次得到同样的数据？</p></details><details><summary>04 · 三类问题，三种检查方向</summary><h2>三类问题，三种检查方向</h2><p>语法错误：冒号、缩进、括号不符合语法。</p><p>运行时异常：执行到某一步无法继续。</p><p>逻辑错误：程序能结束，但结果不符合题意。</p><p>每次先写清楚“预期结果”和“实际结果”。</p></details><details><summary>05 · Traceback：先看最后一行</summary><h2>Traceback：先看最后一行</h2><pre><code>Traceback (most recent call last):\n  File &quot;demo.py&quot;, line 5, in &lt;module&gt;\n    print(mean([]))\n  File &quot;demo.py&quot;, line 2, in mean\n    return sum(values) / len(values)\nZeroDivisionError: division by zero</code></pre><p>先读异常类型和原因。</p><p>再找自己的文件、行号与调用路径。</p></details><details><summary>06 · 熟悉的错误名称</summary><h2>熟悉的错误名称</h2><p>NameError：名字未定义，先查拼写和初始化。</p><p>TypeError：类型不能这样运算，例如&quot;3&quot; + 1。</p><p>ValueError：值无法转换，例如int(&quot;abc&quot;)。</p><p>KeyError：字典里没有这个键。</p><p>IndexError：列表下标超出范围。</p></details><details><summary>07 · print调试：看值，也看类型</summary><h2>print调试：看值，也看类型</h2><pre><code>row = {&quot;value&quot;: &quot;12.5&quot;}\nvalue = row[&quot;value&quot;]\nprint(repr(value), type(value))\nvalue = float(value)\nprint(value + 1)</code></pre><p>repr可显示字符串的引号和隐藏空白。</p><p>每次只验证一个猜想，再用同一输入重跑。</p></details><details><summary>08 · VS Code：断点与单步</summary><h2>VS Code：断点与单步</h2><p>在行号左侧设置断点。</p><p>运行和调试，选择当前Python文件。</p><p>Step Over：执行当前行，不进入函数内部。</p><p>Step Into：进入函数，查看参数与局部变量。</p><p>Call Stack：切换不同调用层，观察各层n。</p></details><details><summary>09 · 断点练习：少加了哪个数？</summary><h2>断点练习：少加了哪个数？</h2><pre><code>n = 3\nresult = 0\nfor i in range(1, n):\n    result += i\nprint(result)</code></pre><p>先算出n=3时的正确结果。</p><p>观察每轮i和result，定位遗漏。</p></details><details><summary>10 · 异常处理：给预期失败安排分支</summary><h2>异常处理：给预期失败安排分支</h2><pre><code>text = input(&quot;整数：&quot;)\ntry:\n    n = int(text)\nexcept ValueError:\n    print(&quot;请输入整数&quot;)\nelse:\n    print(n * 2)</code></pre><p>正常转换时进入else。</p><p>转换失败时只执行匹配的except。</p></details><details><summary>11 · 需要重试时，明确写循环</summary><h2>需要重试时，明确写循环</h2><pre><code>while True:\n    text = input(&quot;整数：&quot;)\n    try:\n        n = int(text)\n    except ValueError:\n        print(&quot;请重试&quot;)\n    else:\n        break</code></pre><p>输入错误后提示并再次读取。</p><p>输入正确后break离开循环。</p></details><details><summary>12 · 哪些情况应修代码？</summary><h2>哪些情况应修代码？</h2><p>拼错变量名、漏写return、下标错误：修复代码。</p><p>用户输入无法转换、文件缺失：可安排处理分支。</p><p>except: pass会让错误悄悄消失。</p><p>捕获明确的异常，并给出有用的信息。</p></details><details><summary>13 · JSON读取：文件不存在怎么办？</summary><h2>JSON读取：文件不存在怎么办？</h2><pre><code>from pathlib import Path\nimport json\nBASE = Path(__file__).resolve().parent\ntry:\n    with open(BASE / &quot;data/valid.json&quot;, encoding=&quot;utf-8&quot;) as f:\n        data = json.load(f)\nexcept FileNotFoundError:\n    print(&quot;找不到文件，请检查路径&quot;)</code></pre><p>打开失败会进入FileNotFoundError分支。</p><p>路径相对于脚本目录，避免依赖启动位置。</p></details><details><summary>14 · JSON格式错误是另一种失败</summary><h2>JSON格式错误是另一种失败</h2><pre><code>try:\n    with open(path, encoding=&quot;utf-8&quot;) as f:\n        data = json.load(f)\nexcept FileNotFoundError:\n    print(&quot;文件不存在&quot;)\nexcept json.JSONDecodeError:\n    print(&quot;JSON格式错误&quot;)\nelse:\n    print(data)</code></pre><p>根据失败原因给出不同提示。</p><p>没有异常才打印读取成功的结果。</p></details><details><summary>15 · 解析成功后，还要检查数据</summary><h2>解析成功后，还要检查数据</h2><pre><code>if not isinstance(data, dict):\n    print(&quot;需要一个JSON对象&quot;)\nelif &quot;count&quot; not in data or &quot;mean&quot; not in data:\n    print(&quot;缺少count或mean字段&quot;)\nelse:\n    print(data[&quot;count&quot;], data[&quot;mean&quot;])</code></pre><p>JSON合法，不代表字段一定符合要求。</p><p>先确认是字典，再检查需要的键。</p></details><details><summary>16 · with、finally与raise（选讲）</summary><h2>with、finally与raise（选讲）</h2><pre><code>def mean(values):\n    if not values:\n        raise ValueError(&quot;没有数据，无法计算平均值&quot;)\n    return sum(values) / len(values)</code></pre><p>with管理文件，离开代码块时关闭文件。</p><p>finally通常用于无论成功或异常都要执行的收尾。</p><p>raise可以主动报告不满足约定的输入。</p></details><details><summary>17 · 独立调试：递归怪物题</summary><h2>独立调试：递归怪物题</h2><pre><code>def attacks(h):\n    if h == 1:\n        return 1\n    return 2 * attacks(h / 2)\n\nprint(attacks(4))</code></pre><p>ABC153 D：血量1需一次攻击。</p><p>更大的怪物分成两只血量h//2的小怪物。</p><p>下面程序有两处错误，先构造小测试。</p></details><details><summary>18 · 综合练习：可靠地读取统计文件</summary><h2>综合练习：可靠地读取统计文件</h2><p>补全json_reader.py，使用具体except。</p><p>valid.json：输出5与13.6。</p><p>missing.json：提示文件不存在。</p><p>broken.json：提示JSON格式错误。</p><p>wrong_shape.json和missing_key.json：提示结构问题。</p></details><details><summary>19 · 课后验收：能解释自己的修改</summary><h2>课后验收：能解释自己的修改</h2><p>独立修复循环边界和递归怪物程序。</p><p>JSON练习至少跑通正常、缺失、格式错误三种情况。</p><p>记录触发输入、异常名称、原因和修改。</p><p>生成器耗尽产生空结果时，解释为什么没有报错。</p></details>", "homework/10": "<p><a class=\"button\" download=\"sean-debug-practice.zip\" href=\"data:application/zip;base64,UEsDBBQAAAAIAHCsdV3nR4RaFQEAAEIBAAAOAAAAanNvbl9yZWFkZXIucHlLK8rPVShILMnIyUxSyMwtyC8qUQgAcnm5oJys4vw8Xi5eLifHYFcFW7CcRnx8WmZOany8pl5RanF+TlmqhqZeQWJRal4JL1deYm4qUF1mXkFpiYbSs2ntT3Zvezqh9/2eWUqavFwgm4CyYMP0FZRSEksSlYAMkCaQJcoKIf4u/lYKT/bufz5lRXlmScaL9buf9k/zCvb3e9zQhFDwtKPtacfqp0tank9ocwO6xS+/xC2/NC/Ftagov+jJjj6Qq/VAulxSk/NTUsHCKAZAzH3WMeFp1/ynE/qeLW54Nn/p0/U7X2xc+Hzj7qfzup9O6kkGmljyuKExNzUx7+na6c/WbX2/p+dZ5+SnvRue7578bN4csIkAUEsDBBQAAAAIAHCsdV3JA9qCQAAAAEoAAAALAAAAbG9vcF9idWcucHnLU7BVMOblKkotLs0pAbINeLnS8osUMhUy8xSKEvPSUzUMdRTyNK14uRSAAKpM21Yhk5eroCgzr0QDIqTJywUAUEsDBBQAAAAIAHCsdV3vP3P+RwAAAGcAAAAOAAAAbW9uc3Rlcl9idWcucHlLSU1TSCwpSUzOLtbI0LTi5VIAgsw0hQwFW1sFQygfBIpSS0qL8hQMISJQnpGCFkK3gr6CkSYvFy9XQVFmXokGTNxEEygIAFBLAwQUAAAACABwrHVdBBlhNigCAADlAgAACgAAAFJFQURNRS50eHRNUktz0lAU3jvjf8hSF2SaUOrKhdZ/0Bm3DJQMpaUJkwQddigEAvKyQMurvAq1M2pAZ1QIlPwYc27Cir/gCcHq4t7Jved8j3u+H function rows(){return problems.map((p,i)=>`<section class="problem-row"><span class="number">${String(i+1).padStart(2,'0')}</span><div><h2><a href="#/assessment/${i+1}">${p.name} · ${p.zh}</a></h2><p class="meta">${p.id.toUpperCase()}${i===4?' · 挑战题':''}</p><p class="meta">${p.skill}</p></div></section>`).join('');}
function overview(){return `<p class="intro">Python · AtCoder</p><div class="callout"><p><strong>课堂回顾</strong>：本页保留第一课讲解的五道题。新作业见“课后练习”。</p><p>先独立读题、写代码和自测，再到 AtCoder 原题页面提交。</p></div>${rows()}`;}
function problemPage(p,i){return `<article class="lesson"><p class="intro">第 ${i+1} / 5 题 · ${p.id.toUpperCase()} · ${p.name}</p><p class="meta">训练内容：${p.skill}${i===4?'。本题为挑战题。':''}</p><div class="actions">${external(url(p),'AtCoder 原题')}</div><h2>中文题意</h2><p>${p.summary}</p><h2>输入与输出</h2><p>${p.format}</p><p class="meta">数据范围：${p.range}</p><div class="sample"><div><strong>样例输入</strong>${code(p.input)}</div><div><strong>样例输出</strong>${code(p.output)}</div></div><p class="note">中文题意为本站整理，完整题面与评测规则以 <a href="${url(p)}" target="_blank" rel="noopener noreferrer">AtCoder 官方题目</a> 为准。</p><details class="answer"><summary>提示（独立尝试后再展开）</summary><p>${p.hint}</p></details><nav class="actions" aria-label="题目导航">${i>0?`<a class="button" href="#/assessment/${i}">← 上一题</a>`:''}<a class="button" href="#/assessment">返回题单</a>${i<4?`<a class="button" href="#/assessment/${i+2}">下一题 →</a>`:''}</nav></article>`;}
const main=document.getElementById('content');
function render(){
 const raw=location.hash.slice(1).split('/').filter(Boolean).join('/');
 const parts=(aliases[raw]||raw).split('/').filter(Boolean),section=parts[0]||'',idx=Number(parts[1])-1;
 const group=groups.find(g=>g[0]===section),valid=group&&Number.isInteger(idx)&&idx>=0&&idx<group[2].length;
 const pageTitle=valid?group[2][idx]:group?group[1]:section?'页面未找到':'知识点索引';
 const sidebar=`<a href="#/" ${!section?'aria-current="page"':''}>全部知识点</a>`+groups.map(g=>`<details ${section===g[0]||!section?'open':''}><summary>${g[1]}</summary><nav>${g[2].map((n,i)=>`<a href="#/${g[0]}/${i+1}" ${section===g[0]&&idx===i?'aria-current="page"':''}>${n}</a>`).join('')}</nav></details>`).join('');
 document.getElementById('sidebar').innerHTML=sidebar;
 document.getElementById('topic-tabs').innerHTML=`<a href="#/" ${!section?'aria-current="page"':''}>全部知识点</a>`+groups.map(g=>`<a href="#/${g[0]}" ${section===g[0]?'aria-current="page"':''}>${g[0]==='next'?'进阶算法':g[1]}</a>`).join('');
 let body='';
 if(section==='assessment')body=valid?problemPage(problems[idx],idx):overview();
 else if(group){body=valid?(lessons[section+'/'+(idx+1)]?'<article class="lesson">'+lessons[section+'/'+(idx+1)]+'</article>':`<article class="lesson"><p>${plans[section][idx]}</p><h2>学习目标</h2><p>能解释概念，并独立写出对应程序。</p><div class="callout"><p>这是后续学习的大纲条目，内容随学习进度补充。</p></div></article>`):`<div class="index">${group[2].map((n,i)=>`<section><h2><a href="#/${section}/${i+1}">${n}</a></h2><p>${plans[section][i]}</p></section>`).join('')}</div>`;}
 else if(section)body='<p>这个目录地址不存在。</p><a href="#/">返回知识点索引</a>';
 else body=`<p class="intro">Python 基础、算法与科研工具，按知识点查阅。</p><div class="callout"><p><strong>异常处理与调试</strong></p><p>读取报错、定位问题，完成JSON读取与异常处理。</p><a href="#/environment/6">周日课堂课件 →</a> · <a href="#/homework/10">调试练习包 →</a> · <a href="#/modules/11">递归AtCoder题单 →</a></div><div class="index">${groups.map(g=>`<section><h2><a href="#/${g[0]}">${g[1]}</a></h2><ul>${g[2].map((n,i)=>`<li><a href="#/${g[0]}/${i+1}">${n}</a></li>`).join('')}</ul></section>`).join('')}</div>`;
 main.innerHTML=`<details class="mobile-nav"><summary>知识点目录</summary><nav>${sidebar}</nav></details>${section?'<p class="breadcrumb"><a href="#/">知识点索引</a> / '+(valid?`<a href="#/${section}">${group[1]}</a>`:pageTitle)+'</p>':''}<h1>${pageTitle}</h1>${body}`;
 document.title=pageTitle+' · Sean 的 Python 学习笔记';window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){main.focus();return;}render();main.focus({preventScroll:true});});render();

</script><noscript>请启用 JavaScript 查看课程目录。</noscript></body></html>
