：先用w写output/log.txt，再用a追加第二行，用r读回，核对两行。随后用DictReader读CSV，将value转为float，计算count和mean。用dump保存output/summary.json，再用load读取，打印并核对结果。使用with和utf-8；输出不要覆盖原始数据。</p><p>自测：原数据count=5、mean=13.6；复制CSV后增加A,14，重新运行应为6、约13.6667。将统计结果再用csv.writer写成summary.csv，第一行为count,mean。原数据按device计数A:2、B:2、C:1为选做。</p><h2>5. 投票规则迁移（选做，新题）</h2><p>ABC008 B · 投票</p><p>统计N个人的投票，输出最高票姓名。本题允许并列最高，输出其中任意一个即可，N不超过50。</p><p>练习要求：对比第1题保证唯一最高的条件，独立实现，不必增加字典序排序。</p><p>自测：N=4，依次bob、sean、bob、sean，输出bob或sean都符合要求。只出现一个姓名时也应正确。</p><p><a href=\"https://atcoder.jp/contests/abc008/tasks/abc008_2\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>每题保留源代码和自编测试，文件练习保留生成文件。完整题意以AtCoder原题为准。</p>", "modules/7": "<h2>今天要能独立完成什么</h2><p>解释递归何时停止、结果如何返回。</p><p>用循环和递归分别计算同一个结果。</p><p>用 next 取值，用 yield 逐个产生数据。</p><h2>函数调用与返回值</h2><pre><code>def double(x):\n    return x * 2\n\na = double(3)\nb = double(a)\nprint(a, b)</code></pre><p>先预测输出，再解释return把值交给谁。</p><p>print负责显示，return负责把值交回调用处。</p><h2>递归：同一个函数处理更小的问题</h2><pre><code>def countdown(n):\n    if n == 0:\n        print(&quot;Go!&quot;)\n        return\n    print(n)\n    countdown(n - 1)\n\ncountdown(3)</code></pre><p>先约定n是非负整数。</p><p>终止条件是n == 0，每次调用把n减1。</p><h2>调用过程中的每个n</h2><p>countdown(3)：打印3，等待countdown(2)</p><p>countdown(2)：打印2，等待countdown(1)</p><p>countdown(1)：打印1，等待countdown(0)</p><p>countdown(0)：打印Go!，返回</p><p>最内层先结束，外层再依次结束。</p><h2>阶乘：把大问题写成小问题</h2><pre><code>def factorial(n):\n    if n == 0:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(4))</code></pre><p>0! = 1，n! = n × (n−1)!。</p><p>本课只处理非负整数，小范围测试即可。</p><h2>factorial(3)：调用下去</h2><p>factorial(3) 等待 3 × factorial(2)</p><p>factorial(2) 等待 2 × factorial(1)</p><p>factorial(1) 等待 1 × factorial(0)</p><p>factorial(0) 直接返回 1</p><p>等待期间，外层保留自己的n和乘法。</p><h2>factorial(3)：返回上来</h2><p>factorial(0) 返回 1</p><p>factorial(1) 算出 1 × 1，返回 1</p><p>factorial(2) 算出 2 × 1，返回 2</p><p>factorial(3) 算出 3 × 2，返回 6</p><p>最外层的print最后显示6。</p><h2>循环也能计算阶乘</h2><pre><code>def factorial_loop(n):\n    result = 1\n    for x in range(1, n + 1):\n        result *= x\n    return result\n\nprint(factorial_loop(4))</code></pre><p>累乘变量初始值为1。</p><p>循环没有额外的递归调用栈。</p><h2>常见错误：少了return</h2><pre><code>def bad_sum(n):\n    if n == 0:\n        return 0\n    n + bad_sum(n - 1)\n\nprint(bad_sum(1))</code></pre><p>先运行bad_sum(1)，再运行bad_sum(2)。</p><p>每一层都必须把计算结果交回调用处。</p><h2>独立练习：1加到n</h2><p>编写sum_to(n)，n是0至100的整数。</p><p>先确定n=0返回什么，再写递归关系。</p><p>自测：0得0，1得1，5得15。</p><p>完成后用循环再写一版，对比结果。</p><h2>递归边界与调试</h2><p>没有终止条件，调用会一直继续。</p><p>参数不靠近终止条件，也不会结束。</p><p>调用过深可能触发RecursionError。</p><p>先检查停止条件和参数变化，再考虑写法。</p>", "modules/8": "<h2>循环迭代与迭代器</h2><p>循环迭代：反复执行操作，例如累加。</p><p>可迭代对象：能供for逐个取值，例如列表。</p><p>迭代器：记住当前取到哪里，供next继续取值。</p><h2>iter建立迭代器，next取下一个</h2><pre><code>items = [10, 20, 30]\nit = iter(items)\nprint(next(it))\nprint(next(it))\nprint(next(it))</code></pre><p>先预测三次输出。</p><p>再调用一次next(it)，会遇到StopIteration。</p><h2>列表可再次遍历，迭代器会耗尽</h2><pre><code>items = [10, 20]\nit = iter(items)\nprint(list(it))\nprint(list(it))\nprint(list(items))</code></pre><p>第一次list(it)消耗剩余元素。</p><p>第二次没有剩余值，要重新iter(items)。</p>", "modules/9": "<h2>生成器：用yield逐个产生值</h2><pre><code>def numbers():\n    yield 10\n    yield 20\n\ng = numbers()\nprint(next(g))\nprint(next(g))</code></pre><p>调用函数先得到生成器对象。</p><p>执行next时才开始运行，到yield处暂停。</p><h2>暂停之后，从哪里继续？</h2><pre><code>def demo():\n    print(&quot;A&quot;)\n    yield 10\n    print(&quot;B&quot;)\n    yield 20\ng = demo()\nprint(next(g))\nprint(next(g))</code></pre><p>g = demo()时不会打印A。</p><p>两次next之间，函数保留当前位置。</p><h2>生成器也可以直接交给for</h2><pre><code>def squares(n):\n    for x in range(1, n + 1):\n        yield x * x\n\nfor value in squares(4):\n    print(value)</code></pre><p>每次循环请求一个值。</p><p>生成器函数结束时，for自动停止。</p><h2>生成器同样会耗尽</h2><pre><code>g = squares(3)\nprint(sum(g))\nprint(list(g))\nprint(list(squares(3)))</code></pre><p>sum(g)已取完生成器中的值。</p><p>再次计算需要重新调用squares(3)。</p><h2>独立练习：逐个产生偶数</h2><p>编写evens(n)，产生0至n以内的偶数。</p><p>要求使用yield，n是非负整数。</p><p>自测：n=0产生[0]，n=5产生[0,2,4]。</p><p>用for打印，再用新的生成器计算总和。</p><h2>拓展：CSV逐行提供数值</h2><pre><code>def iter_values(path):\n    with open(path, encoding=&quot;utf-8&quot;,\n              newline=&quot;&quot;) as f:\n        for row in csv.DictReader(f):\n            yield float(row[&quot;value&quot;])</code></pre><p>文件路径由调用者传入。</p><p>for消费生成器时，文件在with范围内保持打开。</p><h2>拓展：一次遍历计算统计量</h2><pre><code>count = 0\ntotal = 0\nfor value in iter_values(DATA / &quot;measurements.csv&quot;):\n    count += 1\n    total += value\nmean = total / count if count else None\nresult = {&quot;count&quot;: count, &quot;mean&quot;: mean}</code></pre><p>同一次遍历中同时累计条数和总和。</p><p>直接在脚本的with内遍历CSV也能逐行处理。</p>", "modules/10": "<div class=\"callout\"><p><a href=\"#/modules/11\">打开递归与yield课堂题单：四道AtCoder题＋生成器改写 →</a></p></div><p>2026-11-21 · 课前准备：带上投票、栈、队列源文件和CSV/JSON练习。</p><details open><summary>02 · 今天要能独立完成什么</summary><h2>今天要能独立完成什么</h2><p>解释递归何时停止、结果如何返回。</p><p>用循环和递归分别计算同一个结果。</p><p>用 next 取值，用 yield 逐个产生数据。</p></details><details><summary>03 · 作业复盘：先运行，再解释</summary><h2>作业复盘：先运行，再解释</h2><p>投票题：新姓名第一次出现时怎么计数？</p><p>同样加入4、7，栈与队列分别先取出谁？</p><p>CSV统计完成后，JSON是否真的保存并读回？</p></details><details><summary>04 · 文件练习的最后一步</summary><h2>文件练习的最后一步</h2><pre><code>with open(OUT / &quot;summary.json&quot;, &quot;w&quot;,\n          encoding=&quot;utf-8&quot;) as f:\n    json.dump(result, f, ensure_ascii=False)\nwith open(OUT / &quot;summary.json&quot;, &quot;r&quot;,\n          encoding=&quot;utf-8&quot;) as f:\n    saved = json.load(f)\nprint(saved[&quot;count&quot;], saved[&quot;mean&quot;])</code></pre><p>result已包含count和mean，OUT指向输出目录。</p><p>读取后的saved仍可用字典的键访问。</p></details><details><summary>05 · 函数调用与返回值</summary><h2>函数调用与返回值</h2><pre><code>def double(x):\n    return x * 2\n\na = double(3)\nb = double(a)\nprint(a, b)</code></pre><p>先预测输出，再解释return把值交给谁。</p><p>print负责显示，return负责把值交回调用处。</p></details><details><summary>06 · 递归：同一个函数处理更小的问题</summary><h2>递归：同一个函数处理更小的问题</h2><pre><code>def countdown(n):\n    if n == 0:\n        print(&quot;Go!&quot;)\n        return\n    print(n)\n    countdown(n - 1)\n\ncountdown(3)</code></pre><p>先约定n是非负整数。</p><p>终止条件是n == 0，每次调用把n减1。</p></details><details><summary>07 · 调用过程中的每个n</summary><h2>调用过程中的每个n</h2><p>countdown(3)：打印3，等待countdown(2)</p><p>countdown(2)：打印2，等待countdown(1)</p><p>countdown(1)：打印1，等待countdown(0)</p><p>countdown(0)：打印Go!，返回</p><p>最内层先结束，外层再依次结束。</p></details><details><summary>08 · 阶乘：把大问题写成小问题</summary><h2>阶乘：把大问题写成小问题</h2><pre><code>def factorial(n):\n    if n == 0:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(4))</code></pre><p>0! = 1，n! = n × (n−1)!。</p><p>本课只处理非负整数，小范围测试即可。</p></details><details><summary>09 · factorial(3)：调用下去</summary><h2>factorial(3)：调用下去</h2><p>factorial(3) 等待 3 × factorial(2)</p><p>factorial(2) 等待 2 × factorial(1)</p><p>factorial(1) 等待 1 × factorial(0)</p><p>factorial(0) 直接返回 1</p><p>等待期间，外层保留自己的n和乘法。</p></details><details><summary>10 · factorial(3)：返回上来</summary><h2>factorial(3)：返回上来</h2><p>factorial(0) 返回 1</p><p>factorial(1) 算出 1 × 1，返回 1</p><p>factorial(2) 算出 2 × 1，返回 2</p><p>factorial(3) 算出 3 × 2，返回 6</p><p>最外层的print最后显示6。</p></details><details><summary>11 · 循环也能计算阶乘</summary><h2>循环也能计算阶乘</h2><pre><code>def factorial_loop(n):\n    result = 1\n    for x in range(1, n + 1):\n        result *= x\n    return result\n\nprint(factorial_loop(4))</code></pre><p>累乘变量初始值为1。</p><p>循环没有额外的递归调用栈。</p></details><details><summary>12 · 常见错误：少了return</summary><h2>常见错误：少了return</h2><pre><code>def bad_sum(n):\n    if n == 0:\n        return 0\n    n + bad_sum(n - 1)\n\nprint(bad_sum(1))</code></pre><p>先运行bad_sum(1)，再运行bad_sum(2)。</p><p>每一层都必须把计算结果交回调用处。</p></details><details><summary>13 · 独立练习：1加到n</summary><h2>独立练习：1加到n</h2><p>编写sum_to(n)，n是0至100的整数。</p><p>先确定n=0返回什么，再写递归关系。</p><p>自测：0得0，1得1，5得15。</p><p>完成后用循环再写一版，对比结果。</p></details><details><summary>14 · 递归边界与调试</summary><h2>递归边界与调试</h2><p>没有终止条件，调用会一直继续。</p><p>参数不靠近终止条件，也不会结束。</p><p>调用过深可能触发RecursionError。</p><p>先检查停止条件和参数变化，再考虑写法。</p></details><details><summary>15 · 循环迭代与迭代器</summary><h2>循环迭代与迭代器</h2><p>循环迭代：反复执行操作，例如累加。</p><p>可迭代对象：能供for逐个取值，例如列表。</p><p>迭代器：记住当前取到哪里，供next继续取值。</p></details><details><summary>16 · iter建立迭代器，next取下一个</summary><h2>iter建立迭代器，next取下一个</h2><pre><code>items = [10, 20, 30]\nit = iter(items)\nprint(next(it))\nprint(next(it))\nprint(next(it))</code></pre><p>先预测三次输出。</p><p>再调用一次next(it)，会遇到StopIteration。</p></details><details><summary>17 · 列表可再次遍历，迭代器会耗尽</summary><h2>列表可再次遍历，迭代器会耗尽</h2><pre><code>items = [10, 20]\nit = iter(items)\nprint(list(it))\nprint(list(it))\nprint(list(items))</code></pre><p>第一次list(it)消耗剩余元素。</p><p>第二次没有剩余值，要重新iter(items)。</p></details><details><summary>18 · 生成器：用yield逐个产生值</summary><h2>生成器：用yield逐个产生值</h2><pre><code>def numbers():\n    yield 10\n    yield 20\n\ng = numbers()\nprint(next(g))\nprint(next(g))</code></pre><p>调用函数先得到生成器对象。</p><p>执行next时才开始运行，到yield处暂停。</p></details><details><summary>19 · 暂停之后，从哪里继续？</summary><h2>暂停之后，从哪里继续？</h2><pre><code>def demo():\n    print(&quot;A&quot;)\n    yield 10\n    print(&quot;B&quot;)\n    yield 20\ng = demo()\nprint(next(g))\nprint(next(g))</code></pre><p>g = demo()时不会打印A。</p><p>两次next之间，函数保留当前位置。</p></details><details><summary>20 · 生成器也可以直接交给for</summary><h2>生成器也可以直接交给for</h2><pre><code>def squares(n):\n    for x in range(1, n + 1):\n        yield x * x\n\nfor value in squares(4):\n    print(value)</code></pre><p>每次循环请求一个值。</p><p>生成器函数结束时，for自动停止。</p></details><details><summary>21 · 生成器同样会耗尽</summary><h2>生成器同样会耗尽</h2><pre><code>g = squares(3)\nprint(sum(g))\nprint(list(g))\nprint(list(squares(3)))</code></pre><p>sum(g)已取完生成器中的值。</p><p>再次计算需要重新调用squares(3)。</p></details><details><summary>22 · 独立练习：逐个产生偶数</summary><h2>独立练习：逐个产生偶数</h2><p>编写evens(n)，产生0至n以内的偶数。</p><p>要求使用yield，n是非负整数。</p><p>自测：n=0产生[0]，n=5产生[0,2,4]。</p><p>用for打印，再用新的生成器计算总和。</p></details><details><summary>23 · 拓展：CSV逐行提供数值</summary><h2>拓展：CSV逐行提供数值</h2><pre><code>def iter_values(path):\n    with open(path, encoding=&quot;utf-8&quot;,\n              newline=&quot;&quot;) as f:\n        for row in csv.DictReader(f):\n            yield float(row[&quot;value&quot;])</code></pre><p>文件路径由调用者传入。</p><p>for消费生成器时，文件在with范围内保持打开。</p></details><details><summary>24 · 拓展：一次遍历计算统计量</summary><h2>拓展：一次遍历计算统计量</h2><pre><code>count = 0\ntotal = 0\nfor value in iter_values(DATA / &quot;measurements.csv&quot;):\n    count += 1\n    total += value\nmean = total / count if count else None\nresult = {&quot;count&quot;: count, &quot;mean&quot;: mean}</code></pre><p>同一次遍历中同时累计条数和总和。</p><p>直接在脚本的with内遍历CSV也能逐行处理。</p></details><details><summary>25 · 课堂验收与课后练习</summary><h2>课堂验收与课后练习</h2><p>独立写sum_to，解释终止条件与返回过程。</p><p>预测一个迭代器被消费后的结果。</p><p>独立写evens，解释yield暂停在哪里。</p><p>补齐CSV统计与JSON保存、读取的完整流程。</p></details><p>参考：<a href=\"https://docs.python.org/3/tutorial/classes.html#iterators\">Python迭代器与生成器</a>。</p>", "homework/9": "<h2>独立练习：1加到n</h2><p>编写sum_to(n)，n是0至100的整数。</p><p>先确定n=0返回什么，再写递归关系。</p><p>自测：0得0，1得1，5得15。</p><p>完成后用循环再写一版，对比结果。</p><h2>独立练习：逐个产生偶数</h2><p>编写evens(n)，产生0至n以内的偶数。</p><p>要求使用yield，n是非负整数。</p><p>自测：n=0产生[0]，n=5产生[0,2,4]。</p><p>用for打印，再用新的生成器计算总和。</p><h2>课堂验收与课后练习</h2><p>独立写sum_to，解释终止条件与返回过程。</p><p>预测一个迭代器被消费后的结果。</p><p>独立写evens，解释yield暂停在哪里。</p><p>补齐CSV统计与JSON保存、读取的完整流程。</p><p>选做：编写iter_values读取上节CSV，一次遍历计算count和mean，再保存并读取JSON。预期5条、13.6。不要对同一个已耗尽的生成器重复统计。</p><p><a href=\"#/homework/8\">上节作业与示例数据下载</a></p><div class=\"callout\"><p><a href=\"#/modules/11\">打开递归与yield课堂题单：三道AtCoder题＋生成器改写 →</a></p></div>", "modules/11": "<p class=\"intro\">2026-11-21 · 递归课堂加练</p><p>先独立完成阶乘和递归序列，再尝试字符串枚举。yield改写沿用第二题，可用同一个AtCoder题目验证。</p><h2>1. ABC273 A · A Recursive Function</h2><p><a class=\"button\" href=\"https://atcoder.jp/contests/abc273/tasks/abc273_a\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>给定整数N（0 ≤ N ≤ 10）。函数满足f(0)=1，正整数n满足f(n)=n×f(n−1)。输出f(N)。输入只有一行N，输出一个整数。</p><h3>样例</h3><pre><code>输入\n3\n\n输出\n6</code></pre><p>课堂要求：从空文件独立写递归，不使用math.factorial。额外自测N=0时答案为1。</p><details class=\"answer\"><summary>提示与代码骨架（尝试后展开）</summary><p>先写终止条件，再写递归返回值。思考f(3)中哪一层最先返回，少写return会怎样。</p></details><h2>2. ABC247 C · 1 2 1 3 1 2 1</h2><p><a class=\"button\" href=\"https://atcoder.jp/contests/abc247/tasks/abc247_c\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>S₁=[1]，Sₙ由Sₙ₋₁、n、Sₙ₋₁依次拼接而成。输入整数N（1 ≤ N ≤ 16），输出Sₙ的全部元素，以空格分隔。</p><h3>自编样例</h3><pre><code>输入\n3\n\n输出\n1 2 1 3 1 2 1</code></pre><p>先手写N=1、2、3的序列。函数应返回什么类型？数字n与列表[n]有何区别？</p><details class=\"answer\"><summary>提示与代码骨架（尝试后展开）</summary><p>函数返回列表。先得到较小序列，再拼接。print(*列表)将元素逐个输出并默认用空格分隔。</p><pre><code>def build(n):\n    if n == 1:\n        return ______\n    smaller = build(______)\n    return ______\n\nn = int(input())\nprint(*build(n))</code></pre></details><p>完成后解释：序列长度为什么是2ⁿ−1？</p><h2>3. ABC029 C · Brute-force Attack</h2><p><a class=\"button\" href=\"https://atcoder.jp/contests/abc029/tasks/abc029_c\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>输入整数N（1 ≤ N ≤ 8），按字典序输出全部长度为N、只含a、b、c的字符串。每个字符串单独一行。</p><h3>样例</h3><pre><code>输入\n2\n\n输出\naa\nab\nac\nba\nbb\nbc\nca\ncb\ncc</code></pre><details class=\"answer\"><summary>提示与代码骨架（尝试后展开）</summary><p>参数s保存当前已经拼好的字符串。长度达到N时输出并返回，否则依次尝试添加a、b、c。</p><pre><code>n = int(input())\n\ndef dfs(s):\n    if ______:\n        print(s)\n        return\n    for ch in &quot;abc&quot;:\n        dfs(______)\n\ndfs(&quot;&quot;)</code></pre></details><p>追问：输出aa后，程序如何回到上一层继续产生ab？N=2时一共输出多少行？</p><h2>4. yield练习：改写第二题</h2><p>将返回列表的build改为生成器sequence，逐个产生序列元素。这版仍可提交ABC247 C。先使用for配合yield，暂不要求yield from。</p><details class=\"answer\"><summary>提示与代码骨架（尝试后展开）</summary><p>先产生左侧较小序列，再产生中间的n，最后产生右侧较小序列。</p><pre><code>def sequence(n):\n    if n == 1:\n        yield 1\n        return\n    for x in sequence(n - 1):\n        yield ______\n    yield ______\n    for x in sequence(n - 1):\n        yield ______\n\nn = int(input())\nprint(*sequence(n))</code></pre></details><h3>预测输出，再运行验证</h3><pre><code>g = sequence(2)\nprint(next(g))\nprint(list(g))\nprint(list(g))</code></pre><details class=\"answer\"><summary>展开核对输出</summary><pre><code>1\n[2, 1]\n[]</code></pre><p>next先取走1，第一次list取完剩余元素，第二次list已经没有值可取。</p></details><p class=\"note\">中文题意为课堂整理，完整规则以各题AtCoder原题为准。代码中的下划线是待填写位置。</p><h2>5. ABC153 D · Caracal vs Monster</h2><p><a class=\"button\" href=\"https://atcoder.jp/contests/abc153/tasks/abc153_d\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>初始一只血量H的怪物（1 ≤ H ≤ 10¹²）。攻击血量1的怪物会消灭它；攻击血量X&gt;1的怪物，会使它消失并产生两只血量均为X//2的怪物。求消灭全部怪物所需最少攻击次数。</p><h3>样例</h3><pre><code>输入\n4\n\n输出\n7</code></pre><p>先手算H=1、2、3、4。定义solve(h)表示消灭一只血量h的怪物所需总攻击次数，再寻找终止条件和递归关系。</p><details class=\"answer\"><summary>提示与代码骨架</summary><p>两只小怪物相同，只计算一次子问题，结果乘2。别漏掉当前这一击。</p><pre><code>def solve(h):\n    if h == 1:\n        return ______\n    smaller = solve(______)\n    return ______\n\nh = int(input())\nprint(solve(h))</code></pre></details><details class=\"answer\"><summary>核对关系与复杂度</summary><p>solve(h)=1+2×solve(h//2)，solve(1)=1。每次只调用一次子问题，调用深度与时间均为O(log H)。写成两次相同递归会产生大量重复计算。H=1、2、3、4分别得到1、3、3、7。</p></details><h2>6. ABC248 B · Slimes</h2><p><a href=\"https://atcoder.jp/contests/abc248/tasks/abc248_b\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>初始A只史莱姆，每次数量乘K，求达到B只或更多的最少操作次数。定义steps(x)为当前数量x时还需的次数，用递归完成。</p><p>自测：1 4 2 → 2；7 7 10 → 0；3 10 2 → 2。终止条件为什么必须允许超过B？</p>", "environment/5": "<h2>复习：递归结果为什么不对？</h2><pre><code>def total(n):\n    if n == 0:\n        return 0\n    n + total(n - 1)\n\nprint(total(1))</code></pre><p>输入1，预测输出。</p><p>输入2，找到报错发生在哪一层。</p><h2>复习：没有报错也可能不对</h2><pre><code>def numbers():\n    yield 10\n    yield 20\n\ng = numbers()\nprint(sum(g))\nprint(list(g))</code></pre><p>第一次sum已经取完生成器。</p><p>怎样才能再次得到同样的数据？</p><h2>三类问题，三种检查方向</h2><p>语法错误：冒号、缩进、括号不符合语法。</p><p>运行时异常：执行到某一步无法继续。</p><p>逻辑错误：程序能结束，但结果不符合题意。</p><p>每次先写清楚“预期结果”和“实际结果”。</p><h2>Traceback：先看最后一行</h2><pre><code>Traceback (most recent call last):\n  File &quot;demo.py&quot;, line 5, in &lt;module&gt;\n    print(mean([]))\n  File &quot;demo.py&quot;, line 2, in mean\n    return sum(values) / len(values)\nZeroDivisionError: division by zero</code></pre><p>先读异常类型和原因。</p><p>再找自己的文件、行号与调用路径。</p><h2>熟悉的错误名称</h2><p>NameError：名字未定义，先查拼写和初始化。</p><p>TypeError：类型不能这样运算，例如&quot;3&quot; + 1。</p><p>ValueError：值无法转换，例如int(&quot;abc&quot;)。</p><p>KeyError：字典里没有这个键。</p><p>IndexError：列表下标超出范围。</p><h2>print调试：看值，也看类型</h2><pre><code>row = {&quot;value&quot;: &quot;12.5&quot;}\nvalue = row[&quot;value&quot;]\nprint(repr(value), type(value))\nvalue = float(value)\nprint(value + 1)</code></pre><p>repr可显示字符串的引号和隐藏空白。</p><p>每次只验证一个猜想，再用同一输入重跑。</p><h2>VS Code：断点与单步</h2><p>在行号左侧设置断点。</p><p>运行和调试，选择当前Python文件。</p><p>Step Over：执行当前行，不进入函数内部。</p><p>Step Into：进入函数，查看参数与局部变量。</p><p>Call Stack：切换不同调用层，观察各层n。</p><h2>断点练习：少加了哪个数？</h2><pre><code>n = 3\nresult = 0\nfor i in range(1, n):\n    result += i\nprint(result)</code></pre><p>先算出n=3时的正确结果。</p><p>观察每轮i和result，定位遗漏。</p><h2>异常处理：给预期失败安排分支</h2><pre><code>text = input(&quot;整数：&quot;)\ntry:\n    n = int(text)\nexcept ValueError:\n    print(&quot;请输入整数&quot;)\nelse:\n    print(n * 2)</code></pre><p>正常转换时进入else。</p><p>转换失败时只执行匹配的except。</p><h2>需要重试时，明确写循环</h2><pre><code>while True:\n    text = input(&quot;整数：&quot;)\n    try:\n        n = int(text)\n    except ValueError:\n        print(&quot;请重试&quot;)\n    else:\n        break</code></pre><p>输入错误后提示并再次读取。</p><p>输入正确后break离开循环。</p><h2>哪些情况应修代码？</h2><p>拼错变量名、漏写return、下标错误：修复代码。</p><p>用户输入无法转换、文件缺失：可安排处理分支。</p><p>except: pass会让错误悄悄消失。</p><p>捕获明确的异常，并给出有用的信息。</p><h2>JSON读取：文件不存在怎么办？</h2><pre><code>from pathlib import Path\nimport json\nBASE = Path(__file__).resolve().parent\ntry:\n    with open(BASE / &quot;data/valid.json&quot;, encoding=&quot;utf-8&quot;) as f:\n        data = json.load(f)\nexcept FileNotFoundError:\n    print(&quot;找不到文件，请检查路径&quot;)</code></pre><p>打开失败会进入FileNotFoundError分支。</p><p>路径相对于脚本目录，避免依赖启动位置。</p><h2>JSON格式错误是另一种失败</h2><pre><code>try:\n    with open(path, encoding=&quot;utf-8&quot;) as f:\n        data = json.load(f)\nexcept FileNotFoundError:\n    print(&quot;文件不存在&quot;)\nexcept json.JSONDecodeError:\n    print(&quot;JSON格式错误&quot;)\nelse:\n    print(data)</code></pre><p>根据失败原因给出不同提示。</p><p>没有异常才打印读取成功的结果。</p><h2>解析成功后，还要检查数据</h2><pre><code>if not isinstance(data, dict):\n    print(&quot;需要一个JSON对象&quot;)\nelif &quot;count&quot; not in data or &quot;mean&quot; not in data:\n    print(&quot;缺少count或mean字段&quot;)\nelse:\n    print(data[&quot;count&quot;], data[&quot;mean&quot;])</code></pre><p>JSON合法，不代表字段一定符合要求。</p><p>先确认是字典，再检查需要的键。</p><h2>with、finally与raise（选讲）</h2><pre><code>def mean(values):\n    if not values:\n        raise ValueError(&quot;没有数据，无法计算平均值&quot;)\n    return sum(values) / len(values)</code></pre><p>with管理文件，离开代码块时关闭文件。</p><p>finally通常用于无论成功或异常都要执行的收尾。</p><p>raise可以主动报告不满足约定的输入。</p><p>参考：<a href=\"https://docs.python.org/3/tutorial/errors.html\">Python异常教程</a>、<a href=\"https://code.visualstudio.com/docs/python/debugging\">VS Code Python调试</a>。</p>", "environment/6": "<p>2026-11-22 · 先复习递归返回值与生成器，再练定位错误和处理预期失败。</p><p><a class=\"button\" download=\"sean-debug-practice.zip\" href=\"data:application/zip;base64,UEsDBBQAAAAIAHCsdV3nR4RaFQEAAEIBAAAOAAAAanNvbl9yZWFkZXIucHlLK8rPVShILMnIyUxSyMwtyC8qUQgAcnm5oJys4vw8Xi5eLifHYFcFW7CcRnx8WmZOany8pl5RanF+TlmqhqZeQWJRal4JL1deYm4qUF1mXkFpiYbSs2ntT3Zvezqh9/2eWUqavFwgm4CyYMP0FZRSEksSlYAMkCaQJcoKIf4u/lYKT/bufz5lRXlmScaL9buf9k/zCvb3e9zQhFDwtKPtacfqp0tank9ocwO6xS+/xC2/NC/Ftagov+jJjj6Qq/VAulxSk/NTUsHCKAZAzH3WMeFp1/ynE/qeLW54Nn/p0/U7X2xc+Hzj7qfzup9O6kkGmljyuKExNzUx7+na6c/WbX2/p+dZ5+SnvRue7578bN4csIkAUEsDBBQAAAAIAHCsdV3JA9qCQAAAAEoAAAALAAAAbG9vcF9idWcucHnLU7BVMOblKkotLs0pAbINeLnS8osUMhUy8xSKEvPSUzUMdRTyNK14uRSAAKpM21Yhk5eroCgzr0QDIqTJywUAUEsDBBQAAAAIAHCsdV3vP3P+RwAAAGcAAAAOAAAAbW9uc3Rlcl9idWcucHlLSU1TSCwpSUzOLtbI0LTi5VIAgsw0hQwFW1sFQygfBIpSS0qL8hQMISJQnpGCFkK3gr6CkSYvFy9XQVFmXokGTNxEEygIAFBLAwQUAAAACABwrHVdBBlhNigCAADlAgAACgAAAFJFQURNRS50eHRNUktz0lAU3jvjf8hSF2SaUOrKhdZ/0Bm3DJQMpaUJkwQddigEAvKyQMurvAq1M2pAZ1QIlPwYc27Cir/gCcHq4t7Jved8j3u+HHEBnmL32AMPw3hYlrKnKXtStxYpc95//Ag6d6+PqEMhxJFcFZZJSY6H ails><details><summary>08 · VS Code：断点与单步</summary><h2>VS Code：断点与单步</h2><p>在行号左侧设置断点。</p><p>运行和调试，选择当前Python文件。</p><p>Step Over：执行当前行，不进入函数内部。</p><p>Step Into：进入函数，查看参数与局部变量。</p><p>Call Stack：切换不同调用层，观察各层n。</p></details><details><summary>09 · 断点练习：少加了哪个数？</summary><h2>断点练习：少加了哪个数？</h2><pre><code>n = 3\nresult = 0\nfor i in range(1, n):\n    result += i\nprint(result)</code></pre><p>先算出n=3时的正确结果。</p><p>观察每轮i和result，定位遗漏。</p></details><details><summary>10 · 异常处理：给预期失败安排分支</summary><h2>异常处理：给预期失败安排分支</h2><pre><code>text = input(&quot;整数：&quot;)\ntry:\n    n = int(text)\nexcept ValueError:\n    print(&quot;请输入整数&quot;)\nelse:\n    print(n * 2)</code></pre><p>正常转换时进入else。</p><p>转换失败时只执行匹配的except。</p></details><details><summary>11 · 需要重试时，明确写循环</summary><h2>需要重试时，明确写循环</h2><pre><code>while True:\n    text = input(&quot;整数：&quot;)\n    try:\n        n = int(text)\n    except ValueError:\n        print(&quot;请重试&quot;)\n    else:\n        break</code></pre><p>输入错误后提示并再次读取。</p><p>输入正确后break离开循环。</p></details><details><summary>12 · 哪些情况应修代码？</summary><h2>哪些情况应修代码？</h2><p>拼错变量名、漏写return、下标错误：修复代码。</p><p>用户输入无法转换、文件缺失：可安排处理分支。</p><p>except: pass会让错误悄悄消失。</p><p>捕获明确的异常，并给出有用的信息。</p></details><details><summary>13 · JSON读取：文件不存在怎么办？</summary><h2>JSON读取：文件不存在怎么办？</h2><pre><code>from pathlib import Path\nimport json\nBASE = Path(__file__).resolve().parent\ntry:\n    with open(BASE / &quot;data/valid.json&quot;, encoding=&quot;utf-8&quot;) as f:\n        data = json.load(f)\nexcept FileNotFoundError:\n    print(&quot;找不到文件，请检查路径&quot;)</code></pre><p>打开失败会进入FileNotFoundError分支。</p><p>路径相对于脚本目录，避免依赖启动位置。</p></details><details><summary>14 · JSON格式错误是另一种失败</summary><h2>JSON格式错误是另一种失败</h2><pre><code>try:\n    with open(path, encoding=&quot;utf-8&quot;) as f:\n        data = json.load(f)\nexcept FileNotFoundError:\n    print(&quot;文件不存在&quot;)\nexcept json.JSONDecodeError:\n    print(&quot;JSON格式错误&quot;)\nelse:\n    print(data)</code></pre><p>根据失败原因给出不同提示。</p><p>没有异常才打印读取成功的结果。</p></details><details><summary>15 · 解析成功后，还要检查数据</summary><h2>解析成功后，还要检查数据</h2><pre><code>if not isinstance(data, dict):\n    print(&quot;需要一个JSON对象&quot;)\nelif &quot;count&quot; not in data or &quot;mean&quot; not in data:\n    print(&quot;缺少count或mean字段&quot;)\nelse:\n    print(data[&quot;count&quot;], data[&quot;mean&quot;])</code></pre><p>JSON合法，不代表字段一定符合要求。</p><p>先确认是字典，再检查需要的键。</p></details><details><summary>16 · with、finally与raise（选讲）</summary><h2>with、finally与raise（选讲）</h2><pre><code>def mean(values):\n    if not values:\n        raise ValueError(&quot;没有数据，无法计算平均值&quot;)\n    return sum(values) / len(values)</code></pre><p>with管理文件，离开代码块时关闭文件。</p><p>finally通常用于无论成功或异常都要执行的收尾。</p><p>raise可以主动报告不满足约定的输入。</p></details><details><summary>17 · 独立调试：递归怪物题</summary><h2>独立调试：递归怪物题</h2><pre><code>def attacks(h):\n    if h == 1:\n        return 1\n    return 2 * attacks(h / 2)\n\nprint(attacks(4))</code></pre><p>ABC153 D：血量1需一次攻击。</p><p>更大的怪物分成两只血量h//2的小怪物。</p><p>下面程序有两处错误，先构造小测试。</p></details><details><summary>18 · 综合练习：可靠地读取统计文件</summary><h2>综合练习：可靠地读取统计文件</h2><p>补全json_reader.py，使用具体except。</p><p>valid.json：输出5与13.6。</p><p>missing.json：提示文件不存在。</p><p>broken.json：提示JSON格式错误。</p><p>wrong_shape.json和missing_key.json：提示结构问题。</p></details><details><summary>19 · 课后验收：能解释自己的修改</summary><h2>课后验收：能解释自己的修改</h2><p>独立修复循环边界和递归怪物程序。</p><p>JSON练习至少跑通正常、缺失、格式错误三种情况。</p><p>记录触发输入、异常名称、原因和修改。</p><p>生成器耗尽产生空结果时，解释为什么没有报错。</p></details><h2>2026-11-21 / 22 课堂回顾</h2><p>复习CSV数值转换、字典统计和JSON写入读回；学习递归的终止条件、子问题与返回值，用阶乘、求和、字符串枚举和怪物分裂题练习。认识iter、next、StopIteration与yield。</p><p>区分语法错误、运行时异常和逻辑错误；用print、变量类型、断点与调用栈定位问题。练习具体的try/except分支、输入重试、文件缺失与JSON格式错误，以及else、finally、raise和with。</p><p>关键提醒：枚举abc字符串允许重复，并非不重复排列。递归限制可查询，不能用提高限制代替正确终止条件。怪物题每层只计算一次相同子问题；重复两次会形成随递归深度指数增长的调用树，对H而言约为线性规模。</p><p><a href=\"#/homework/11\">本次综合作业与PDF →</a></p>", "homework/10": "<p><a class=\"button\" download=\"sean-debug-practice.zip\" href=\"data:application/zip;base64,UEsDBBQAAAAIAHCsdV3nR4RaFQEAAEIBAAAOAAAAanNvbl9yZWFkZXI <h3>3. ABC153 D · Caracal vs Monster（必做）</h3><p>一只血量为H的怪物：血量为1时攻击一次即可消灭；否则攻击一次后变成两只血量为H//2的怪物。求全部消灭所需攻击次数，1≤H≤10^12。</p><p><a href=\"https://atcoder.jp/contests/abc153/tasks/abc153_d\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>待调试代码</h3><p>下面程序有两处错误。先用H=4观察错误答案，再用H=3观察终止条件为何没有按预期触发。</p><pre><code>def attacks(h):\n    if h == 1:\n        return 1\n    return 2 * attacks(h / 2)\n\nh = int(input())\nprint(attacks(h))</code></pre><h3>操作要求</h3><p>在函数入口打断点，用Step Into观察H=4时各层h的值，用调用栈区分不同层。修复后用result存一次子问题的返回值，再计算本层答案；每层只递归调用一次。</p><h3>自测</h3><p>H=1 → 1；H=2 → 3；H=3 → 3；H=4 → 7；H=10^12 → 1099511627775。</p><h3>解释题</h3><p>① 为什么必须使用整除？② 当前怪物的那次攻击计入哪里？③ 为什么不应把相同的递归调用写两遍？④ Step Over和Step Into有什么区别？</p><h3>调试说明</h3><p>随代码写四句话：触发问题的输入、预期结果、实际结果或异常名称、修改原因。截图可选，重点是能解释自己的修改。</p><h2>输入与文件：处理明确的失败</h2><h3>4. 输入整数并重试（必做）</h3><p>循环读取输入并转成整数。转换失败时捕获ValueError，输出“请输入整数”后重新输入；成功后跳出循环，输出该整数的平方。使用try / except / else，不用except: pass。</p><h3>自测</h3><p>依次输入abc、3.5、12：前两次各提示一次，最后输出144。再测0 → 0、-3 → 9。解释：except执行后，是什么让程序再次读取输入？</p><h3>5. CSV → JSON → 读回核对（必做）</h3><p>在脚本同目录建立measurements.csv，内容如下。使用csv.DictReader读取，把value转换为float。定义summarize(values)返回包含count和mean的字典；空列表时raise ValueError，并给出明确说明。</p><pre><code>device,value\nA,10\nB,12.5\nA,15\nB,16.5</code></pre><h3>输出要求</h3><p>用with open和json.dump写summary.json，再用json.load读回，打印count与mean。正常数据应得到count=4、mean=13.5。文件使用UTF-8编码。</p><h3>异常测试</h3><p>① 正常文件：输出4与13.5。② 读取不存在的JSON文件：捕获FileNotFoundError并提示。③ 将JSON内容改为{bad：捕获json.JSONDecodeError并提示。④ CSV只保留表头：处理空数据，不生成误导性的统计结果。每个场景单独测试，再恢复正常文件。</p><h3>注意</h3><p>仅在读取成功后使用读出的对象。不要用一个宽泛except吞掉所有错误。最后保留有效的CSV、JSON与Python源码。</p><h2>选做：搜索与生成器</h2><h3>6. ABC029 C · Brute-force Attack（选做）</h3><p>输入N（1≤N≤8），按字典序输出由a、b、c组成的所有长度为N的字符串，允许字符重复。用递归函数dfs(remaining, prefix)，不要使用itertools。</p><p><a href=\"https://atcoder.jp/contests/abc029/tasks/abc029_c\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><h3>自测</h3><p>N=1：依次输出a、b、c。N=2：共9行，从aa到cc。检查输出行数是否为3^N，每行长度是否为N，有无遗漏或重复。</p><h3> d825ghsAAAAAjAQAACgAAAAAAAAAAAAAAtoEAAAAAY291bnRlci5weVBLAQIUABQAAAAIAJd6d10hGt09YgEAAJABAAAKAAAAAAAAAAAAAAC2gegAAABSRUFETUUudHh0UEsBAhQAFAAAAAgAl3p3XTRNdVa9AAAAJgEAAAgAAAAAAAAAAAAAALaBcgIAAHJvYm90LnB5UEsBAhQAFAAAAAgAl3p3XfdMxiB7AAAAfQAAAA0AAAAAAAAAAAAAALaBVQMAAHNpbXVsYXRpb24ucHlQSwUGAAAAAAQABADhAAAA+wMAAAAA\">下载模拟与封装练习包</a></p><p><a href=\"https://atcoder.jp/contests/abc244/tasks/abc244_b\" target=\"_blank\" rel=\"noopener noreferrer\">ABC244 B 原题 ↗</a></p><details open><summary>02 · 今天独立完成什么</summary><h2>今天独立完成什么</h2><p>根据指令更新位置和方向。</p><p>把状态与操作放进一个Robot类。</p><p>用小例子、断点和异常检查边界。</p><p>最后独立写一个有使用规则的计数器。</p></details><details><summary>03 · 热身：方法里为什么写self？</summary><h2>热身：方法里为什么写self？</h2><p>预测两个学生对象的分数。</p><p>指出属性、参数与方法分别是什么。</p><pre><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\na = Student(&quot;Sean&quot;, 80)\nb = Student(&quot;Bob&quot;, 90)\na.score += 5\nprint(a.score, b.score)</code></pre></details><details><summary>04 · 复习：排序规则属于对象行为</summary><h2>复习：排序规则属于对象行为</h2><p>分数高的排前面，同分名字字典序小的在前。</p><p>比较方法返回True或False。</p><pre><code>def __lt__(self, other):\n    return (-self.score, self.name) &lt; (\n        -other.score, other.name\n    )</code></pre></details><details><summary>05 · 模拟的三个问题</summary><h2>模拟的三个问题</h2><p>状态：需要记住什么？</p><p>规则：一条指令改变什么？</p><p>顺序：必须按什么顺序执行？</p><p>每处理一条指令，就得到下一时刻的状态。</p></details><details><summary>06 · 课堂题：ABC244 B</summary><h2>课堂题：ABC244 B</h2><p>机器人从(0, 0)出发，朝东。</p><p>S：向当前方向前进一步。</p><p>R：原地右转90度。</p><p>按顺序执行全部指令，输出最终坐标。</p></details><details><summary>07 · 先用纸笔走一遍</summary><h2>先用纸笔走一遍</h2><p>样例指令SSRS，最终位置为(2, -1)。</p><p>右转只改变朝向，坐标保持原样。</p><pre><code>时刻       指令       x      y      朝向\n开始        -         0      0      东\n第1步       S         1      0      东\n第2步       S         2      0      东\n第3步       R         2      0      南\n第4步       S         2     -1      南</code></pre></details><details><summary>08 · 四个方向如何存储？</summary><h2>四个方向如何存储？</h2><p>编号按右转顺序排列。</p><p>东0、南1、西2、北3；再次右转回到0。</p><pre><code>dx = [1, 0, -1, 0]\ndy = [0, -1, 0, 1]\n\ndirection = 0\ndirection = (direction + 1) % 4</code></pre></details><details><summary>09 · 独立补全状态更新</summary><h2>独立补全状态更新</h2><p>读入N和T，初始化x、y和direction。</p><p>填好两种指令的处理，再输出x、y。</p><pre><code>for command in commands:\n    if command == &quot;R&quot;:\n        direction = __________\n    else:\n        x += __________\n        y += __________</code></pre></details><details><summary>10 · 自测要覆盖不同规则</summary><h2>自测要覆盖不同规则</h2><p>S：只移动。R：只转向。</p><p>RRRRS：转一圈后向东走。</p><p>SRSRSRSR：绕一圈回原点。</p><p>官方第二个样例：0 1。</p></details><details><summary>11 · 调试：错误从哪一步开始？</summary><h2>调试：错误从哪一步开始？</h2><p>这段代码为什么在朝东移动时也改变了y？</p><p>用S作为最小测试，在分支上打断点。</p><pre><code>if command == &quot;S&quot;:\n    if direction == 0:\n        x += 1\n    if direction == 1:\n        y -= 1\n    else:\n        y += 1</code></pre></details><details><summary>12 · 从指令数判断计算量</summary><h2>从指令数判断计算量</h2><p>每条指令处理一次，时间O(N)。</p><p>位置与方向只需固定数量的变量。</p><p>额外状态空间O(1)，输入字符串占O(N)。</p><p>保存每一步历史不是本题的必要条件。</p></details><details><summary>13 · 状态放进一个对象</summary><h2>状态放进一个对象</h2><p>Robot保存x、y和direction。</p><p>turn_right修改朝向。</p><p>forward修改坐标。</p><p>position返回当前位置。</p></details><details><summary>14 · 初始化每一个机器人</summary><h2>初始化每一个机器人</h2><p>每次Robot()都建立一个独立实例。</p><p>初始状态放在__init__中。</p><pre><code>class Robot:\n    def __init__(self):\n        self.x = 0\n        self.y = 0\n        self.direction = 0\n\nr = Robot()\nprint(r.x, r.y)</code></pre></details><details><summary>15 · 方法负责更新状态</summary><h2>方法负责更新状态</h2><p>把以下两个方法放入Robot类。</p><p>调用r.forward()时，self就是r。</p><pre><code>def turn_right(self):\n    self.direction = (self.direction + 1) % 4\n\ndef forward(self):\n    dx = [1, 0, -1, 0]\n    dy = [0, -1, 0, 1]\n    self.x += dx[self.direction]\n    self.y += dy[self.direction]</code></pre></details><details><summary>16 · 返回值与状态修改分别看</summary><h2>返回值与状态修改分别看</h2><p>forward改变对象，默认返回None。</p><p>position负责把当前位置交给调用者。</p><pre><code>def position(self):\n    return self.x, self.y\n\n# 类外调用\nr = Robot()\nr.forward()\nprint(r.position())</code></pre></details><details><summary>17 · 两个对象会互相影响吗？</summary><h2>两个对象会互相影响吗？</h2><p>先预测输出，再运行。</p><p>画两组x、y、direction观察独立状态。</p><pre><code>a = Robot()\nb = Robot()\na.forward()\nb.turn_right()\nb.forward()\nprint(a.position())\nprint(b.position())</code></pre></details><details><summary>18 · 用类重新完成原题</summary><h2>用类重新完成原题</h2><p>输入输出保持题目要求。</p><p>把原来的状态更新替换为方法调用。</p><pre><code>n = int(input())\ncommands = input().strip()\nr = Robot()\nfor command in commands:\n    if command == &quot;R&quot;:\n        r.turn_right()\n    else:\n        r.forward()\nprint(*r.position())</code></pre></details><details><summary>19 · 封装：让操作维护规则</summary><h2>封装：让操作维护规则</h2><p>计数器只允许增加非负次数。</p><p>外部调用add，类负责检查参数。</p><p>count返回当前结果。</p><p>把“怎样存”和“允许怎样改”集中管理。</p></details><details><summary>20 · 公开、约定内部与双下划线</summary><h2>公开、约定内部与双下划线</h2><p>name：普通公开属性。</p><p>_name：约定内部使用。</p><p>__name：触发名称改写，减少意外名称冲突。</p><p>Python双下划线不是安全隔离机制。</p></details><details><summary>21 · 把检查放在修改之前</summary><h2>把检查放在修改之前</h2><p>下面方法需要放在Counter类中。</p><p>非法参数应保持对象原状态。</p><pre><code>def add(self, amount=1):\n    if amount &lt; 0:\n        raise ValueError(&quot;amount must be nonnegative&quot;)\n    self.__count += amount\n\ndef count(self):\n    return self.__count</code></pre></details><details><summary>22 · 独立练习：安全计数器</summary><h2>独立练习：安全计数器</h2><p>补齐Counter类并运行下面程序。</p><p>捕获异常后，计数结果仍应为3。</p><pre><code>c = Counter()\nc.add()\nc.add(2)\ntry:\n    c.add(-1)\nexcept ValueError:\n    print(&quot;invalid&quot;)\nprint(c.count())</code></pre></details><details><summary>23 · 拓展：共享列表的陷阱</summary><h2>拓展：共享列表的陷阱</h2><p>为什么给a加记录后，b也能看到？</p><p>修复方式：在__init__中建立self.values。</p><pre><code>class Experiment:\n    values = []\n\na = Experiment()\nb = Experiment()\na.values.append(10)\nprint(b.values)</code></pre></details><details><summary>24 · 拓展：把对象结果保存成JSON</summary><h2>拓展：把对象结果保存成JSON</h2><p>先把对象状态转换成普通字典。</p><p>再复用上节的json.dump。</p><pre><code>result = {\n    &quot;x&quot;: r.x,\n    &quot;y&quot;: r.y,\n    &quot;direction&quot;: r.direction\n}\nwith open(&quot;robot.json&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n    json.dump(result, f)</code></pre></details><details><summary>25 · 课后独立练习</summary><h2>课后独立练习</h2><p>必做：独立写ABC244 B普通模拟版。</p><p>必做：改为Robot类并通过同一组自测。</p><p>必做：完成Counter的非负检查与异常测试。</p><p>选做：实验记录类、机器人结果保存为JSON。</p></details><details><summary>26 · 离开课堂前能解释这五点</summary><h2>离开课堂前能解释这五点</h2><p>模拟需要记住哪些状态？</p><p>为什么方向更新要对4取模？</p><p>self代表哪个对象？</p><p>改变属性与return有什么区别？</p><p>为什么非法操作要先检查、后修改？</p></details>", "bronze/10": "<h2>今天独立完成什么</h2><p>根据指令更新位置和方向。</p><p>把状态与操作放进一个Robot类。</p><p>用小例子、断点和异常检查边界。</p><p>最后独立写一个有使用规则的计数器。</p><h2>模拟的三个问题</h2><p>状态：需要记住什么？</p><p>规则：一条指令改变什么？</p><p>顺序：必须按什么顺序执行？</p><p>每处理一条指令，就得到下一时刻的状态。</p><h2>课堂题：ABC244 B</h2><p>机器人从(0, 0)出发，朝东。</p><p>S：向当前方向前进一步。</p><p>R：原地右转90度。</p><p>按顺序执行全部指令，输出最终坐标。</p><h2>先用纸笔走一遍</h2><p>样例指令SSRS，最终位置为(2, -1)。</p><p>右转只改变朝向，坐标保持原样。</p><pre><code>时刻       指令       x      y      朝向\n开始        -         0      0      东\n第1步       S         1      0      东\n第2步       S         2      0      东\n第3步       R         2      0      南\n第4步       S         2     -1      南</code></pre><h2>四个方向如何存储？</h2><p>编号按右转顺序排列。</p><p>东0、南1、西2、北3；再次右转回到0。</p><pre><code>dx = [1, 0, -1, 0]\ndy = [0, -1, 0, 1]\n\ndirection = 0\ndirection = (direction + 1) % 4</code></pre><h2>独立补全状态更新</h2><p>读入N和T，初始化x、y和direction。</p><p>填好两种指令的处理，再输出x、y。</p><pre><code>for command in commands:\n    if command == &quot;R&quot;:\n        direction = __________\n    else:\n        x += __________\n        y += __________</code></pre><h2>自测要覆盖不同规则</h2><p>S：只移动。R：只转向。</p><p>RRRRS：转一圈后向东走。</p><p>SRSRSRSR：绕一圈回原点。</p><p>官方第二个样例：0 1。</p><h2>调试：错误从哪一步开始？</h2><p>这段代码为什么在朝东移动时也改变了y？</p><p>用S作为最小测试，在分支上打断点。</p><pre><code>if command == &quot;S&quot;:\n    if direction == 0:\n        x += 1\n    if direction == 1:\n        y -= 1\n    else:\n        y += 1</code></pre><h2>从指令数判断计算量</h2><p>每条指令处理一次，时间O(N)。</p><p>位置与方向只需固定数量的变量。</p><p>额外状态空间O(1)，输入字符串占O(N)。</p><p>保存每一步历史不是本题的必要条件。</p><p><a href=\"#/python/9\">完整课堂课件</a></p>", "python/10": "<h2>热身：方法里为什么写self？</h2><p>预测两个学生对象的分数。</p><p>指出属性、参数与方法分别是什么。</p><pre><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\na = Student(&quot;Sean&quot;, 80)\nb = Student(&quot;Bob&quot;, 90)\na.score += 5\nprint(a.score, b.score)</code></pre><h2>复习：排序规则属于对象行为</h2><p>分数高的排前面，同分名字字典序小的在前。</p><p>比较方法返回True或False。</p><pre><code>def __lt__(self, other):\n    return (-self.score, self.name) &lt; (\n        -other.score, other.name\n    )</code></pre><h2>状态放进一个对象</h2><p>Robot保存x、y和direction。</p><p>turn_right修改朝向。</p><p>forward修改坐标。</p><p>position返回当前位置。</p><h2>初始化每一个机器人</h2><p>每次Robot()都建立一个独立实例。</p><p>初始状态放在__init__中。</p><pre><code>class Robot:\n    def __init__(self):\n        self.x = 0\n        self.y = 0\n        self.direction = 0\n\nr = Robot()\nprint(r.x, r.y)</code></pre><h2>方法负责更新状态</h2><p>把以下两个方法放入Robot类。</p><p>调用r.forward()时，self就是r。</p><pre><code>def turn_right(self):\n    self.direction = (self.direction + 1) % 4\n\ndef forward(self):\n    dx = [1, 0, -1, 0]\n    dy = [0, -1, 0, 1]\n    self.x += dx[self.direction]\n    self.y += dy[self.direction]</code></pre><h2>返回值与状态修改分别看</h2><p>forward改变对象，默认返回None。</p><p>position负责把当前位置交给调用者。</p><pre><code>def position(self):\n    return self.x, self.y\n\n# 类外调用\nr = Robot()\nr.forward()\nprint(r.position())</code></pre><h2>两个对象会互相影响吗？</h2><p>先预测输出，再运行。</p><p>画两组x、y、direction观察独立状态。</p><pre><code>a = Robot()\nb = Robot()\na.forward()\nb.turn_right()\nb.forward()\nprint(a.position())\nprint(b.position())</code></pre><h2>用类重新完成原题</h2><p>输入输出保持题目要求。</p><p>把原来的状态更新替换为方法调用。</p><pre><code>n = int(input())\ncommands = input().strip()\nr = Robot()\nfor command in commands:\n    if command == &quot;R&quot;:\n        r.turn_right()\n    else:\n        r.forward()\nprint(*r.position())</code></pre><h2>封装：让操作维护规则</h2><p>计数器只允许增加非负次数。</p><p>外部调用add，类负责检查参数。</p><p>count返回当前结果。</p><p>把“怎样存”和“允许怎样改”集中管理。</p><h2>公开、约定内部与双下划线</h2><p>name：普通公开属性。</p><p>_name：约定内部使用。</p><p>__name：触发名称改写，减少意外名称冲突。</p><p>Python双下划线不是安全隔离机制。</p><h2>把检查放在修改之前</h2><p>下面方法需要放在Counter类中。</p><p>非法参数应保持对象原状态。</p><pre><code>def add(self, amount=1):\n    if amount &lt; 0:\n        raise ValueError(&quot;amount must be nonnegative&quot;)\n    self.__count += amount\n\ndef count(self):\n    return self.__count</code></pre><h2>拓展：共享列表的陷阱</h2><p>为什么给a加记录后，b也能看到？</p><p>修复方式：在__init__中建立self.values。</p><pre><code>class Experiment:\n    values = []\n\na = Experiment()\nb = Experiment()\na.values.append(10)\nprint(b.values)</code></pre><h2>拓展：把对象结果保存成JSON</h2><p>先把对象状态转换成普通字典。</p><p>再复用上节的json.dump。</p><pre><code>result = {\n    &quot;x&quot;: r.x,\n    &quot;y&quot;: r.y,\n    &quot;direction&quot;: r.direction\n}\nwith open(&quot;robot.json&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n    json.dump(result, f)</code></pre><p>参考：<a href=\"https://docs.python.org/3/tutorial/classes.html\">Python 官方类教程</a></p>", "homework/12": "<p><a class=\"button\" download=\"sean-simulation-class.zip\" href=\"data:application/zip;base64,UEsDBBQAAAAIAJd6d13zbmCGwAAAACMBAAAKAAAAY291bnRlci5weUvOSSwuVnDOL80rSS2y4uVSAIKU1DSF+PjMvMyS+HiN4tScNE2oBAgUANXzciEUJqakgNXoKCTmgkyxNURWrQwVfb5r2dN1s57s2PVs6pZnUze83zP7xZb5QMbTXVOedc1+2r4rLDGnNNW1qCi/6MmOKU929D6bsvN517ZnDY24bU4GGYzTfcoKIf4u/lYKz7Z2P5u24en6nS82Lnzc0AhyroEmlGEEY+gaglhPdix5smPV8+41z1d3wzQ08XIBAFBLAwQUAAAACACXenddIRrdPWIBAACQAQAACgAAAFJFQURNRS50eHRFj8tOwlAQhvdN+g5dYgJNW9GFCQsxblxoAk+AyKIJUEKL0R0aoEALkqDc5KouiELBeAmWiw9j57Rd8QoewMSZZDIz+WbmH47hdl0s6+J2KHNRNCZNltljGBfL4UgSqCuDnAG9DIU3uBktZyqqdu1mErSc9ZhGlTGo6Z/kNUmwNCXykUQ4IPFClI5dLmeNfe8B53ZTXlTX7GQD9XtI6ZAER1Nx4VSQNgyUVPuhFgwHRBHdfkGmThLbNBUUElEpFN8gdqttvXcsrYfuxlDvk4QlP6MPBamyMX0yJkVolbBKDPo9DtbJbGGNPo+D+cuw/ff9/lXBOV3suvJtfAOvv0AVvPTTmAzNRiq20lQbwSINmoqyJWNeMOfaGrOTObhq4JOHF7FQnI+EopL5OoVSCkszvlswrJnKwHxRzgPhREiEbNXq9Zeze5TPo6aOfzB03ZyWUbtpzQdnfFD
