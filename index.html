const problems = [{"id":"abc340_b","contest":"abc340","name":"Append","zh":"追加与查询","skill":"列表、下标","summary":"从一个空数列开始，按顺序处理 Q 条操作。1 x 表示在末尾加入 x；2 k 表示输出当前数列倒数第 k 个元素。查询不会删除元素，且保证查询合法。","range":"1 ≤ Q ≤ 100；1 ≤ x ≤ 10⁹；1 ≤ k ≤ 当前数列长度。","format":"第一行 Q，随后 Q 行，每行两个整数。对每条 2 k 操作输出一行答案。","input":"5\n1 20\n1 30\n2 1\n1 40\n2 3","output":"30\n20","hint":"长度为 n 时，最后一个元素的下标是 n−1；倒数第 k 个元素对应什么下标？"},{"id":"abc081_b","contest":"abc081","name":"Shift only","zh":"同时除以 2","skill":"循环、列表、模拟","summary":"给定 N 个正整数。只有当所有数都是偶数时，才能把所有数同时除以 2。求最多能执行多少轮操作。","range":"1 ≤ N ≤ 200；1 ≤ Aᵢ ≤ 10⁹。","format":"第一行 N，第二行 N 个整数。输出最多可执行的轮数。","input":"3\n8 12 40","output":"2","hint":"每轮先检查是否全部为偶数，再决定是否统一修改。出现一个奇数就必须停止。"},{"id":"abc088_b","contest":"abc088","name":"Card Game for Two","zh":"两人取牌","skill":"排序、交替累加","summary":"N 张牌上分别写有一个正整数。Alice 先取，之后两人轮流任取一张，直到牌被取完。两人都采取使自己得分最大的最优策略，求 Alice 的总分减去 Bob 的总分。","range":"1 ≤ N ≤ 100；1 ≤ aᵢ ≤ 100。","format":"第一行 N，第二行 N 个牌面数字。输出两人得分之差。","input":"3\n2 7 4","output":"5","hint":"两人每次会优先拿走怎样的牌？把牌排好后，哪些位置属于 Alice？"},{"id":"abc083_b","contest":"abc083","name":"Some Sums","zh":"数位和筛选","skill":"枚举、数位、函数","summary":"检查 1 到 N 的所有整数。如果某个整数的十进制数位和位于 A 到 B 之间（包含两端），就把这个整数计入答案。输出这些整数的总和。","range":"1 ≤ N ≤ 10⁴；1 ≤ A ≤ B ≤ 36。","format":"一行三个整数 N A B。输出符合条件的整数之和。","input":"20 2 5","output":"84","hint":"枚举候选整数，再用临时变量拆分数位。注意要累加原整数，而不是它的数位和。"},{"id":"abc128_b","contest":"abc128","name":"Guidebook","zh":"餐厅指南","skill":"记录组织、class、多条件排序","summary":"有 N 家餐厅，输入顺序就是它们的编号（从 1 开始）。每家餐厅有城市名和评分，所有评分互不相同。先按城市名字典序升序排列；同一城市内按评分降序排列。按排序结果逐行输出餐厅原编号。","range":"1 ≤ N ≤ 100；城市名为 1～10 个小写英文字母；0 ≤ 评分 ≤ 100，评分两两不同。","format":"第一行 N，随后 N 行城市名和评分。输出 N 行原编号。","input":"6\nkhabarovsk 20\nmoscow 10\nkazan 50\nkazan 35\nmoscow 60\nkhabarovsk 40","output":"3\n4\n6\n1\n5\n2","hint":"一条记录需要保存城市、分数和原编号。比较两条记录时，先判断城市是否相同。"}];
const groups = [["assessment", "课堂练习", ["追加与查询", "同时除以 2", "两人取牌", "数位和筛选", "餐厅指南"]], ["python", "Python", ["输入输出与数据类型", "循环控制与布尔标志", "列表、下标与元组", "函数与数位和", "lambda 与多关键字排序", "class 与自定义比较", "调试与复杂度"]], ["bronze", "基础算法", ["模拟与状态更新", "枚举与分类讨论", "排序与简单贪心", "计数、集合与映射", "网格与坐标", "递归与递推", "栈与队列", "综合训练"]], ["next", "后续进阶", ["前缀和与差分", "二分查找与答案", "双指针与滑动窗口", "DFS 与 BFS"]], ["homework", "课后练习", ["第 1 课作业"]]];
const plans = {"python": ["读取输入并转换类型，区分 /、// 与 %。", "明确循环停止条件、break 的作用与计数位置。", "掌握 append、负数索引、原地修改和 tuple。", "用函数封装重复逻辑，使用字符串遍历数位。", "把升降序规则写成 tuple key，理解 lambda。", "理解实例、属性、__init__ 和 __lt__。", "先构造小数据，再用 print 或断点定位问题。"], "bronze": ["明确当前状态，先判断再更新。", "确定枚举范围，分析遗漏与复杂度。", "解释排序后的选择，主动寻找反例。", "按需求使用计数数组、set 和 dict。", "处理行列坐标、边界与邻格。", "区分递归调用和递推计算，明确终止条件。", "理解后进先出与先进先出，按需要使用列表或 deque。", "练习独立读题、实现、自测和复盘。"], "next": ["下一课计划：从区间和理解前缀和，再学习差分与区间修改。", "先理解有序查找，再分析答案的单调性。", "维护移动区间，减少重复计算。", "在模拟与二维遍历稳定后，学习搜索顺序、访问标记和连通性。"], "homework": ["三道必做新题、一个调试练习和一道进阶选做题。"]};
const lessons = {"python/1": "<h2>输入后先确认类型</h2><p>input() 返回字符串。需要整数计算时用 int 转换；一行多个整数可用 split 和 map。</p><pre><code>n = int(input())\na, b = map(int, input().split())\nword = input().strip()</code></pre><h2>除法、整除与取模</h2><p>/ 返回浮点数；// 对商向下取整。处理题目中的正整数减半时使用 //。负数整除也向下取整，不是向零截断。</p><pre><code>print(9 / 2)    # 4.5\nprint(9 // 2)   # 4\nprint(9 % 2)    # 1\nprint(-3 // 2)  # -2</code></pre><h2>命名与输出</h2><p>用 nums、values、names 等名字保存列表，不用 list、str、sum 作变量名，以免遮蔽内置工具。提交程序时不要输出“请输入”等提示；调试输出在提交前删除。</p>", "python/2": "<h2>循环条件与计数</h2><p>先写清楚“什么时候继续”和“什么时候停止”。完成一次有效操作后再增加计数，避免停止时多加一次。布尔变量用 True / False，表达意图比字符串开关更清楚。</p><pre><code>value = 20\nsteps = 0\nwhile value &gt; 3:\n    value -= 3\n    steps += 1\nprint(value, steps)  # 2 6</code></pre><h2>while True 与 break</h2><p>先检查能否继续，再更新状态。break 只退出它所在的最近一层循环。多层循环中可用布尔标志把结果传到外层。</p><h2>for-else 的含义</h2><p>else 与 for 对齐。循环正常结束且未执行 break 时，才会执行 else；它不表示“最后一次 if 不成立”。</p><pre><code>values = [2, 4, 7]\nfor x in values:\n    if x % 2 == 1:\n        print(&quot;found odd&quot;)\n        break\nelse:\n    print(&quot;all even&quot;)</code></pre><h2>自己检查</h2><p>把例子分别改成全偶数、首个元素为奇数、最后一个为奇数，预测输出再运行。</p>", "python/3": "<h2>列表与下标</h2><p>长度为 n 的列表，下标范围是 0 到 n−1。倒数第 k 个元素可写 a[len(a)-k] 或 a[-k]，前提是 1 ≤ k ≤ len(a)。</p><pre><code>a = [12, 25, 38]\na.append(49)\nprint(a[-1])        # 49\nprint(a[len(a)-2])  # 38\nprint(a[-2])        # 38</code></pre><h2>修改循环变量不等于修改列表</h2><p>for x in a 中，给 x 重新赋值不会把结果写回原列表。需要保存变化时，用下标赋值或构造新列表。</p><pre><code>a = [8, 10]\nfor i in range(len(a)):\n    a[i] //= 2\nprint(a)  # [4, 5]</code></pre><h2>排序和删除的代价</h2><p>sort() 原地排序，返回 None；sorted(a) 返回新列表。排序通常只需做一次。pop(0) 会移动后续元素，是 O(n) 操作；按下标遍历可避免反复移动。</p><h2>list 与 tuple</h2><p>list 可以修改元素；tuple 的元素位置不能重新赋值。元组适合保存一条固定结构的记录，如 (姓名, 分数)。元组中若包含列表，那个内部列表本身仍可修改。</p>", "python/4": "<h2>把数位处理拆成函数</h2><p>数字转为字符串后逐字符遍历，再将每个字符转为整数。这种写法不依赖固定的位数；下面的函数用于非负整数。</p><pre><code>def digit_sum(n):\n    total = 0\n    for ch in str(n):\n        total += int(ch)\n    return total\n\nprint(digit_sum(5042))  # 11</code></pre><h2>局部变量与返回值</h2><p>total 每次调用函数时重新初始化。return 把结果交回调用处，print 只负责显示。计算数位和时，不要误改枚举候选数的变量。</p><h2>练习方向</h2><p>把函数分别用于 0、单个数字、带有 0 的整数和更多位的整数。区分“数字本身”“数位和”“满足条件的个数”和“满足条件的数字总和”。</p>", "python/5": "<h2>先写排序规则</h2><p>Python 的 tuple 按从左到右的顺序比较：第一项相同时再比较第二项。先把排序规则说清楚，再把它写成 key。</p><h2>lambda 和多关键字</h2><p>lambda 可以理解为只有一个表达式的匿名函数。对数值取负可以让该关键字按降序排列，同时保留其他关键字的升序。</p><pre><code>students = [(&quot;Amy&quot;, 80), (&quot;Bob&quot;, 95), (&quot;Alice&quot;, 95)]\nstudents.sort(key=lambda x: (-x[1], x[0]))\nprint(students)\n# [(&quot;Alice&quot;, 95), (&quot;Bob&quot;, 95), (&quot;Amy&quot;, 80)]</code></pre><h2>等价的 def 写法</h2><p>不熟悉 lambda 时先写普通函数，能更清楚地观察每条记录对应的排序键。</p><pre><code>def rank_key(student):\n    return (-student[1], student[0])\n\nstudents.sort(key=rank_key)</code></pre><h2>常见误区</h2><p>reverse=True 会反转整个排序方向，不能直接表达“一项升序、另一项降序”。同样的 key 会保留原相对顺序，这是 Python 排序的稳定性。涉及原编号时，应把编号与记录一起保存。</p>", "python/6": "<h2>类型、对象与初始化</h2><p>class 定义一种类型；调用类创建一个具体对象（instance）。__init__ 在实例初始化时设置属性；self 表示当前实例。通常简单记录用 tuple 就够了，需要绑定行为或自定义比较时可以使用 class。</p><h2>__lt__ 定义“小于”</h2><p>排序可以调用对象的 __lt__。下面比较分母为正的分数，用交叉相乘避免先转为浮点数；分母为负时先统一符号，分母为零没有定义。</p><pre><code>class Fraction:\n    def __init__(self, numerator, denominator):\n        if denominator == 0:\n            raise ValueError(&quot;zero denominator&quot;)\n        if denominator &lt; 0:\n            numerator = -numerator\n            denominator = -denominator\n        self.numerator = numerator\n        self.denominator = denominator\n\n    def __lt__(self, other):\n        return (self.numerator * other.denominator\n                &lt; other.numerator * self.denominator)\n\nvalues = [Fraction(2, 3), Fraction(1, 2), Fraction(3, 4)]\nvalues.sort()\nfor x in values:\n    print(x.numerator, x.denominator)\n# 1 2\n# 2 3\n# 3 4</code></pre><h2>为什么交叉相乘成立</h2><p>当 b、d 都为正时，a/b &lt; c/d 等价于 a×d &lt; c×b。比较必须严格，不能用 ≤ 代替 &lt;。若题目要求同分时按编号排序，还需要明确处理相等情况。</p>", "python/7": "<h2>先找最小反例</h2><p>先预测一个小输入的正确结果，再运行程序。不要每次只重复测试题目样例。优先检查空操作、单个元素、首尾位置、重复值和刚好满足条件的情况。</p><h2>print 调试</h2><p>打印循环前后的关键变量，观察哪一次状态首次偏离预期。可以把调试信息写到 stderr，最终提交仍建议删除。</p><pre><code>import sys\nvalues = [6, 8]\nfor i in range(len(values)):\n    print(&quot;before&quot;, i, values[i], file=sys.stderr)\n    values[i] //= 2\n    print(&quot;after&quot;, i, values[i], file=sys.stderr)</code></pre><h2>断点与单步</h2><p>在 VS Code 等支持 Python 调试的编辑器中，把断点放在状态更新前，逐行执行，观察变量面板。核对变量的值、类型、循环次数和实际走到的分支。具体启动方式取决于本地解释器和调试配置。</p><h2>粗略估算复杂度</h2><p>列表遍历 O(n)，排序 O(n log n)，列表头部删除 O(n)。若每轮都排序或 pop(0)，总开销可能明显增大。先根据数据规模估算，再决定实现。</p>", "homework/1": "<p class=\"intro\">第 1 课作业 · Python · 2026-10-25</p><p>先完成三道必做新题，再尝试选做题。先自己实现、自测，遇到错误时保留出错输入和修改原因。题意摘要为本站整理，完整要求以 AtCoder 原题为准。</p><h2>必做 · ABC284_A · Sequence of Strings</h2><p>读入 N 个字符串，按输入顺序的逆序逐行输出。注意是反转字符串之间的顺序，不是反转每个字符串的字符。</p><p><a href=\"https://atcoder.jp/contests/abc284/tasks/abc284_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：先用下标循环完成；再思考负数索引或 reversed 的等价写法。不要用 sort 改变原有顺序。</p><p>自测方向：自行测试 N=1、含数字的字符串、重复字符串。</p><h2>必做 · ABC187_A · Large Digits</h2><p>输入两个三位整数 A、B，分别计算十进制数位和，输出两个数位和中较大的值。</p><p><a href=\"https://atcoder.jp/contests/abc187/tasks/abc187_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：写一个 digit_sum 函数，用字符串遍历处理数位，不固定拆百位、十位、个位。</p><p>自测方向：自行测试两个数位和相等、数字中含 0、100 与 999。</p><h2>必做 · ABC201_B · Do you know the second highest mountain?</h2><p>每座山有名称和高度，各山的名字与高度均互不相同。输出第二高的山的名称。</p><p><a href=\"https://atcoder.jp/contests/abc201/tasks/abc201_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：用 list/tuple 绑定名称与整数高度，用 key 排序；先确认第二高对应哪个下标。</p><p>自测方向：自行测试只有两座山、输入已经有序，以及高度为 9 与 100 的情况。注意高度必须转为整数。</p><h2>进阶选做 · ABC308_C · Standings</h2><p>第 i 人有 Aᵢ 次正面、Bᵢ 次反面，成功率为 Aᵢ/(Aᵢ+Bᵢ)。按成功率从高到低输出编号；相同成功率按编号从小到大。</p><p><a href=\"https://atcoder.jp/contests/abc308/tasks/abc308_c?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">AtCoder 原题 ↗</a></p><p>练习要求：尝试用 class 与 __lt__ 表达顺序，以交叉相乘比较成功率，避免直接计算浮点数。</p><p>自测方向：先验证相同成功率、成功率为 0 或 1、非常接近的两个成功率。本题数据量更大，属于挑战，未完成可带思路来讨论。</p><h2>必做小练习：定位错误</h2><p>下面的程序想把列表中的每个数减半并保存整数结果。先预测实际输出，再修改程序。解释两个问题分别出在哪里。此题在本地完成。</p><pre><code>values = [8, 12]\nfor x in values:\n    x = x / 2\nprint(values)</code></pre><h2>完成后带来</h2><p>三道必做题的 Python 代码与评测结果；调试小练习的修复代码；至少一个自己构造的测试，以及遇到错误时的修改说明。无需填写本站记录。</p>"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=s=>'<pre><code>'+esc(s)+'</code></pre>';
const external=(url,label)=>`<a class="button" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
const url=p=>`https://atcoder.jp/contests/${p.contest}/tasks/${p.id}?lang=en`;
function rows(){return problems.map((p,i)=>`<section class="problem-row"><span class="number">${String(i+1).padStart(2,'0')}</span><div><h2><a href="#/assessment/${i+1}">${p.name} · ${p.zh}</a></h2><p class="meta">${p.id.toUpperCase()}${i===4?' · 挑战题':''}</p><p class="meta">${p.skill}</p></div></section>`).join('');}
function overview(){return `<p class="intro">Python · AtCoder</p><div class="callout"><p><strong>课堂回顾</strong>：本页保留第一课讲解的五道题。新作业见“课后练习”。</p><p>先独立读题、写代码和自测，再到 AtCoder 原题页面提交。</p></div>${rows()}`;}
function problemPage(p,i){return `<article class="lesson"><p class="intro">第 ${i+1} / 5 题 · ${p.id.toUpperCase()} · ${p.name}</p><p class="meta">训练内容：${p.skill}${i===4?'。本题为挑战题。':''}</p><div class="actions">${external(url(p),'AtCoder 原题')}</div><h2>中文题意</h2><p>${p.summary}</p><h2>输入与输出</h2><p>${p.format}</p><p class="meta">数据范围：${p.range}</p><div class="sample"><div><strong>样例输入</strong>${code(p.input)}</div><div><strong>样例输出</strong>${code(p.output)}</div></div><p class="note">中文题意为本站整理，完整题面与评测规则以 <a href="${url(p)}" target="_blank" rel="noopener noreferrer">AtCoder 官方题目</a> 为准。</p><details class="answer"><summary>提示（独立尝试后再展开）</summary><p>${p.hint}</p></details><nav class="actions" aria-label="题目导航">${i>0?`<a class="button" href="#/assessment/${i}">← 上一题</a>`:''}<a class="button" href="#/assessment">返回题单</a>${i<4?`<a class="button" href="#/assessment/${i+2}">下一题 →</a>`:''}</nav></article>`;}
const main=document.getElementById('content');
function render(){
 const parts=location.hash.slice(1).split('/').filter(Boolean),section=parts[0]||'',idx=Number(parts[1])-1;
 const group=groups.find(g=>g[0]===section),valid=group&&Number.isInteger(idx)&&idx>=0&&idx<group[2].length;
 let pageTitle=valid?group[2][idx]:group?group[1]:'学习大纲';
 const nav=`<a href="#/" ${!section?'aria-current="page"':''}>首页</a>`+groups.map(g=>`<a href="#/${g[0]}" ${section===g[0]?'aria-current="page"':''}>${g[1]}</a>`).join('');
 document.getElementById('tabs').innerHTML=nav;
 const sidebar=`<a href="#/">学习大纲</a>`+groups.map(g=>`<details ${section===g[0]?'open':''}><summary>${g[1]}</summary><nav>${g[2].map((n,i)=>`<a href="#/${g[0]}/${i+1}" ${section===g[0]&&idx===i?'aria-current="page"':''}>${n}</a>`).join('')}</nav></details>`).join('');
 document.getElementById('sidebar').innerHTML=sidebar;
 let body='';
 if(section==='assessment')body=valid?problemPage(problems[idx],idx):overview();
 else if(group){body=valid?(lessons[section+'/'+(idx+1)]?'<article class="lesson">'+lessons[section+'/'+(idx+1)]+'</article>':`<article class="lesson"><p>${plans[section][idx]}</p><h2>学习目标</h2><p>能用自己的话解释概念，并独立写出对应程序。具体课程根据课堂练习结果逐步展开。</p><div class="callout"><p>本页目前是大纲条目；相关新题见课后练习。</p></div><a class="button" href="#/assessment">进入摸底题单 →</a></article>`):`<p class="intro">${section==='next'?'基础稳定后再逐步展开，不作为本次摸底要求。':'按知识点复习，并通过课后练习巩固。'}</p><div class="index">${group[2].map((n,i)=>`<section><h2><a href="#/${section}/${i+1}">${n}</a></h2><p>${plans[section][i]}</p></section>`).join('')}</div>`;}
 else if(section){pageTitle='页面未找到';body='<p>这个目录地址不存在。</p><a href="#/">返回首页</a>';}
 else body=`<p class="intro">Sean 的 Python / USACO 学习笔记</p><div class="callout"><p><strong>第 1 课：Python 基础巩固与自定义排序</strong></p><p>2026-10-25 · 本节知识已整理到 Python 栏目。下一课计划学习前缀和与差分。</p><div class="actions"><a class="button primary" href="#/python">查看本节知识 →</a><a class="button" href="#/homework/1">查看课后作业 →</a></div></div><div class="index">${groups.slice(1).map(g=>`<section><h2><a href="#/${g[0]}">${g[1]}</a></h2><ul>${g[2].map((n,i)=>`<li><a href="#/${g[0]}/${i+1}">${n}</a></li>`).join('')}</ul></section>`).join('')}<section><h2>练习</h2><ul><li><a href="#/assessment">课堂练习 · 5 道 AtCoder 题</a></li></ul><p class="meta">当前以 Python 开展训练；后续课程随学习进度补充。</p></section></div>`;
 main.innerHTML=`<details class="mobile-nav"><summary>浏览学习目录</summary><nav>${nav}</nav></details>${section?'<p class="breadcrumb"><a href="#/">首页</a> / '+(valid?`<a href="#/${section}">${group[1]}</a>`:pageTitle)+'</p>':''}<h1>${pageTitle}</h1>${body}`;
 document.title=pageTitle+' · Sean 的算法竞赛笔记';
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){main.focus();return;}render();main.focus({preventScroll:true});});render();

</script><noscript>请启用 JavaScript 查看课程目录。</noscript></body></html>
