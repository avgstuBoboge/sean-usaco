name: Recover stuck Pages deployment
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recover-pages.yml
permissions:
  pages: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the timed-out Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            repos/avgstuBoboge/sean-usaco/pages/deployments/b02db9c96cf269dc13602a3afd891a9bcba00320/cancel
          echo 'Requested cancellation of the stale Pages deployment.'
